---
# Standalone document (Talos 1.14+) — moved out of machine.network
# (nameservers, disableSearchDomain), which now conflicts with Talos's
# auto-generated ResolverConfig default.
#
# UniFi (.1) first: it holds the mirror-*.68cc.io A records for the registry
# pull-through cache. Synology (.5) answers empty/NOERROR for those names, so
# when queried first it short-circuits resolution and containerd silently
# falls back to upstream. .5 stays as secondary.
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.35.1
searchDomains:
  disableDefault: true
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true  # Requires Cilium socketLB features
  resolveMemberNames: true
