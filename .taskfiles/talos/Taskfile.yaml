---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  generate-config:
    desc: Generate Talos configuration
    dir: "{{.TALOS_DIR}}"
    cmds:
      - talhelper genconfig
      # Seal after generation: clusterconfig files come out of genconfig
      # plaintext; postcmd is not a valid task v3 key (seal never ran).
      - task talos:seal
    preconditions:
      - test -f {{.TALOS_DIR}}/talconfig.yaml
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which talhelper

  seal:
    desc: Encrypt clusterconfig files at rest with SOPS
    dir: "{{.TALOS_DIR}}/clusterconfig"
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which sops
    cmds:
      - |
        COUNT=0
        for file in kubernetes-bee-jms-01.yaml kubernetes-bee-jms-02.yaml kubernetes-bee-jms-03.yaml kubernetes-bigboi-jms-01.yaml talosconfig; do
          if [ ! -f "$file" ]; then
            echo "ERROR: $file not found" >&2
            exit 1
          fi
          if grep -q 'ENC\[AES256_GCM' "$file"; then
            echo "  Skipped $file (already sealed)"
          else
            echo "  Sealing $file"
            sops --encrypt --in-place "$file"
            COUNT=$((COUNT + 1))
          fi
        done

        if [ $COUNT -eq 0 ]; then
          echo "All files already sealed"
        else
          echo "Sealed $COUNT file(s)"
        fi

  unseal:
    desc: Decrypt clusterconfig files (tmp + mv, never sops --in-place decrypt)
    dir: "{{.TALOS_DIR}}/clusterconfig"
    preconditions:
      - test -f {{.ROOT_DIR}}/.sops.yaml
      - test -f {{.SOPS_AGE_KEY_FILE}}
      - which sops
    cmds:
      - |
        COUNT=0
        for file in kubernetes-bee-jms-01.yaml kubernetes-bee-jms-02.yaml kubernetes-bee-jms-03.yaml kubernetes-bigboi-jms-01.yaml talosconfig; do
          if [ ! -f "$file" ]; then
            echo "ERROR: $file not found" >&2
            exit 1
          fi
          if grep -q 'ENC\[AES256_GCM' "$file"; then
            TMP=$(mktemp)
            if ! sops --decrypt "$file" > "$TMP"; then
              echo "ERROR: failed to unseal $file" >&2
              rm -f "$TMP"
              exit 1
            fi
            mv -f "$TMP" "$file"
            chmod 600 "$file"
            echo "  Unsealed $file"
            COUNT=$((COUNT + 1))
          else
            echo "  Skipped $file (not sealed)"
          fi
        done

        if [ $COUNT -eq 0 ]; then
          echo "All files already unsealed"
        else
          echo "Unsealed $COUNT file(s)"
        fi

  apply-node:
    desc: Apply Talos config to a node [IP=required]
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper gencommand apply --node {{.IP}} --extra-flags '--mode={{.MODE}}' | bash
    vars:
      MODE: '{{.MODE | default "auto"}}'
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq
    # Deps run in listed order BEFORE preconditions (task v3): unseal the
    # clusterconfig files first, then the quorum precheck. All 3 bee-jms nodes
    # are control-plane members; rebooting one drops etcd 3->2, so a second
    # failure during the maintenance window is cluster-down. The precheck
    # verifies every OTHER control-plane node is healthy before touching this one.
    deps:
      - unseal
      - task: etcd-quorum-precheck
        vars: { IP: "{{.IP}}" }

  upgrade-node:
    desc: Upgrade Talos on a single node [IP=required]
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper gencommand upgrade --node {{.IP}} --extra-flags "--image='{{.TALOS_IMAGE}}:{{.TALOS_VERSION}}' --timeout=10m --preserve" | bash
    vars:
      TALOS_IMAGE:
        sh: yq '.nodes[] | select(.ipAddress == "{{.IP}}") | .talosImageURL' {{.TALOS_DIR}}/talconfig.yaml
      TALOS_VERSION:
        sh: yq '.talosVersion' {{.TALOS_DIR}}/talenv.yaml
    requires:
      vars: [IP]
    preconditions:
      - talosctl --nodes {{.IP}} get machineconfig
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which kubectl talhelper talosctl yq
    # Deps run in listed order BEFORE preconditions (task v3): unseal first so
    # talosctl/precheck read plaintext, then the quorum precheck (see apply-node).
    deps:
      - unseal
      - task: etcd-quorum-precheck
        vars: { IP: "{{.IP}}" }

  etcd-quorum-precheck:
    desc: Verify all OTHER control-plane peers are healthy before rebooting [IP=required]
    internal: true
    dir: "{{.TALOS_DIR}}"
    requires:
      vars: [IP]
    cmds:
      # List every control-plane IP except the target, then query etcd status
      # against each peer in a single talosctl call. talosctl etcd status
      # exits non-zero if any target node is down/unreachable or its etcd
      # status request errors (live-verified 2026-11-24). A partitioned but
      # alive member will NOT fail this check — compare RAFT INDEX across rows.
      - |
        PEERS=$(yq '.nodes[] | select(.controlPlane == true) | .ipAddress' talconfig.yaml | grep -v '^{{.IP}}$' | tr '\n' ',' | sed 's/,$//')
        if [ -z "$PEERS" ]; then
          echo "ERROR: no control-plane peers found in talconfig.yaml for IP={{.IP}}" >&2
          exit 1
        fi
        echo "Checking etcd quorum on peers: $PEERS"
        talosctl --nodes "$PEERS" etcd status

  upgrade-k8s:
    desc: Upgrade Kubernetes
    dir: "{{.TALOS_DIR}}"
    cmd: talhelper gencommand upgrade-k8s --extra-flags "--to '{{.KUBERNETES_VERSION}}'" | bash
    vars:
      KUBERNETES_VERSION:
        sh: yq '.kubernetesVersion' {{.TALOS_DIR}}/talenv.yaml
    preconditions:
      - talosctl config info
      - test -f {{.TALOSCONFIG}}
      - which talhelper talosctl yq

  reset:
    desc: Resets nodes back to maintenance mode
    dir: "{{.TALOS_DIR}}"
    prompt: This will destroy your cluster and reset the nodes back to maintenance mode... continue?
    cmd: talhelper gencommand reset --extra-flags="--reboot {{- if eq .CLI_FORCE false }} --system-labels-to-wipe STATE --system-labels-to-wipe EPHEMERAL{{ end }} --graceful=false --wait=false" | bash
    preconditions:
      - which talhelper
