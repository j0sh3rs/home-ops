---
name: Validate Secrets

on:
  pull_request:
    paths:
      - "**/*.sops.yaml"
      - ".sops.yaml"
      - "**/*.yaml"
      - "**/*.yml"
  push:
    branches:
      - main
    paths:
      - "**/*.sops.yaml"
      - ".sops.yaml"
      - "**/*.yaml"
      - "**/*.yml"

jobs:
  check-encryption:
    name: Verify SOPS Encryption
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install SOPS
        run: |
          SOPS_VERSION="v3.12.2"
          curl -LO "https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          chmod +x "sops-${SOPS_VERSION}.linux.amd64"
          sudo mv "sops-${SOPS_VERSION}.linux.amd64" /usr/local/bin/sops
          sops --version

      - name: Verify All *.sops.yaml Files Are Encrypted
        run: |
          EXIT_CODE=0
          SOPS_FILES=$(find . -name "*.sops.yaml" -not -path "./.git/*" -not -path "./.sops.yaml" -type f)


          if [ -z "$SOPS_FILES" ]; then
            echo "ℹ️  No *.sops.yaml files found to validate"
            exit 0
          fi

          echo "🔍 Checking SOPS encryption for files:"
          echo "$SOPS_FILES" | sed 's/^/  /'
          echo ""

          for file in $SOPS_FILES; do
            # Check if file has sops metadata section indicating encryption
            if grep -q "^sops:" "$file"; then
              # Verify the sops section has actual encryption metadata
              if grep -A 5 "^sops:" "$file" | grep -q -E "(kms|age|pgp):"; then
                echo "✅ $file is properly encrypted"
              else
                echo "❌ ERROR: $file has 'sops:' section but no encryption metadata!"
                EXIT_CODE=1
              fi
            else
              # Check if file contains unencrypted sensitive data
              if grep -q -E "^(data|stringData):" "$file"; then
                echo "⚠️  WARNING: $file has data/stringData but no SOPS encryption!"
                echo "    This file MUST be encrypted before committing."
                EXIT_CODE=1
              else
                echo "❌ ERROR: $file is not encrypted with SOPS!"
                EXIT_CODE=1
              fi
            fi
          done

          echo ""
          if [ $EXIT_CODE -eq 0 ]; then
            echo "🎉 All *.sops.yaml files are properly encrypted"
          else
            echo "💥 SOPS encryption validation FAILED!"
            echo ""
            echo "To encrypt a file, run:"
            echo "  sops --encrypt --in-place path/to/file.sops.yaml"
            echo ""
            echo "Or use the task runner:"
            echo "  task sops:encrypt-file file=path/to/file.sops.yaml"
          fi

          exit $EXIT_CODE

      - name: Check for Accidentally Committed Plaintext Secrets
        run: |
          ALLOWLIST=".github/secret-scan-allowlist.txt"
          UNALLOWED=""
          FILELIST="$(mktemp)"
          if ! git ls-files -z '*.yaml' '*.yml' > "$FILELIST"; then
            echo "💥 Secret scan error: file enumeration failed — failing the gate"
            exit 1
          fi

          for pattern in "password:" "secret:" "token:" "api[_-]?key:" "private[_-]?key:"; do
            while IFS= read -r -d '' f; do
              case "$f" in
                *.sops.yaml) continue ;;
              esac
              if grep -iq -E "$pattern" -- "$f" 2>/dev/null; then
                rel="$f"
                if ! grep -qxF "$rel" "$ALLOWLIST"; then
                  echo "❌ Un-allowlisted file matches secret pattern '$pattern': $rel"
                  UNALLOWED="$UNALLOWED $rel"
                fi
              else
                rc=$?
                if [ "$rc" -gt 1 ]; then
                  echo "💥 Secret scan error on $f (grep rc=$rc) — failing the gate"
                  exit 1
                fi
                # rc=1 = no match; safe to continue
              fi
            done < "$FILELIST"
          done
          rm -f "$FILELIST"

          if [ -n "$UNALLOWED" ]; then
            echo ""
            echo "💥 Plaintext secret scan FAILED."
            echo "For each file above: if it holds real secrets, move them to a"
            echo "*.sops.yaml file and encrypt (task sops:encrypt-file). If the"
            echo "match is a legitimate key name (e.g. a secretRef), review it"
            echo "and add the path to .github/secret-scan-allowlist.txt (keep sorted)."
            exit 1
          fi
          echo "✅ Plaintext secret scan passed (all matches allowlisted)"
