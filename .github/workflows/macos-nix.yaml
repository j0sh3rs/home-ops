---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: macOS Nix

# Builds the Mac Studio's darwin closure on a GitHub-hosted Apple-silicon
# runner (the in-cluster home-ops-runner is Linux) and posts
# `nix store diff-closures` against the PR base. Merging to main deploys
# (macos/modules/pull-loop.nix), so this check is the only pre-merge gate.
on:
  pull_request:
    paths:
      - "macos/**"
      - ".github/workflows/macos-nix.yaml"
  push:
    branches:
      - "renovate/**"
    paths:
      - "macos/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: Build darwin closure
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Determinate Nix
        uses: DeterminateSystems/determinate-nix-action@96c5ee93a9dddf2830d31e1da6ec719077336c28 # v3

      - name: Unit tests
        run: |
          if [ -f macos/scripts/test-home-ops-pull.sh ]; then bash macos/scripts/test-home-ops-pull.sh; fi
          if [ -d macos/pkgs/omlx-exporter ]; then python3 -m unittest discover -s macos/pkgs/omlx-exporter -v; fi

      - name: Check uv lock is current
        run: |
          if [ -f macos/engines/omlx/pyproject.toml ]; then
            nix run nixpkgs#uv -- lock --check --project macos/engines/omlx
          fi

      - name: Build head closure
        run: nix build ./macos#darwinConfigurations.mac-jms-01.system --out-link result-head --print-build-logs

      - name: Build base closure
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git worktree add /tmp/macos-base "${{ github.event.pull_request.base.sha }}"
          if [ -f /tmp/macos-base/macos/flake.nix ]; then
            nix build /tmp/macos-base/macos#darwinConfigurations.mac-jms-01.system --out-link result-base
          fi

      # diff-closures only reports version changes and >8 KiB size deltas, so
      # config-only PRs (etc files, launchd plists) render empty on their own.
      # Also list the rebuilt store paths and diff the files nix-darwin
      # installs, truncated to stay under GitHub's 65536-char comment limit.
      - name: Diff closures
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          strip() { sed -E 's#^/nix/store/[a-z0-9]{32}-##' | sort -u; }
          section() {
            local title="$1" lang="$2" file="$3" lines
            lines=$(wc -l < "$file" | tr -d ' ')
            echo "<details><summary>${title} (${lines} lines)</summary>"
            echo ''
            echo "\`\`\`${lang}"
            head -n 400 "$file" | cut -c1-300
            if [ "$lines" -gt 400 ]; then echo "... truncated, $((lines - 400)) more lines"; fi
            echo '```'
            echo '</details>'
            echo ''
          }
          {
            echo '## macOS closure diff'
            echo ''
            if [ ! -e result-base ]; then
              echo '_No base closure: first PR that adds macos/._'
            elif [ "$(readlink result-base)" = "$(readlink result-head)" ]; then
              echo '_Closure unchanged: head builds the same system as base._'
            else
              nix store diff-closures ./result-base ./result-head > versions.txt 2>&1 || true
              nix path-info -r ./result-base | sort > base-paths.txt
              nix path-info -r ./result-head | sort > head-paths.txt
              comm -13 base-paths.txt head-paths.txt | strip > added.txt
              comm -23 base-paths.txt head-paths.txt | strip > removed.txt
              : > files.txt
              for d in etc Library/LaunchDaemons Library/LaunchAgents; do
                if [ -e "result-base/$d" ] || [ -e "result-head/$d" ]; then
                  nix shell nixpkgs#diffutils -c diff -ruN "result-base/$d" "result-head/$d" >> files.txt || true
                fi
              done
              echo "Store paths: **$(wc -l < added.txt | tr -d ' ')** new or rebuilt, **$(wc -l < removed.txt | tr -d ' ')** gone."
              echo ''
              if [ -s versions.txt ]; then
                section 'Package versions and sizes' '' versions.txt
              else
                echo '_No package version or size changes (config-only)._'
                echo ''
              fi
              if [ -s files.txt ]; then section 'Changed files (etc, launchd)' diff files.txt; fi
              section 'New or rebuilt store paths' '' added.txt
              if [ -s removed.txt ]; then section 'Removed store paths' '' removed.txt; fi
            fi
          } > comment.md
          cat comment.md

      - name: Comment on PR
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment.md', 'utf8');
            const marker = '## macOS closure diff';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const prior = comments.reverse().find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }
