---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: goldilocks-controller
  namespace: goldilops
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: goldilops
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
