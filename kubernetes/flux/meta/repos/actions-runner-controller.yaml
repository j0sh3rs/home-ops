---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/helmrepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: actions-runner-controller
  namespace: flux-system
spec:
  interval: 2h
  # Legacy-mode ARC chart is NOT published as an OCI artifact (only
  # gha-runner-scale-set is) — this is the classic Helm repo index, hence
  # HelmRepository + sourceRef instead of OCIRepository + chartRef. See
  # docs/runbooks/actions-runner-controller.md for why legacy mode is used.
  url: https://actions-runner-controller.github.io/actions-runner-controller
