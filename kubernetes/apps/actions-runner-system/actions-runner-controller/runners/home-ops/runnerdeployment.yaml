---
# yaml-language-server: $schema=https://raw.githubusercontent.com/actions/actions-runner-controller/master/config/crd/bases/actions.summerwind.dev_runnerdeployments.yaml
# Legacy-mode ARC runner pool for j0sh3rs/home-ops. j0sh3rs is a GitHub USER
# account, not an Org — repo-level runner GROUPS (and therefore the
# gha-runner-scale-set chart) aren't available on personal accounts, which is
# why this uses the classic RunnerDeployment/HorizontalRunnerAutoscaler CRDs
# (actions.summerwind.dev) instead. Scaling is via the HorizontalRunnerAutoscaler
# below — do not set `replicas:` here, it's mutually exclusive with autoscaling.
apiVersion: actions.summerwind.dev/v1alpha1
kind: RunnerDeployment
metadata:
  name: &name home-ops-runner
spec:
  template:
    spec:
      repository: j0sh3rs/home-ops
      # Legacy-mode ARC does NOT auto-label runners with the RunnerDeployment
      # name (unlike gha-runner-scale-set, where the scale-set name IS the
      # match target). Without this, registered runners only carry GitHub's
      # defaults (self-hosted, Linux, X64) and `runs-on: home-ops-runner` in
      # workflows queues forever waiting for a label that's never present —
      # confirmed 2026-08-21 after the controller/image fixes got a runner
      # online and idle, yet a real job still sat queued indefinitely.
      labels:
        - home-ops-runner
      # No image override — ghcr.io/home-operations/actions-runner (used by
      # the previous gha-runner-scale-set setup) is built FROM the plain
      # official ghcr.io/actions/actions-runner base with no entrypoint
      # wrapper. Legacy-mode ARC needs an image whose entrypoint runs
      # config.sh with the RUNNER_TOKEN/RUNNER_NAME/etc. env vars ARC injects
      # — that wrapper only exists in the chart's default runner image
      # (image.actionsRunnerRepositoryAndTag). Without it the container
      # starts unconfigured, run.sh no-ops, and it exits 0 within ~1s with
      # zero log output (confirmed 2026-08-21: exitCode 0, empty logs,
      # "Completed" the same second it started). If bundled kubectl/flux/
      # sops/task are ever needed again, they'd have to come from a custom
      # image built FROM summerwind/actions-runner (has the entrypoint), not
      # from ghcr.io/actions/actions-runner directly.
      serviceAccountName: *name
      # NOT containerMode: kubernetes — that mode requires every job step to
      # declare a `container:`, relaxable via ACTIONS_RUNNER_REQUIRE_JOB_CONTAINER
      # only on newer runner binaries. The chart's default runner image
      # bundles an older one that doesn't honor it, so k8s mode hard-fails
      # every job at "Set up job" with "Jobs without a job container are
      # forbidden on this runner" (confirmed 2026-08-21 via job logs — this
      # is what was actually behind the rapid runner-pod churn, not the
      # autoscaler). None of the 3 workflows targeting this runner
      # (release, label-sync, flux-diff) use Docker or per-step containers —
      # checkout, JS actions, and shell + the `flate` binary — so steps just
      # run directly in the runner container. dockerEnabled: false since
      # nothing here needs a dind sidecar either.
      dockerEnabled: false
      env:
        - name: NODE
          valueFrom:
            fieldRef:
              fieldPath: status.hostIP
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 2Gi
      securityContext:
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: talos
          secret:
            secretName: *name
      volumeMounts:
        - name: talos
          mountPath: /var/run/secrets/talos.dev
          readOnly: true
