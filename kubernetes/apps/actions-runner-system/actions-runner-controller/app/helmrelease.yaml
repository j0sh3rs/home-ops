---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name actions-runner-controller
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: actions-runner-controller
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    fullnameOverride: *name
    # certManagerEnabled: true (chart default) — webhook serving cert is
    # issued via the cert-manager already deployed cluster-wide.
    authSecret:
      enabled: true
      create: false
      name: home-ops-runner-secret
    rbac:
      # Required for runner pods using containerMode: kubernetes (see
      # runners/home-ops/runnerdeployment.yaml) — without this, ARC is
      # blocked from creating the per-runner Role/ServiceAccount it needs
      # to grant itself (privilege-escalation guard).
      allowGrantingKubernetesContainerModePermissions: true
