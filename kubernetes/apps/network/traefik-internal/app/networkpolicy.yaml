---
# Restrict ingress to traefik-internal pods to LAN (192.168.35.0/24) + cluster
# pod CIDR (for kube-probe health checks + prom scrape).
# Traefik-external has no such restriction — it's WAN-reachable via router
# port-forward on 192.168.35.15.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik-internal-ingress
  namespace: network
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: traefik-internal-network
      app.kubernetes.io/name: traefik
  ingress:
    - fromCIDR:
        - 192.168.35.0/24
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "443"
              protocol: UDP
            - port: "5432"  # postgres TCP gateway listener
              protocol: TCP
            - port: "514"  # syslog ingest from LAN devices
              protocol: TCP
            - port: "514"
              protocol: UDP
    # Allow intra-cluster traffic (health probes, ServiceMonitor scrapes,
    # pod-to-pod calls, and reply traffic for connections traefik-internal
    # itself initiates, e.g. the authentik-forwardauth ForwardAuth call).
    # No toPorts restriction here deliberately: fromEntities:cluster is
    # already identity-gated (only real cluster pods match "cluster"), so
    # a port allow-list adds no real security here -- it only adds
    # fragility. Root cause of 2026-08-16 incident (openclaw.68cc.io /
    # llm.68cc.io intermittent 500s/timeouts): under conntrack-table churn
    # (heavy pod Recreate activity), the CT entry for traefik's own
    # outbound ForwardAuth call to authentik-server got evicted before the
    # SYN-ACK reply arrived, so Cilium re-evaluated the reply on traefik's
    # ephemeral source port as a fresh ingress connection -- which this
    # rule's toPorts list (80/443/9100/514) didn't cover, so it got
    # dropped ("Policy denied"), hanging the ForwardAuth call indefinitely.
    # Do not re-add toPorts to this fromEntities:cluster rule without
    # re-reading this note -- the fromCIDR rule above (real LAN clients)
    # is the one that legitimately needs port restriction.
    - fromEntities:
        - cluster
