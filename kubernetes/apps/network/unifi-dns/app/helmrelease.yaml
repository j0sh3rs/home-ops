---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app unifi-dns
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-dns
  interval: 1h
  values:
    fullnameOverride: *app
    provider:
      name: webhook
      webhook:
        image:
          # kashalls/external-dns-unifi-webhook is unmaintained; the project
          # moved to home-operations/external-dns-unifi-webhook (tags have no
          # "v" prefix there).
          # renovate: datasource=docker depName=ghcr.io/home-operations/external-dns-unifi-webhook
          repository: ghcr.io/home-operations/external-dns-unifi-webhook
          tag: 0.10.10@sha256:9ff9e2a9ba4ab42026ae3b500524d26e6f8b47e7c84c3162121c15627d8dcb6b
        env:
          - name: UNIFI_HOST
            value: https://192.168.35.1
          - name: UNIFI_API_KEY
            valueFrom:
              secretKeyRef:
                name: &secret unifi-dns-secret
                key: UNIFI_API_KEY
        livenessProbe:
          httpGet:
            path: /healthz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: http-webhook
          initialDelaySeconds: 10
          timeoutSeconds: 5
    extraArgs:
      - --gateway-name=traefik-internal-gateway
      # Default 5s/10s read/write budget is too tight for the webhook's
      # cold-start login to the UniFi controller (192.168.35.1) — the first
      # sync after every pod restart hit "context canceled" once before
      # self-healing on retry. Give it more headroom.
      - --webhook-provider-read-timeout=15s
      - --webhook-provider-write-timeout=20s
    triggerLoopOnEvent: true
    policy: sync
    sources:
      - gateway-httproute
      - crd
      - service
    txtOwnerId: main
    txtPrefix: k8s.main.
    domainFilters:
      - 68cc.io
    serviceMonitor:
      enabled: true
    podAnnotations:
      secret.reloader.stakater.com/reload: *secret
