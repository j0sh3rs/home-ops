---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app trivy-operator
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: trivy-operator
      version: "0.35.0"
      sourceRef:
        kind: HelmRepository
        name: aquasecurity
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Vulnerability/ConfigAudit/ExposedSecret/ClusterCompliance(CIS)
    # scanning are all chart defaults (operator.vulnerabilityScannerEnabled,
    # operator.configAuditScannerEnabled, operator.exposedSecretScannerEnabled,
    # operator.clusterComplianceEnabled are all true out of the box) - only
    # serviceMonitor needs enabling. vmagent picks it up automatically via
    # selectAllByDefault: true (see ../victoria-metrics/app/vmagent.yaml).
    # trivy-operator's scan-job pods log to stdout, already tailed by
    # Vector's kubernetes_logs source - no log-shipping config needed here.
    serviceMonitor:
      enabled: true
    # accessGlobalSecretsAndServiceAccount (chart default: true) grants the
    # operator ClusterRole create/update/get on Secrets cluster-wide plus
    # get on nodes/proxy, solely to copy imagePullSecrets for scanning
    # private-registry images. This cluster's registries are all anonymous
    # (see the NAS mirrors set up in the sibling /volume1/docker Trivy work)
    # - no imagePullSecrets are actually used anywhere in kubernetes/apps -
    # so disable the extra cluster-wide Secret access.
    operator:
      accessGlobalSecretsAndServiceAccount: false
      # Live cluster observation showed repeated scan-job failures:
      #   1. "Failed to acquire cache or database lock ... cache may be in
      #      use by another process: timeout" - chart default trivy.mode:
      #      Standalone means every one of the up-to-scanJobsConcurrentLimit
      #      (10) concurrent scan jobs embeds its own trivy binary and
      #      independently downloads/locks the shared trivy vulnerability
      #      DB file, so concurrent jobs race each other for the same lock.
      #   2. OOMKilled scan containers on some of this cluster's larger
      #      images - partly a symptom of #1, since redundant per-job DB
      #      downloads/extracts add memory pressure on top of the scan
      #      itself (see trivy.resources below for the direct fix).
      #   3. DB download failing with "dial tcp [2607:...]: connect:
      #      network is unreachable" - the chart default dbRegistry/
      #      javaDbRegistry (mirror.gcr.io) resolved an IPv6 address this
      #      cluster's network can't route to (see trivy.dbRegistry /
      #      trivy.javaDbRegistry below).
      # builtInTrivyServer switches to ClientServer mode with one shared
      # trivy-server StatefulSet that scan jobs talk to over HTTP instead of
      # each embedding its own trivy binary. This eliminates the DB lock
      # contention (#1), and means the DB is downloaded/held in memory once
      # instead of N times, reducing both OOM pressure (#2) and exposure to
      # the flaky IPv6 mirror path (#3).
      builtInTrivyServer: true
    # node-collector jobs (driven by operator.clusterComplianceEnabled and
    # operator.infraAssessmentScannerEnabled, both chart defaults) must run
    # on every node, including the 3 tainted control-plane nodes, to check
    # etcd/kube-scheduler/kube-controller-manager file permissions for CIS
    # compliance. Toleration matches the pattern in
    # ../../kube-system/coredns/app/helm/values.yaml.
    nodeCollector:
      tolerations:
        - key: CriticalAddonsOnly
          operator: Exists
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Chart defaults also hostPath-mount /etc/systemd and /lib/systemd
      # (no explicit `type:`) to check systemd unit file permissions. This
      # cluster runs Talos, which has no systemd and a read-only /lib, so
      # those two mounts would fail (EROFS / path doesn't exist), leaving
      # node-collector pods stuck ContainerCreating. Override volumes/
      # volumeMounts to the chart's full default list minus the two
      # systemd-specific entries - the chart has no separate toggle to
      # disable just the systemd checks.
      volumeMounts:
        - name: var-lib-etcd
          mountPath: /var/lib/etcd
          readOnly: true
        - name: var-lib-kubelet
          mountPath: /var/lib/kubelet
          readOnly: true
        - name: var-lib-kube-scheduler
          mountPath: /var/lib/kube-scheduler
          readOnly: true
        - name: var-lib-kube-controller-manager
          mountPath: /var/lib/kube-controller-manager
          readOnly: true
        - name: etc-kubernetes
          mountPath: /etc/kubernetes
          readOnly: true
        - name: etc-cni-netd
          mountPath: /etc/cni/net.d/
          readOnly: true
      volumes:
        - name: var-lib-etcd
          hostPath:
            path: /var/lib/etcd
        - name: var-lib-kubelet
          hostPath:
            path: /var/lib/kubelet
        - name: var-lib-kube-scheduler
          hostPath:
            path: /var/lib/kube-scheduler
        - name: var-lib-kube-controller-manager
          hostPath:
            path: /var/lib/kube-controller-manager
        - name: etc-kubernetes
          hostPath:
            path: /etc/kubernetes
        - name: etc-cni-netd
          hostPath:
            path: /etc/cni/net.d/
    # dbRegistry/javaDbRegistry: revert to the upstream ghcr.io origin
    # registry instead of the chart-default mirror.gcr.io hop, which hit
    # "dial tcp [2607:f8b0:...]: connect: network is unreachable" on this
    # cluster (mirror.gcr.io resolved an IPv6 address with no route out of
    # the cluster network). Registry/repository are separate fields in this
    # chart's schema (combined at runtime into <registry>/<repository>:tag),
    # so this is set as ghcr.io + aquasecurity/trivy-db (NOT the NAS
    # registry mirrors from the sibling /volume1/docker repo - those live on
    # a docker-only network with no route from cluster pods).
    trivy:
      dbRegistry: ghcr.io
      dbRepository: aquasecurity/trivy-db
      javaDbRegistry: ghcr.io
      javaDbRepository: aquasecurity/trivy-java-db
      # Chart default scan-job limits.memory (500M) is too low for some of
      # this cluster's larger images and produced observed OOMKilled scan
      # containers. Bump moderately above the default for headroom; request
      # is bumped proportionally so the pod isn't wildly overcommitted
      # relative to its limit.
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 2Gi
      server:
        # trivy-server (used once operator.builtInTrivyServer: true) holds
        # the vulnerability DB (a few hundred MB) in memory for all scan
        # jobs to share. Chart default limits.memory (1Gi) is already a
        # reasonable baseline; size up moderately for headroom now that
        # every scan in the cluster goes through this single pod instead of
        # N independent per-job downloads.
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1
            memory: 2Gi
    # Operator's own container was OOMKilled ~2s after start (exit 137),
    # before finishing registering its ~30 controllers/watches - the full
    # scanner suite here (vulnerability + configAudit + exposedSecret +
    # infraAssessment + clusterCompliance, all chart defaults) needs more
    # headroom than the chart's 500Mi default limit at controller-startup
    # time. Node had 60% memory free, so this was a container-limit issue,
    # not node pressure. Bumped in line with the trivy.resources /
    # trivy.server.resources tuning above.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
