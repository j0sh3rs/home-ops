---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
#
# Hand-built: the grafana.com lablabs dashboard (13133) predates the
# firewall-event and per-host metrics. Generated as JSON and pasted in; edit
# the JSON directly. Queries follow the window-value semantics described in
# helmrelease.yaml (sum_over_time, no rate/increase).
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cloudflare-edge
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: Network
  datasources:
    - datasourceName: vmsingle
      inputName: DS_PROMETHEUS
  json: |
    {
      "title": "Cloudflare Edge (68cc.io)",
      "uid": "cloudflare-edge-68cc",
      "tags": [
        "cloudflare",
        "network",
        "waf"
      ],
      "description": "cloudflare-exporter. Series are per-minute windows delayed 5m (see helmrelease.yaml); firewall series can repeat their last value after a quiet minute.",
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "vmsingle",
              "value": "vmsingle"
            },
            "hide": 0
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Edge requests (range)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(sum_over_time(cloudflare_zone_requests_status_country_host{zone=\"68cc.io\"}[$__range]))",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Edge 5xx (range)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(sum_over_time(cloudflare_zone_requests_status_country_host{zone=\"68cc.io\",status=~\"5..\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Firewall events (range)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(sum_over_time(cloudflare_zone_firewall_events_count{zone=\"68cc.io\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Threats (range)",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 0
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum(sum_over_time(cloudflare_zone_threats_total{zone=\"68cc.io\"}[$__range])) or vector(0)",
              "refId": "A",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests/min by host",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (host) (cloudflare_zone_requests_status_country_host{zone=\"68cc.io\"})",
              "legendFormat": "{{host}}",
              "refId": "A",
              "interval": "1m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            }
          }
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Requests/min by edge status",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 4
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (status) (cloudflare_zone_requests_status_country_host{zone=\"68cc.io\"})",
              "legendFormat": "{{status}}",
              "refId": "A",
              "interval": "1m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Firewall events/min by rule",
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (source, rule, action) (cloudflare_zone_firewall_events_count{zone=\"68cc.io\"})",
              "legendFormat": "{{source}} {{rule}} ({{action}})",
              "refId": "A",
              "interval": "1m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            }
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Firewall events by rule (range)",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 0,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sort_desc(sum by (source, rule, action) (sum_over_time(cloudflare_zone_firewall_events_count{zone=\"68cc.io\"}[$__range])))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "events"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "events",
                    "desc": true
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "table",
          "title": "Firewall events by host (range)",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 8,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sort_desc(sum by (host, action) (sum_over_time(cloudflare_zone_firewall_events_count{zone=\"68cc.io\"}[$__range])))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "events"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "events",
                    "desc": true
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 10,
          "type": "table",
          "title": "Firewall events by country (range)",
          "gridPos": {
            "h": 9,
            "w": 8,
            "x": 16,
            "y": 21
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sort_desc(sum by (country, action) (sum_over_time(cloudflare_zone_firewall_events_count{zone=\"68cc.io\"}[$__range])))",
              "refId": "A",
              "instant": true,
              "format": "table"
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true
                },
                "renameByName": {
                  "Value": "events"
                }
              }
            },
            {
              "id": "sortBy",
              "options": {
                "sort": [
                  {
                    "field": "events",
                    "desc": true
                  }
                ]
              }
            }
          ]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Edge 5xx/min by host",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "sum by (host, status) (cloudflare_zone_requests_status_country_host{zone=\"68cc.io\",status=~\"5..\"})",
              "legendFormat": "{{host}} {{status}}",
              "refId": "A",
              "interval": "1m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 60,
                "stacking": {
                  "mode": "normal"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "sum"
              ]
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Origin p95 latency by host (uncached)",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 30
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${DS_PROMETHEUS}"
          },
          "targets": [
            {
              "expr": "max by (host) (cloudflare_zone_requests_origin_status_country_host_p95_ms{zone=\"68cc.io\"})",
              "legendFormat": "{{host}}",
              "refId": "A",
              "interval": "1m"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ms",
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            }
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "calcs": [
                "mean",
                "max"
              ]
            }
          }
        }
      ]
    }
