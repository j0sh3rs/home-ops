---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/alertmanagerconfig_v1alpha1.json
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: alertmanager
spec:
  route:
    receiver: discord
    # Re-notify on long-running critical conditions every 4h (was 12h) so a
    # persistent outage doesn't go quiet after a single notification.
    repeatInterval: 4h
    routes:
      - receiver: blackhole
        matchers:
          - name: alertname
            value: Watchdog
            matchType: =
      - receiver: blackhole
        matchers:
          - name: alertname
            value: InfoInhibitor
            matchType: =
      # Decom gate (home-ops-8bb stage 1): vmalert is now primary pager.
      # Prom is still scraping and evaluating but its notifications must go
      # nowhere to avoid duplicates. Prom alerts carry the external label
      # prometheus=monitoring/prometheus; vmalert alerts have either no
      # prometheus label or prometheus=monitoring/vmagent. Blackholing on
      # the Prom label lets vmalert reach Discord while Prom goes quiet.
      # Drop this route entirely when kube-prometheus-stack Prometheus is
      # deleted later in 8bb (stage 2).
      - receiver: blackhole
        matchers:
          - name: prometheus
            value: monitoring/prometheus
            matchType: =
      - receiver: discord
        matchers:
          - name: severity
            value: critical
            matchType: =
    groupBy:
      - alertname
      - cluster
      - job
    groupInterval: 5m
    groupWait: 1m

  inhibitRules:
    - equal:
        - alertname
        - namespace
      sourceMatch:
        - name: severity
          value: critical
          matchType: =
      targetMatch:
        - name: severity
          value: warning
          matchType: =

  receivers:
    - name: blackhole
    - name: discord
      discordConfigs:
        - apiURL:
            name: alertmanager-secret
            key: DISCORD_WEBHOOK_URL
      # Every alert that already reaches Discord (severity=critical, per the
      # route above) also triggers an openclaw automation-identity triage
      # session -- pure in-cluster traffic, no new exposure. See
      # docs/superpowers/specs/2026-08-15-openclaw-automation-integrations-design.md.
      #
      # DISABLED pending the Discord bot actually existing (Task 5's manual
      # follow-up): openclaw's hooks.mappings entries deliver their result to
      # a placeholder Discord channel ID, so a firing alert today would spawn
      # an unattended agent session with zero operator visibility. Uncomment
      # this block once DISCORD_BOT_TOKEN and the channel-ID placeholders in
      # kubernetes/apps/ai/openclaw/app/configmap.yaml hold real values AND
      # that file's hooks.mappings entries have been uncommented.
      webhookConfigs:
        - url: "http://openclaw.ai.svc.cluster.local:18789/hooks/alertmanager"
          # Alertmanager defaults sendResolved to true, which would fire the
          # trigger twice per alert (once firing, once resolved) with a
          # messageTemplate that gives the agent no way to tell them apart.
          sendResolved: false
          httpConfig:
            bearerTokenSecret:
              name: openclaw-hooks-secret
              key: token
        # argus's forwarder does its own severity filtering
        # (forwarder.investigateSeverities: "critical,warning") and dedupe
        # (forwarder.dedupeTtlSec) -- safe to send every alert this receiver
        # already handles, not just severity=critical. Investigates via
        # argus-holmes and posts a triage summary to Discord (optionally
        # gated behind HITL approve/reject buttons). See
        # kubernetes/apps/ai/argus/, home-ops-qv0.6.
        - url: "http://argus-forwarder.ai.svc.cluster.local/webhook"
          sendResolved: false
