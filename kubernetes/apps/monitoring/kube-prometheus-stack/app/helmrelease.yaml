---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  interval: 1h
  values:
    crds:
      enabled: true
      upgradeJob:
        enabled: true
        forceConflicts: true
    fullnameOverride: prometheus
    nameOverride: prometheus
    cleanPrometheusOperatorObjectNames: true
    alertmanager:
      route:
        main:
          enabled: true
          annotations:
            external-dns.alpha.kubernetes.io/target: 192.168.35.17
          hostnames:
            - alertmanager.68cc.io
          parentRefs:
            - name: traefik-internal-gateway
              namespace: network
          filters:
            - type: ExtensionRef
              extensionRef:
                group: traefik.io
                kind: Middleware
                name: authentik-forwardauth
      alertmanagerSpec:
        alertmanagerConfiguration:
          name: alertmanager
        externalUrl: https://alertmanager.68cc.io
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              resources:
                requests:
                  storage: 1Gi
    kubeEtcd:
      service:
        selector:
          component: etcd
    kubeProxy:
      enabled: false
    # Prometheus server disabled (home-ops-8bb stage 2). vmagent + VMsingle
    # have been primary metrics since c51 parity closed. Keeping the rest of
    # kube-prometheus-stack for Alertmanager + prometheus-node-exporter +
    # kube-state-metrics + prometheus-operator (which provides the SM/PM/PR
    # CRDs that vm-operator auto-converts). The Prometheus CR, thanos
    # sidecar, 60Gi openebs-hostpath PVC, and prometheus.68cc.io HTTPRoute
    # all go away on the next reconcile.
    prometheus:
      enabled: false
    prometheus-node-exporter:
      fullnameOverride: node-exporter
    kube-state-metrics:
      fullnameOverride: kube-state-metrics
      customResourceState:
        enabled: true
        config:
          kind: CustomResourceStateMetrics
          spec:
            resources:
              - groupVersionKind:
                  group: aquasecurity.github.io
                  version: v1alpha1
                  kind: ClusterComplianceReport
                labelsFromPath:
                  name: [metadata, name]
                metrics:
                  - name: "clustercompliancereport_fail_count"
                    help: "Number of failing CIS compliance checks"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, summary, failCount]
                  - name: "clustercompliancereport_pass_count"
                    help: "Number of passing CIS compliance checks"
                    each:
                      type: Gauge
                      gauge:
                        path: [status, summary, passCount]
              - groupVersionKind:
                  group: aquasecurity.github.io
                  version: v1alpha1
                  kind: ExposedSecretReport
                labelsFromPath:
                  name: [metadata, name]
                  namespace: [metadata, namespace]
                metrics:
                  - name: "exposedsecretreport_critical_count"
                    help: "Number of critical-severity exposed secrets found"
                    each:
                      type: Gauge
                      gauge:
                        path: [report, summary, criticalCount]
      # ClusterComplianceReport is cluster-scoped, ExposedSecretReport is
      # namespaced - kube-state-metrics needs list/watch RBAC on both.
      rbac:
        extraRules:
          - apiGroups: ["aquasecurity.github.io"]
            resources: ["clustercompliancereports", "exposedsecretreports"]
            verbs: ["list", "watch"]
    grafana:
      enabled: false
      forceDeployDashboards: true
      operator:
        dashboardsConfigMapRefEnabled: true
        folder: monitoring
        matchLabels:
          grafana.internal/instance: grafana
    additionalPrometheusRulesMap:
      dockerhub-rules:
        groups:
          - name: dockerhub
            rules:
              - alert: DockerhubRateLimitRisk
                annotations:
                  summary: There are {{ $value }} containers pulling from Dockerhub. This may lead to rate limiting.
                expr: count(time() - container_last_seen{image=~"(docker.io).*",container!=""} < 30) > 100
                # warning, not critical: this is a soft capacity-planning signal
                # (anonymous Dockerhub pulls are throttled at 100/6h per IP).
                # Spegel P2P image caching blunts the real risk; a mass restart
                # at worst causes transient ImagePullBackOff, not an outage.
                labels:
                  severity: warning
      oom-rules:
        groups:
          - name: oom
            rules:
              - alert: OomKilled
                annotations:
                  summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
                expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
                labels:
                  severity: critical
