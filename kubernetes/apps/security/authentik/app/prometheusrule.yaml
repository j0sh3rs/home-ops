---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: authentik-alerts
  namespace: security
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: authentik-health
      interval: 30s
      rules:
        - alert: AuthentikServerDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace="security",
              deployment=~"authentik-server.*"
            } == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Authentik server has no available replicas"
            description: >-
              Authentik server deployment has 0 available replicas for 2m.
              Auth will be unavailable for all protected routes.

        - alert: AuthentikWorkerDown
          expr: |
            kube_deployment_status_replicas_available{
              namespace="security",
              deployment=~"authentik-worker.*"
            } == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Authentik worker has no available replicas"
            description: >-
              Authentik worker has 0 available replicas for 5m.
              Background tasks (email, blueprints, outpost sync) will fail.

        - alert: AuthentikOutpostDisconnected
          # authentik_outposts_connected is exported per gunicorn worker (pid
          # label). Only ONE worker process holds the websocket to the embedded
          # outpost; the others permanently export 0. A bare `== 0` matches
          # the idle-worker series and fires a false positive even though
          # forwardAuth is fully functional. Aggregate with max() per outpost
          # so a single connected worker satisfies the check.
          #
          # The websocket also hands off between workers periodically: pid A
          # drops it and pid B doesn't pick it back up for ~5m, so max() dips
          # to 0 for a real but benign window roughly every 60-70m (confirmed
          # via metrics.68cc.io history 2026-09-05, six 300s zero-runs, no pod
          # restarts). ForwardAuth is served over HTTP directly by
          # authentik-server and doesn't depend on this websocket — it's a
          # config-sync/health channel, not the auth data path — so a 5m gap
          # here doesn't break auth. `for: 8m` rides out that known handoff
          # gap with margin while still catching a genuinely stuck outpost.
          expr: |
            max by (namespace, outpost) (
              authentik_outposts_connected{namespace="security"}
            ) == 0
          for: 8m
          labels:
            severity: warning
          annotations:
            summary: "Authentik embedded outpost disconnected"
            description: >-
              No outposts connected to Authentik for 8m — longer than the
              known ~5m websocket handoff between server workers.
              ForwardAuth itself runs over HTTP and is not affected by this
              websocket, but a gap this long may indicate the outpost is
              stuck reconnecting; check `authentik-server` logs.

    - name: authentik-auth
      interval: 60s
      rules:
        - alert: AuthentikHighLoginFailureRate
          expr: |
            rate(
              authentik_login_attempts_total{
                namespace="security",
                successful="false"
              }[5m]
            ) > 0.5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High Authentik login failure rate"
            description: >-
              Login failure rate exceeds 30/min for 5m.
              May indicate brute-force attack or misconfigured client.

        - alert: AuthentikSystemTaskFailing
          expr: |
            sum(
              authentik_system_tasks{
                namespace="security",
                status="TaskResultStatus.ERROR"
              }
            ) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Authentik system tasks failing"
            description: >-
              One or more Authentik system tasks in ERROR state for 10m.
              Check Admin UI → System → System Tasks.
