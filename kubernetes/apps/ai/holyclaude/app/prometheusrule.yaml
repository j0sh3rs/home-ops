---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Added for issue #707 (Claude Code/Codex OTel export). Only covers what
# Claude Code's own OTLP metrics (helmrelease.yaml's OTEL_* env on the
# `app` container) actually make possible today:
#   - a dead-export/pipeline-health alert (the motivating case from the
#     issue -- this would have surfaced OpenViking's silent empty recalls)
#   - a per-session spend guard on claude_code.cost.usage
# The issue's other two asks are deliberately NOT here -- both investigated
# 2026-09-23, see docs/runbooks/agent-telemetry.md's "Explicitly deferred"
# section for the full writeup:
#   - Hindsight retain-queue-depth: structurally impossible today, not just
#     blocked on a bugfix -- Hindsight itself isn't deployed anywhere in
#     this cluster (separate not-yet-started migration, issue #701, itself
#     blocked on #704). No queue exists to measure.
#   - Hook failures (recall/retain): investigated against real VictoriaLogs
#     data. OpenViking's server logs have zero ERROR-level entries in 30
#     days; the only related signal (embedder "slow call" WARNING) is
#     already-known-accepted baseline latency at ~1076 occurrences/week --
#     too high-baseline and not actually a failure signal. The real silent-
#     failure case (a hook stalling then proceeding with no recall) logs
#     nothing at all by design. Operator decision: don't ship a rule on an
#     unclean signal; revisit on a real incident or once #701 replaces this
#     recall/retain path entirely.
#
# Metric/label names -- CONFIRMED against real ingested data 2026-09-23 (a
# one-shot `claude -p` run inside the holyclaude pod, then queried live
# against https://metrics.68cc.io). VictoriaMetrics' OTLP ingestion does
# NOT sanitize OTel names into Prometheus convention -- it preserves them
# verbatim, dots included, for both the metric name and resource/attribute
# labels (`claude_code.session.count`, `deployment.environment`,
# `session.id`, etc.), not `claude_code_session_count_total`/
# `deployment_environment` as originally guessed here. Bare-identifier
# PromQL syntax can't reference a dotted name, so every selector below uses
# MetricsQL's quoted-name extension (`{"claude_code.session.count", ...}`),
# confirmed working against this same endpoint/vmalert's engine. Annotation
# templates use `index $labels "some.dotted.label"` for the same reason --
# `$labels.deployment_environment` would silently render empty against a
# real `deployment.environment` label.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: holyclaude-telemetry-rules
  namespace: ai
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: holyclaude-telemetry.rules
      rules:
        - alert: ClaudeCodeTelemetryStale
          annotations:
            summary: "HolyClaude's Claude Code has stopped exporting OTel telemetry"
            description: >-
              No claude_code.session.count samples from holyclaude in 2h+.
              Either no one has used HolyClaude in that window (benign) or
              the OTLP export broke silently -- check
              `kubectl -n ai logs -l app.kubernetes.io/name=holyclaude -c app`
              for OTLP exporter errors and confirm
              https://metrics.68cc.io/opentelemetry/v1/metrics is still
              reachable from the pod.
            runbook: docs/runbooks/agent-telemetry.md
          expr: |-
            absent_over_time({"claude_code.session.count", "deployment.environment"="holyclaude"}[2h])
          for: 15m
          labels:
            severity: warning
            component: ai

        - alert: ClaudeCodeSessionSpendHigh
          annotations:
            summary: "A single Claude Code session on {{ index $labels \"deployment.environment\" }} spent ${{ $value | printf \"%.2f\" }} in 24h"
            description: >-
              claude_code.cost.usage summed by session.id exceeded $10 over
              24h. This is Claude Code's own internal cost estimate (model
              pricing table), not necessarily a real bill through Omniroute
              -- treat as a runaway-usage signal, not a billing alert.
              Tune the 10 threshold once a few weeks of real data exist.
            runbook: docs/runbooks/agent-telemetry.md
          expr: |-
            sum by ("session.id", "deployment.environment") (increase({"claude_code.cost.usage"}[24h])) > 10
          for: 0m
          labels:
            severity: warning
            component: ai
