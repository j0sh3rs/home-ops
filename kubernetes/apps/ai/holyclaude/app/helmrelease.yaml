---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holyclaude
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # 50Gi openebs-hostpath PVC (node-local, RWO) -- pin to bigboi-jms-01
      # so the first (and only) scheduling decision lands off the
      # etcd-quorum-sensitive bee-* control-plane nodes, colocated with the
      # other heavy AI/browser-capable workloads already there. Rebinding
      # this PVC to a different node later means deleting and recreating
      # it, which destroys the Claude Code OAuth session and /workspace --
      # get this right before first deploy, not after.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["bigboi-jms-01"]
      # holyclaude is granted cluster-admin (see rbac.yaml); mount its SA
      # token so the rendered kubeconfig (00-render-kubeconfig initContainer
      # below) and the kube-mcp sidecar both have something to authenticate
      # with.
      automountServiceAccountToken: true
    serviceAccount:
      holyclaude: {}
    controllers:
      holyclaude:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Renders an in-cluster kubeconfig from the pod's own ServiceAccount
          # token/CA cert (auto-mounted via defaultPodOptions above and kept
          # fresh in place by kubelet) rather than copying the real local
          # admin@kubernetes kubeconfig into a Secret -- no static admin
          # credential ever leaves the operator's machine. Named to sort
          # before gh-auth/home-perms (bjw-s renders initContainers in key
          # order) so home-perms' chown -R /workspace below still fixes
          # ownership on this freshly written file.
          00-render-kubeconfig:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /workspace/home-ops
                cat > /workspace/home-ops/kubeconfig <<'EOF'
                apiVersion: v1
                kind: Config
                clusters:
                  - name: in-cluster
                    cluster:
                      server: https://kubernetes.default.svc
                      certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                users:
                  - name: holyclaude
                    user:
                      tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
                contexts:
                  - name: in-cluster
                    context:
                      cluster: in-cluster
                      user: holyclaude
                      namespace: ai
                current-context: in-cluster
                EOF
                chmod 600 /workspace/home-ops/kubeconfig
          home-perms:
            # Also lands the GitOps-managed .gitconfig (mounted read-only
            # at /tmp/gitconfig from the gitconfig-src ConfigMap below) at
            # its durable path, /home/claude/.claude/.gitconfig, before the
            # chown pass picks it up -- see that ConfigMap's persistence
            # entry for why it can't be mounted directly at the live path.
            #
            # Kubernetes auto-creates a subPath mount's target directory as
            # root:root on first mount (kubelet subPath behavior, unrelated
            # to fsGroup) regardless of the pod's own PUID/PGID remap. Fix
            # every persisted mount point explicitly so each one matches the
            # claude:claude (1000:1000) ownership of the rest of the PVC.
            #
            # /workspace/home-ops/age.key is a projected Secret volume --
            # kubelet always mounts Secret/ConfigMap volumes read-only at
            # the tmpfs layer regardless of the volumeMount.readOnly field,
            # so `chown -R /workspace` fails on it ("Read-only file
            # system") and the whole command exits non-zero, wedging this
            # initContainer. Ownership doesn't matter there anyway --
            # Secret volume files default to mode 0644 (world-readable), so
            # the claude user can read it without owning it. Prune that one
            # path out of the recursive chown instead of a blanket `|| true`
            # that would also swallow real chown failures elsewhere.
            #
            # `find ... -exec chown {} +` (unlike `chown -R`) dereferences
            # symlinks by default -- `chown -R` silently lchown's a dangling
            # symlink it walks into, but a bare `chown` invoked on one
            # directly (which is what find -exec does per matched path)
            # tries to stat the target and fails with "cannot dereference:
            # No such file or directory" if it's dangling, wedging this
            # initContainer (set -eu). Hit in practice via a Python venv
            # under /workspace/home-ops/.venv whose bin/python* symlinks
            # point at an interpreter path (mise/uv-managed) that doesn't
            # survive a pod restart. `-h` makes chown act on the symlinks
            # themselves instead of dereferencing, matching `chown -R`'s
            # traversal behavior and sidestepping the dangling-target case
            # entirely -- confirmed via local repro before applying.
            #
            # /home/claude/.local/share/user-bin (see persistence.home
            # below) holds manually-installed standalone CLI binaries
            # (mise itself, installed via `curl https://mise.run | sh` --
            # NOT image-baked). Relinking those into .local/bin (already
            # on PATH, but NOT itself mounted -- see the .local/share/
            # user-bin comment below for why) has to happen in the `app`
            # container's own postStart hook, not here: initContainers and
            # the app container each get an independent, unshared
            # ephemeral root filesystem from the same image -- only
            # explicitly mounted volumes (like the chown targets below)
            # are visible across containers in this pod. A symlink
            # created here in home-perms' own .local/bin never reaches
            # the app container at all (confirmed the hard way: mise
            # installed and manually relinked fine mid-session, but
            # vanished from .local/bin again after the next restart).
            image:
              repository: docker.io/coderluii/holyclaude
              # renovate: datasource=docker depName=docker.io/coderluii/holyclaude
              tag: 1.5.9
            command:
              - sh
              - -c
              - |
                set -eu
                cp /tmp/gitconfig /home/claude/.claude/.gitconfig
                chown -R 1000:1000 \
                  /home/claude/.claude \
                  /home/claude/.cloudcli \
                  /home/claude/.config/opencode \
                  /home/claude/.taskmaster \
                  /home/claude/.caveman \
                  /home/claude/.local/share/opencode \
                  /home/claude/.local/state/opencode \
                  /home/claude/.local/share/mise \
                  /home/claude/.local/state/mise \
                  /home/claude/.local/share/user-bin
                find /workspace \
                  \( -path /workspace/home-ops/age.key -prune \) \
                  -o -exec chown -h 1000:1000 {} +
          gh-auth:
            image:
              repository: docker.io/coderluii/holyclaude
              # renovate: datasource=docker depName=docker.io/coderluii/holyclaude
              tag: 1.5.9
            env:
              HOME: /home/claude
              # gh-auth runs before the app container's entrypoint sets up
              # the $HOME/.config/gh -> ~/.claude/.config/gh symlink
              # (prepare-cli-persistence.sh), and /home/claude/.config/gh
              # itself is no longer a persisted mount (see persistence.home
              # below) -- point gh directly at the durable location so this
              # login survives a restart instead of writing to this
              # init container's own throwaway filesystem.
              GH_CONFIG_DIR: /home/claude/.claude/.config/gh
            envFrom:
              - secretRef:
                  name: holyclaude-secret
            command:
              - sh
              - -c
              - |
                set -eu
                if [ -n "${GITHUB_TOKEN:-}" ] && [ "$GITHUB_TOKEN" != "CHANGEME" ]; then
                  printf '%s' "$GITHUB_TOKEN" | env -u GITHUB_TOKEN gh auth login --with-token >/dev/null 2>&1 \
                    && echo "gh: credentials persisted" || echo "WARN: gh auth failed"
                fi
        containers:
          app:
            image:
              repository: docker.io/coderluii/holyclaude
              # renovate: datasource=docker depName=docker.io/coderluii/holyclaude
              tag: 1.5.9
            # NOTE: no command/args override -- the image's own ENTRYPOINT
            # handles PUID/GID remap, credential restore, and first-boot
            # bootstrap, then execs s6-overlay as PID 1. See Global
            # Constraints above.
            env:
              TZ: America/New_York
              PUID: "1000"
              PGID: "1000"
              NODE_OPTIONS: "--max-old-space-size=4096"
              GIT_USER_NAME: BarryBot
              GIT_USER_EMAIL: github+barrybot@beholdthehurricane.com
              HOLYCLAUDE_DESLOPPIFY_SETUP: "claude,opencode"
            envFrom:
              - secretRef:
                  name: holyclaude-secret
              - secretRef:
                  name: holyclaude-taskmaster-secret
            securityContext:
              capabilities:
                add: ["SYS_ADMIN", "SYS_PTRACE"]
              seccompProfile:
                type: Unconfined
              readOnlyRootFilesystem: false
            # Relinks manually-installed CLI binaries (mise, via `curl
            # https://mise.run | sh` -- see persistence.home's
            # .local/share/user-bin comment) into .local/bin, which is
            # already on PATH but deliberately NOT itself a PVC mount (that
            # would re-shadow the baked claude/cursor-agent/junie symlinks,
            # the 54de6857 incident). This MUST live here, in the app
            # container's own postStart hook, not in an initContainer:
            # .local/bin is unmounted, ephemeral, per-container root
            # filesystem, not a shared volume -- an initContainer writing
            # to its own .local/bin has zero effect on this container's.
            # ln -sf only touches the names it's given, so the baked
            # symlinks are never disturbed.
            #
            # Also appends the mise-activation snippet (mise-bashrc-src
            # ConfigMap below) to .bashrc every boot. .bashrc is
            # image-baked and unmounted (same one-container-only
            # filesystem reasoning as .local/bin above, and unlike
            # .gitconfig it isn't managed by prepare-cli-persistence.sh --
            # confirmed it's a plain file, not a symlink, still at its
            # image-build timestamp), so it resets to the pristine default
            # on every fresh container and a manual edit never survives a
            # restart. The append is safe to run unconditionally (no
            # idempotency guard needed): .bashrc is always freshly reset
            # to the same baked default before postStart ever runs, on
            # every container start including in-place restarts, so this
            # can never duplicate the appended block.
            #
            # Finally, launches the caveman plugin's local proxy daemon.
            # ~/.claude/settings.json points ANTHROPIC_BASE_URL at
            # http://127.0.0.1:8787/w/claude so Claude Code's own traffic
            # runs through it, but caveman-proxy is a bare foreground
            # server with no supervisor of its own -- nothing in the
            # image's entrypoint/s6 services starts it. Every fresh
            # container therefore left it dead until someone happened to
            # start it by hand in a terminal session, which silently broke
            # again on the next restart (2026-09-05 incident: Claude Code
            # failed with "API Error: Connection refused", and `curl
            # 127.0.0.1:8787` reproduced the identical error until the
            # binary was started manually). `setsid` detaches it from this
            # postStart process's session and `nohup`+closed stdio stop a
            # SIGHUP/closed-pipe from taking it down when the hook exits,
            # so it outlives the hook the same way it survived the manual
            # exec session used to confirm this fix. No idempotency guard
            # needed: a container restart tears down its whole PID
            # namespace, so there's never a prior instance still alive
            # when this runs.
            lifecycle:
              postStart:
                exec:
                  command:
                    - sh
                    - -c
                    - |
                      set -eu
                      for f in /home/claude/.local/share/user-bin/*; do
                        [ -e "$f" ] || continue
                        ln -sf "$f" "/home/claude/.local/bin/$(basename "$f")"
                      done
                      cat /tmp/bashrc-extra >> /home/claude/.bashrc
                      setsid nohup /home/claude/.caveman/bin/caveman-proxy \
                        >>/home/claude/.caveman/proxy.log 2>&1 </dev/null &
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 6Gi
          # Kubernetes MCP server sidecar, matching openclaw's kube-mcp
          # sidecar exactly. Auto-detects in-cluster config and so uses the
          # pod's own ServiceAccount token (cluster-admin, see rbac.yaml).
          # Listens on localhost:8081; reachable from the app container
          # in-pod. Registering it in Claude Code/OpenCode's own MCP config
          # is a separate, per-tool follow-up -- not done here.
          kube-mcp:
            image:
              repository: ghcr.io/containers/kubernetes-mcp-server
              tag: v0.0.66
            args: ["--port", "8081"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    persistence:
      home:
        # Deliberately NOT a single mount of the whole /home/claude --
        # doing that shadows everything the image bakes into that
        # directory at build time (most critically /home/claude/.local/bin,
        # which is where the real `claude`/cursor-agent/junie binaries
        # live), since nothing in HolyClaude's entrypoint/bootstrap
        # restores missing image content onto an empty PVC. Mount only the
        # specific subtrees that actually need to survive a restart,
        # mirroring upstream's own docker-compose.yaml (~/.claude,
        # /workspace) plus the additions this deployment needs
        # (~/.cloudcli, ~/.config/opencode, ~/.taskmaster, ~/.caveman,
        # ~/.local/share/{opencode,mise,user-bin}, ~/.local/state/{opencode,mise}).
        # subPath names match the directory names already sitting at this
        # PVC's root from the prior whole-home mount, so no data migration
        # is needed. ~/.caveman (github.com/JuliusBrussee/caveman, installed
        # manually by the operator, not image-baked) was added 2026-09-02
        # after a pod restart wiped it -- it had been living on the
        # ephemeral container layer the whole time, invisible until the
        # first restart since it was installed.
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        globalMounts:
          - path: /home/claude/.claude
            subPath: .claude
          - path: /home/claude/.cloudcli
            subPath: .cloudcli
          - path: /home/claude/.config/opencode
            subPath: .config/opencode
          - path: /home/claude/.taskmaster
            subPath: .taskmaster
          - path: /home/claude/.caveman
            subPath: .caveman
          - path: /workspace
            subPath: workspace
          # NOT a mount of the whole /home/claude/.local -- that's exactly
          # the whole-/home/claude shadowing bug from the top of this
          # comment block, just narrower. The image bakes real content
          # directly under .local: .local/bin/claude etc. are symlinks
          # INTO .local/share/{claude,cursor-agent,junie}/... (confirmed
          # via an unmounted pod of the same image), so even mounting all
          # of .local/share (not just .local/bin) would have shadowed the
          # real binaries and reproduced "claude: command not found".
          # OpenCode writes its db/state under XDG_DATA_HOME/XDG_STATE_HOME
          # (.local/share/opencode, .local/state/opencode -- confirmed by
          # inspecting the already-populated PVC); mise (installed ad hoc
          # by the operator inside the terminal, not image-baked -- see
          # the .venv dangling-symlink incident this deployment already
          # hit once) follows the same XDG layout for its own data/state
          # (.local/share/mise, .local/state/mise -- per mise's own docs,
          # https://mise.jdx.dev/directories.html). mise's config
          # (~/.config/mise) and cache (~/.cache/mise) dirs are NOT
          # persisted here -- cache is disposable by design, and config
          # sits outside .local entirely; add them as their own globalMount
          # if a real need shows up.
          #
          # .local/share/user-bin is different from the other .local
          # entries: not one app's XDG dir, but a generic landing spot for
          # any standalone CLI binary manually installed inside the
          # terminal (mise itself, via `MISE_INSTALL_PATH=/home/claude/
          # .local/share/user-bin/mise curl https://mise.run | sh` --
          # mise's installer defaults to .local/bin, which would collide
          # with the baked symlinks; MISE_INSTALL_PATH is the documented
          # override). The home-perms initContainer above symlinks
          # everything under here into .local/bin (already on PATH) on
          # every boot, so this is also the answer for "other things added
          # to .local/bin": drop the binary in user-bin once, it keeps
          # reappearing in .local/bin on every restart without shadowing
          # the image-baked entries there.
          - path: /home/claude/.local/share/opencode
            subPath: .local/share/opencode
          - path: /home/claude/.local/state/opencode
            subPath: .local/state/opencode
          - path: /home/claude/.local/share/mise
            subPath: .local/share/mise
          - path: /home/claude/.local/state/mise
            subPath: .local/state/mise
          - path: /home/claude/.local/share/user-bin
            subPath: .local/share/user-bin
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
      # Reuses the same global sops-age Secret Flux itself decrypts with
      # (kubernetes/components/common/sops-age.sops.yaml) instead of a
      # second copy of the key material. subPath addresses the Secret's
      # age.agekey data key; the destination filename (age.key) is set
      # independently by path, matching this repo's local dev convention
      # (mise's SOPS_AGE_KEY_FILE=./age.key) inside the checked-out
      # /workspace/home-ops clone.
      sops-age:
        type: secret
        name: sops-age
        globalMounts:
          - path: /workspace/home-ops/age.key
            subPath: age.agekey
      # GitOps-managed .gitconfig source (kubernetes/apps/ai/holyclaude/
      # app/configmap.yaml). NOT mounted directly at /home/claude/.gitconfig
      # -- tried that first and it broke boot: the image's own
      # prepare-cli-persistence.sh expects /home/claude/.gitconfig to be a
      # symlink into the durable /home/claude/.claude/.gitconfig, and
      # refuses to start if both exist as independent real files
      # ("[cli-persistence] ERROR: both live and durable Git global
      # configuration state exist"), which is exactly what a direct mount
      # there created. Mount the ConfigMap to a scratch path instead and
      # let home-perms copy it into the durable location -- same pattern
      # already used for gh-auth's GH_CONFIG_DIR above (write the durable
      # path directly, let the entrypoint's own symlink logic handle
      # /home/claude/.gitconfig unmolested).
      gitconfig-src:
        type: configMap
        name: holyclaude-gitconfig
        defaultMode: 0644
        globalMounts:
          - path: /tmp/gitconfig
            subPath: gitconfig
      # GitOps-managed .bashrc additions (kubernetes/apps/ai/holyclaude/
      # app/configmap-bashrc.yaml), appended to .bashrc by the app
      # container's postStart hook -- see that hook's comment for why
      # .bashrc can't just be mounted directly (unlike .gitconfig it
      # isn't fought over by prepare-cli-persistence.sh, but it's still
      # an unmounted, per-container ephemeral file, so this still can't
      # live in an initContainer).
      mise-bashrc-src:
        type: configMap
        name: holyclaude-bashrc-extra
        defaultMode: 0644
        globalMounts:
          - path: /tmp/bashrc-extra
            subPath: bashrc-extra
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: 3001
    route:
      app:
        hostnames: ["holyclaude.68cc.io"]
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.15
        parentRefs:
          - name: traefik-external-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authentik-forwardauth
            backendRefs:
              - name: *app
                port: 3001
