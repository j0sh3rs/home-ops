---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holyclaude
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # 50Gi openebs-hostpath PVC (node-local, RWO) -- pin to bigboi-jms-01
      # so the first (and only) scheduling decision lands off the
      # etcd-quorum-sensitive bee-* control-plane nodes, colocated with the
      # other heavy AI/browser-capable workloads already there. Rebinding
      # this PVC to a different node later means deleting and recreating
      # it, which destroys the Claude Code OAuth session and /workspace --
      # get this right before first deploy, not after.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["bigboi-jms-01"]
    controllers:
      holyclaude:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          gh-auth:
            image:
              repository: docker.io/coderluii/holyclaude
              # renovate: datasource=docker depName=docker.io/coderluii/holyclaude
              tag: 1.5.7
            env:
              HOME: /home/claude
            envFrom:
              - secretRef:
                  name: holyclaude-secret
            command:
              - sh
              - -c
              - |
                set -eu
                if [ -n "${GITHUB_TOKEN:-}" ] && [ "$GITHUB_TOKEN" != "CHANGEME" ]; then
                  printf '%s' "$GITHUB_TOKEN" | env -u GITHUB_TOKEN gh auth login --with-token >/dev/null 2>&1 \
                    && echo "gh: credentials persisted" || echo "WARN: gh auth failed"
                fi
        containers:
          app:
            image:
              repository: docker.io/coderluii/holyclaude
              # renovate: datasource=docker depName=docker.io/coderluii/holyclaude
              tag: 1.5.7
            # NOTE: no command/args override -- the image's own ENTRYPOINT
            # handles PUID/GID remap, credential restore, and first-boot
            # bootstrap, then execs s6-overlay as PID 1. See Global
            # Constraints above.
            env:
              TZ: America/New_York
              PUID: "1000"
              PGID: "1000"
              NODE_OPTIONS: "--max-old-space-size=4096"
              GIT_USER_NAME: BarryBot
              GIT_USER_EMAIL: github+barrybot@beholdthehurricane.com
              HOLYCLAUDE_DESLOPPIFY_SETUP: "claude,opencode"
            envFrom:
              - secretRef:
                  name: holyclaude-secret
              - secretRef:
                  name: holyclaude-taskmaster-secret
            securityContext:
              capabilities:
                add: ["SYS_ADMIN", "SYS_PTRACE"]
              seccompProfile:
                type: Unconfined
              readOnlyRootFilesystem: false
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 250m
                memory: 1Gi
              limits:
                memory: 6Gi
    persistence:
      home:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        globalMounts:
          - path: /home/claude
          - path: /workspace
            subPath: workspace
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 2Gi
        globalMounts:
          - path: /dev/shm
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: 3001
    route:
      app:
        hostnames: ["holyclaude.68cc.io"]
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.15
        parentRefs:
          - name: traefik-external-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authentik-forwardauth
            backendRefs:
              - name: *app
                port: 3001
