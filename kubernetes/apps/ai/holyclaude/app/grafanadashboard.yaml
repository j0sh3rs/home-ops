---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/grafana.integreatly.org/grafanadashboard_v1beta1.json
#
# Metric/label names -- CONFIRMED against real ingested data 2026-09-23 (a
# one-shot `claude -p` run inside the holyclaude pod, then queried live
# against https://metrics.68cc.io). VictoriaMetrics' OTLP ingestion
# preserves OTel names verbatim, dots included -- `claude_code.session.count`
# and `deployment.environment`, not `claude_code_session_count_total`/
# `deployment_environment` as originally guessed. Every query below uses
# MetricsQL's quoted-name selector (`{"claude_code.session.count", ...}`),
# confirmed working against this endpoint. Grafana's `{{label}}` legend
# templating handles dotted label keys fine (plain string lookup, not a Go
# struct field), so legends below use dotted names directly.
#
# `claude_code.code_edit_tool.decision` (panel 13) follows the same
# now-confirmed dotted-name pattern but was not itself exercised by the
# one-shot verification session (no edit-tool calls made) -- double-check
# it once a real session performs an edit.
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: holyclaude-agent-sessions
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      grafana.internal/instance: grafana
  folder: AI
  datasources:
    - datasourceName: vmsingle
      inputName: DS_PROMETHEUS
  json: |
    {
      "title": "Claude Code Agent Sessions",
      "uid": "claude-code-agent-sessions",
      "tags": ["ai", "claude-code", "holyclaude"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "refresh": "1m",
      "time": {"from": "now-24h", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "current": {"text": "vmsingle", "value": "vmsingle"},
            "hide": 0
          },
          {
            "name": "environment",
            "type": "query",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values({\"claude_code.session.count\"}, \"deployment.environment\")",
            "includeAll": true,
            "multi": true,
            "refresh": 2
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Sessions Started (24h)",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum(increase({\"claude_code.session.count\", \"deployment.environment\"=~\"$environment\"}[24h]))",
            "refId": "A"
          }]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Estimated Spend (24h)",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum(increase({\"claude_code.cost.usage\", \"deployment.environment\"=~\"$environment\"}[24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "currencyUSD", "decimals": 2}}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Active Time (24h)",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum(increase({\"claude_code.active_time.total\", \"deployment.environment\"=~\"$environment\"}[24h]))",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "s"}}
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Telemetry Pipeline",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum(absent_over_time({\"claude_code.session.count\", \"deployment.environment\"=~\"$environment\"}[2h])) OR on() vector(0)",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {"type": "value", "options": {"0": {"text": "FLOWING", "color": "green"}}},
                {"type": "value", "options": {"1": {"text": "STALE", "color": "red"}}}
              ],
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [
                {"color": "green", "value": null},
                {"color": "red", "value": 1}
              ]}
            }
          },
          "options": {"colorMode": "background", "graphMode": "none"}
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Sessions Over Time",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum by (\"deployment.environment\", \"start_type\") (increase({\"claude_code.session.count\", \"deployment.environment\"=~\"$environment\"}[1h]))",
            "legendFormat": "{{deployment.environment}} ({{start_type}})",
            "refId": "A"
          }]
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Token Usage by Type",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum by (type) (increase({\"claude_code.token.usage\", \"deployment.environment\"=~\"$environment\"}[1h]))",
            "legendFormat": "{{type}}",
            "refId": "A"
          }]
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Spend by Model",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum by (model) (increase({\"claude_code.cost.usage\", \"deployment.environment\"=~\"$environment\"}[1h]))",
            "legendFormat": "{{model}}",
            "refId": "A"
          }],
          "fieldConfig": {"defaults": {"unit": "currencyUSD"}}
        },
        {
          "id": 13,
          "type": "piechart",
          "title": "Code Edit Tool Decisions",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "targets": [{
            "expr": "sum by (decision) (increase({\"claude_code.code_edit_tool.decision\", \"deployment.environment\"=~\"$environment\"}[24h]))",
            "legendFormat": "{{decision}}",
            "refId": "A"
          }]
        }
      ]
    }
