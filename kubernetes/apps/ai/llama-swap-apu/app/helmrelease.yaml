---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app llama-swap-apu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  # Cold fetch is only ~1.8 GiB (2 small GGUFs: router + embed) vs the
  # main instance's ~35.7 GiB, but keep the same generous timeout pattern
  # for consistency and slow-link tolerance.
  timeout: 15m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      llama-swap-apu:
        # Recreate: init container writes to the same RWO PVC the main
        # container reads from. Rolling update would spawn a second pod
        # competing for that PVC. Same rationale as the main instance.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          model-fetch:
            # curlimages/curl is Alpine-based and already runs as root
            # (securityContext below), so `apk add` works to layer aria2
            # on top at init time — same pattern as the main llama-swap
            # instance's init container.
            image:
              repository: curlimages/curl
              # renovate: datasource=docker depName=curlimages/curl
              tag: 8.21.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                apk add --no-cache aria2
                cd /models
                human() {
                  awk -v b="$1" 'BEGIN{
                    split("B KiB MiB GiB TiB",u," ");
                    i=1; while (b>=1024 && i<5) { b=b/1024; i++ }
                    printf "%.2f %s", b, u[i]
                  }'
                }
                fetch() {
                  url="$1"; out="$2"; min_bytes="$3"
                  if [ -f "$out" ]; then
                    have=$(stat -c %s "$out" 2>/dev/null || echo 0)
                    if [ "$have" -ge "$min_bytes" ]; then
                      echo "[skip] $out exists ($(human $have))"
                      return 0
                    fi
                    echo "[retry] $out too small ($have < $min_bytes), re-fetching"
                    rm -f "$out"
                  fi
                  echo "[fetch] $out (aria2, 8 parallel connections)"
                  aria2c -x 8 -s 8 -k 1M -c --file-allocation=none \
                    --allow-overwrite=false --auto-file-renaming=false \
                    --summary-interval=5 --console-log-level=warn \
                    -d /models -o "$out.part" "$url"
                  final=$(stat -c %s "$out.part" 2>/dev/null || echo 0)
                  mv "$out.part" "$out"
                  echo "[done]  $out: $(human $final)"
                }
                # Qwen3-1.7B Q5_K_M (~1.17 GiB) — router/fast/small
                fetch \
                  "https://huggingface.co/unsloth/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q5_K_M.gguf?download=true" \
                  "Qwen3-1.7B-Q5_K_M.gguf" \
                  1200000000
                # Qwen3-Embedding-0.6B Q8_0 (~640 MB) — RAG embeddings.
                # Moved from the main llama-swap instance 2026-08-17.
                fetch \
                  "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B-GGUF/resolve/main/Qwen3-Embedding-0.6B-Q8_0.gguf?download=true" \
                  "Qwen3-Embedding-0.6B-Q8_0.gguf" \
                  600000000
                echo "[finished] model staging complete"
                ls -lh /models
            env:
              HF_HUB_OFFLINE: "0"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/mostlygeek/llama-swap
              # Same Vulkan build as the main instance — portable across
              # AMD GPUs, no ROCm dependency.
              # renovate: datasource=docker depName=ghcr.io/mostlygeek/llama-swap
              tag: unified-vulkan-2026-08-17
            args:
              - --config
              - /app/config.yaml
              - --listen
              - 0.0.0.0:8080
            env:
              GGML_VK_VISIBLE_DEVICES: "0"
              HF_HUB_OFFLINE: "1"
            resources:
              requests:
                cpu: 250m
                memory: 2Gi
              limits:
                # Two small models (~1.8 GiB combined) plus KV cache and
                # process overhead — well under this ceiling.
                memory: 6Gi
                amd.com/gpu: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
    service:
      app:
        controller: *app
        ports:
          http:
            port: 8080
    persistence:
      models:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 15Gi
        retain: true
        globalMounts:
          - path: /models
      config:
        type: configMap
        name: llama-swap-apu-config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
    defaultPodOptions:
      # Hard-pinned to bee-jms-03 by hostname — this is the only node with
      # enough dedicated VRAM (16 GiB, BIOS-expanded) to be worth
      # targeting. No preference/fallback tiering: unlike the main
      # instance, this one has nowhere sensible to fail over to.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["bee-jms-03"]
