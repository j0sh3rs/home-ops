---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-apu-config
data:
  config.yaml: |
    # llama-swap config for the APU-light tier (bee-jms-03).
    # Docs: https://github.com/mostlygeek/llama-swap
    #
    # Renoir iGPU on bee-jms-03, BIOS-expanded to 16 GiB dedicated VRAM
    # (see docs/superpowers/specs/2026-08-16-apu-light-inference-tier-design.md).
    # All models here are small/latency-tolerant and stay resident together
    # — no exclusive-swap group needed here, unlike the 9070 XT's tight fit.
    # coder-fim (Continue.dev FIM) was removed 2026-08-17 — Continue.dev is
    # explicitly rejected, do not reintroduce.
    healthCheckTimeout: 180
    logLevel: info
    startPort: 5800

    macros:
      # No --flash-attn / KV quant: older Vega/gfx90c silicon, not tuned
      # or verified for those flags, and VRAM headroom doesn't require
      # the trade-off here. Re-check before enabling if profiling shows
      # a need.
      "apu-vulkan": >-
        /app/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --jinja

      # Embedding-only. --embedding restricts to /embedding endpoint.
      "apu-embed": >-
        /app/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --embedding

    models:
      # Fast router + HA/voice model. Accessible via fast/small/router
      # aliases. Caller system prompt should include /no_think to
      # suppress CoT. Home Assistant Assist routing/title-gen is this
      # model's live target use case (not yet wired in HA's config).
      "qwen3-1.7b":
        cmd: |
          ${apu-vulkan}
          --model /models/Qwen3-1.7B-Q5_K_M.gguf
          --ctx-size 8192
          --temp 0.7 --top-p 0.8
        aliases:
          - "fast"
          - "small"
          - "router"
        # No ttl (unlike the main instance's copy of this model): bee-jms-03
        # has generous VRAM headroom here, no eviction pressure.
        ttl: 0

      # RAG embedding. Moved from llama-swap (bigboi-jms-01) 2026-08-17 —
      # small (~0.64 GiB) and latency-tolerant, doesn't need dGPU horsepower.
      # openviking's real, live consumer (embedding.dense + vlm placeholder
      # in kubernetes/apps/ai/openviking/app/helmrelease.yaml — update the
      # api_base there if this ever moves again). --pooling last mandatory;
      # dims 1024 with MRL truncation, instruction-aware — callers must send
      # a query instruction prefix or retrieval quality degrades.
      "qwen3-embed":
        cmd: |
          ${apu-embed}
          --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf
          --ctx-size 32768
          --pooling last
        aliases:
          - "embed"
          - "embedding"
          - "text-embedding-ada-002"
        ttl: 0

    groups:
      "always-on":
        swap: false
        exclusive: false
        persistent: true
        members:
          - "qwen3-1.7b"
          - "qwen3-embed"
