---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-apu-config
data:
  config.yaml: |
    # llama-swap config for the APU-light tier (bee-jms-03).
    # Docs: https://github.com/mostlygeek/llama-swap
    #
    # Renoir iGPU on bee-jms-03, BIOS-expanded to 16 GiB dedicated VRAM
    # (see docs/superpowers/specs/2026-08-16-apu-light-inference-tier-design.md).
    # All models here are small/latency-tolerant and stay resident together
    # — no exclusive-swap group needed here, unlike the 9070 XT's tight fit.
    # coder-fim (Continue.dev FIM) was removed 2026-08-17 — Continue.dev is
    # explicitly rejected, do not reintroduce.
    healthCheckTimeout: 180
    logLevel: info
    startPort: 5800

    macros:
      # No --flash-attn / KV quant: older Vega/gfx90c silicon, not tuned
      # or verified for those flags, and VRAM headroom doesn't require
      # the trade-off here. Re-check before enabling if profiling shows
      # a need.
      "apu-vulkan": >-
        /usr/local/bin/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --jinja

      # Embedding-only. --embedding restricts to /embedding endpoint.
      "apu-embed": >-
        /usr/local/bin/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --embedding

    models:
      # Fast router + HA/voice model. Accessible via fast/small/router
      # aliases. Caller system prompt should include /no_think to
      # suppress CoT. Home Assistant Assist routing/title-gen is this
      # model's live target use case (not yet wired in HA's config).
      "qwen3-1.7b":
        cmd: |
          ${apu-vulkan}
          --model /models/Qwen3-1.7B-Q5_K_M.gguf
          --ctx-size 8192
          --temp 0.7 --top-p 0.8
        aliases:
          - "fast"
          - "small"
          - "router"
        # No ttl (unlike the main instance's copy of this model): bee-jms-03
        # has generous VRAM headroom here, no eviction pressure.
        ttl: 0

      # RAG embedding. Moved from llama-swap (bigboi-jms-01) 2026-08-17 —
      # small (~0.64 GiB) and latency-tolerant, doesn't need dGPU horsepower.
      # openviking's real, live consumer (embedding.dense + vlm placeholder
      # in kubernetes/apps/ai/openviking/app/helmrelease.yaml — update the
      # api_base there if this ever moves again). --pooling last mandatory;
      # dims 1024 with MRL truncation, instruction-aware — callers must send
      # a query instruction prefix or retrieval quality degrades.
      "qwen3-embed":
        cmd: |
          ${apu-embed}
          --model /models/Qwen3-Embedding-0.6B-Q8_0.gguf
          --ctx-size 32768
          --pooling last
        aliases:
          - "embed"
          - "embedding"
          - "text-embedding-ada-002"
        ttl: 0

      # Light chat model — fills the "Chat" category on this tier. Beats
      # Phi-4-mini at the same size across the board (mmlu_pro 79.1 vs
      # 52.8, ifeval 89.8 vs 66.8, livecodebench 55.8) per fitmyllm.
      # Q6_K (~3.53 GiB) — DDR4-bandwidth-bound here, not VRAM-bound.
      # Measured ~11.45 tok/s decode via live curl test (10 tokens),
      # confirms the bandwidth estimate. ctx-size 32768 (matches embed's
      # window) confirmed via rocm-smi --showmeminfo vram with all three
      # always-on models loaded together: 11.10 GiB/16 GiB used, 4.90 GiB
      # free (30.6%) — solid margin, not near-ceiling like bigboi's picks.
      "qwen3.5-4b":
        cmd: |
          ${apu-vulkan}
          --model /models/Qwen3.5-4B-Q6_K.gguf
          --ctx-size 32768
          --temp 0.7 --top-p 0.8
        aliases:
          - "chat"
          - "small-chat"
        ttl: 0

      # Vision-language model for OpenViking's `vlm` config (content
      # understanding / memory extraction from images) — no vision-capable
      # model existed anywhere in the fleet before this; openviking's vlm
      # previously pointed at the text-only qwen3-embed as a placeholder
      # just to pass /ready. Q4_K_M weights (940 MiB) + f16 mmproj (1.27 GiB
      # — vision encoders are kept at f16, quantizing them measurably hurts
      # vision quality) = ~2.2 GiB total, fits the 4.90 GiB free headroom
      # measured with the other three always-on models loaded (see
      # qwen3.5-4b's comment above) with solid margin left for KV cache.
      "qwen2-vl-2b":
        cmd: |
          ${apu-vulkan}
          --model /models/Qwen2-VL-2B-Instruct-Q4_K_M.gguf
          --mmproj /models/mmproj-Qwen2-VL-2B-Instruct-f16.gguf
          --ctx-size 8192
          --temp 0.0
        aliases:
          - "vlm"
          - "vision"
        ttl: 0

    groups:
      "always-on":
        swap: false
        exclusive: false
        persistent: true
        members:
          - "qwen3-1.7b"
          - "qwen3-embed"
          - "qwen3.5-4b"
          - "qwen2-vl-2b"
