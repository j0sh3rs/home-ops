---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app llama-swap
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  # First-boot (or new-model) reconciles block on the model-fetch init
  # container pulling up to ~38.5 GiB of GGUFs off HuggingFace into the RWO
  # PVC. The Helm default 5m timeout trips long before that completes,
  # failing the release and rolling back to a config that references a
  # not-yet-downloaded file. 45m covers a cold multi-model fetch; curl -C -
  # resume means a Recreate mid-download continues rather than restarting,
  # but a genuinely cold fetch on a slow link still needs real headroom.
  timeout: 45m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      llama-swap:
        # Recreate: init container downloads up to ~25.5 GiB of GGUFs. Rolling
        # update would spawn a second pod competing for the same PVC (RWO) and
        # then time out. Recreate ensures old pod is gone before init runs.
        strategy: Recreate
        annotations:
          # Reload pod when the config ConfigMap changes.
          reloader.stakater.com/auto: "true"
        initContainers:
          model-fetch:
            # One-shot GGUF downloader. Idempotent — skips files that
            # already exist and match the expected size (checked against
            # the FINAL filename, never the in-progress ".part", so a
            # completed download is never re-touched or re-split). Uses
            # the same /models PVC as the main container so weights
            # persist across restarts. curlimages/curl is Alpine-based and
            # already runs as root (securityContext below), so `apk add`
            # works to layer aria2 on top at init time — avoids maintaining
            # a second pinned base image just for this one binary.
            image:
              repository: curlimages/curl
              # renovate: datasource=docker depName=curlimages/curl
              tag: 8.21.0
            command: ["/bin/sh", "-c"]
            args:
              - |
                set -eu
                apk add --no-cache aria2
                cd /models
                human() {
                  # Pretty-print bytes in SI (MiB/GiB) without bc.
                  awk -v b="$1" 'BEGIN{
                    split("B KiB MiB GiB TiB",u," ");
                    i=1; while (b>=1024 && i<5) { b=b/1024; i++ }
                    printf "%.2f %s", b, u[i]
                  }'
                }
                fetch() {
                  url="$1"; out="$2"; min_bytes="$3"
                  if [ -f "$out" ]; then
                    have=$(stat -c %s "$out" 2>/dev/null || echo 0)
                    if [ "$have" -ge "$min_bytes" ]; then
                      echo "[skip] $out exists ($(human $have))"
                      return 0
                    fi
                    echo "[retry] $out too small ($have < $min_bytes), re-fetching"
                    rm -f "$out"
                  fi
                  echo "[fetch] $out (aria2, 8 parallel connections)"
                  # -c resumes a partial "$out.part"/.aria2 pair left by a
                  # prior interrupted run (both live on the PVC, so this
                  # survives pod restarts) instead of restarting cold.
                  aria2c -x 8 -s 8 -k 1M -c --file-allocation=none \
                    --allow-overwrite=false --auto-file-renaming=false \
                    --summary-interval=5 --console-log-level=warn \
                    -d /models -o "$out.part" "$url"
                  final=$(stat -c %s "$out.part" 2>/dev/null || echo 0)
                  mv "$out.part" "$out"
                  echo "[done]  $out: $(human $final)"
                }
                # ── Chat group (hot-swap) ──
                # Always-on group (embed/rerank/router) moved to
                # llama-swap-apu (bee-jms-03) 2026-08-17 — this instance is
                # chat-only now. qwen3-8b, reasoner (Qwen3-30B-Thinking), and
                # reasoner-agentic (gpt-oss-20b) were dropped same day: zero
                # confirmed consumers anywhere in the repo.

                # Qwen3-Coder-30B-A3B-Instruct Q3_K_S (~13.3 GiB) — agentic coder
                # Q3_K_S not Q3_K_M: bench showed gen speed a wash but Q3_K_S
                # is the better-fitting quant. holmesgpt's model.
                fetch \
                  "https://huggingface.co/unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF/resolve/main/Qwen3-Coder-30B-A3B-Instruct-Q3_K_S.gguf?download=true" \
                  "Qwen3-Coder-30B-A3B-Instruct-Q3_K_S.gguf" \
                  13290000000
                # Qwen3.5-35B-A3B UD-IQ3_S (~13.6 GiB) — MoE frontier chat,
                # replaces dense qwen3.6-27b (removed 2026-08-18, too slow
                # decode). See configmap.yaml's qwen3.5-35b-a3b comment.
                fetch \
                  "https://huggingface.co/unsloth/Qwen3.5-35B-A3B-GGUF/resolve/main/Qwen3.5-35B-A3B-UD-IQ3_S.gguf?download=true" \
                  "Qwen3.5-35B-A3B-UD-IQ3_S.gguf" \
                  13600000000
                # GPT-OSS-20B Q4_K_M (~11.6 GiB) — reasoning, fills the gap
                # left when `reasoner` was dropped 2026-08-17. See
                # configmap.yaml's gpt-oss-20b comment.
                fetch \
                  "https://huggingface.co/unsloth/gpt-oss-20b-GGUF/resolve/main/gpt-oss-20b-Q4_K_M.gguf?download=true" \
                  "gpt-oss-20b-Q4_K_M.gguf" \
                  11600000000
                echo "[finished] model staging complete"
                ls -lh /models
            env:
              # Override HF_HUB_OFFLINE from main container — init must
              # reach HuggingFace.
              HF_HUB_OFFLINE: "0"
            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              runAsNonRoot: false
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/mostlygeek/llama-swap
              # Vulkan — FINAL decision. ROCm tested twice on gfx1201 (2026-06-26/27):
              # GFXCLK stuck at 41MHz (SMU14 firmware bug, ROCm/ROCm#6289) under ALL
              # power profiles incl. profile_peak. pp=510 vs Vulkan pp=9217. Not fixable
              # without AMD SMU14 firmware patch. Revisit only when patch ships.
              # renovate: datasource=docker depName=ghcr.io/mostlygeek/llama-swap
              tag: unified-vulkan-2026-08-17
            args:
              - --config
              - /app/config.yaml
              - --listen
              - 0.0.0.0:8080
            env:
              # Pin Vulkan to device 0 exposed by amd-gpu device plugin.
              GGML_VK_VISIBLE_DEVICES: "0"
              # Prevent accidental outbound HF fetches from llama-server;
              # GGUF files are pre-staged by the model-init Job.
              HF_HUB_OFFLINE: "1"
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                # 16 GiB covers the largest resident chat model (~14.2 GiB
                # agentic-coder) + KV cache. No always-on group on this
                # instance anymore (moved to llama-swap-apu 2026-08-17).
                memory: 16Gi
                amd.com/gpu: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              # llama-swap image runs as root; /dev/kfd + /dev/dri access
              # is mediated by the AMD device plugin, not privileged mode.
              runAsNonRoot: false
              runAsUser: 0
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 8080
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.17
        hostnames: ["llm.68cc.io"]
        parentRefs:
          - name: traefik-internal-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authentik-forwardauth
            backendRefs:
              - name: *app
                port: *port
    persistence:
      # Persistent GGUF cache. bjw-s names the PVC after the release
      # ("llama-swap") since this is the app's only volume — not
      # "llama-swap-models". Shared with the init container.
      models:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath-fast
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        globalMounts:
          - path: /models
      # llama-swap config.yaml from ConfigMap in this kustomization.
      config:
        type: configMap
        name: llama-swap-config
        globalMounts:
          - path: /app/config.yaml
            subPath: config.yaml
            readOnly: true
    defaultPodOptions:
      # Hard-required to bigboi-jms-01's dgpu tier — no fallback. The old
      # fallback to bee-jms-03 (weight 50) is gone: that node now runs a
      # dedicated, always-resident llama-swap-apu pod holding its single
      # amd.com/gpu allocatable, so this instance scheduling there would
      # leave it permanently Pending. See
      # docs/superpowers/specs/2026-08-16-apu-light-inference-tier-design.md.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.kubernetes.io/gpu-tier
                    operator: In
                    values: ["dgpu"]
