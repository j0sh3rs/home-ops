---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
data:
  config.yaml: |
    # llama-swap config for home-ops
    # Docs: https://github.com/mostlygeek/llama-swap
    #
    # Navi 48 dGPU on bigboi-jms-01 (Radeon RX 9070 XT, 16 GiB GDDR6, ~640 GB/s).
    # Chat models hot-swap through the 'chat' group (exclusive). This
    # instance is chat-only — embed/rerank/router moved to llama-swap-apu
    # (bee-jms-03) 2026-08-17, freeing the full 16 GiB for the swap group.
    healthCheckTimeout: 180
    logLevel: info
    startPort: 5800

    macros:
      # Standard chat / agentic models. --jinja uses GGUF-embedded chat template.
      # --flash-attn on is mandatory for RDNA2 MoE prefill perf (build >=b6272).
      # KV q8_0 stretches VRAM headroom on all MoE models.
      "llama-vulkan": >-
        /usr/local/bin/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --flash-attn on
        --jinja
        --cache-type-k q8_0 --cache-type-v q8_0

    models:
      # ==================== CHAT GROUP (exclusive swap) ====================

      # Agentic coder flagship. Pure-attention qwen3_moe — no GatedDeltaNet/SSM.
      # Q3_K_S (not Q3_K_M): on-node bench (b9803, 16k ctx, q8_0 KV, FA on)
      # measured Q3_K_S at 14.19 GB vs Q3_K_M 15.6 GB — gen speed a wash
      # (152 vs 148 tok/s). Originally chosen to coexist with the always-on
      # group under #465's de-thrash fix; that group has since moved to
      # llama-swap-apu (2026-08-17), but Q3_K_S is kept as the still-better
      # quant. Keep ctx <=16384.
      "agentic-coder":
        cmd: |
          ${llama-vulkan}
          --model /models/Qwen3-Coder-30B-A3B-Instruct-Q3_K_S.gguf
          --ctx-size 16384
          --temp 0.6 --top-p 0.95
        aliases:
          - "coder"
          - "code-large"
          - "coder-large"
        ttl: 120

      # GatedDeltaNet frontier chat. Qwen3.6-27B Q3_K_M (~12.2 GiB).
      # openclaw's primary as of 2026-08-17, replacing qwen3-14b (retired,
      # see git history). RE-TEST 2026-08-17: the 2026-08-16 "decode
      # collapses to ~4 tok/s" warning (llama.cpp #26795) did NOT
      # reproduce. Live curl test: 800 completion tokens in 26.01s =
      # ~30.8 tok/s sustained decode.
      # ctx-size 65536 chosen from real on-node rocm-smi VRAM measurements
      # (unified image; plain vulkan tags lack rocm-smi): 65536 -> 1283 MiB
      # free (7.9%, solid margin); 81920 -> 720 MiB (4.4%); 98304 -> only
      # 160 MiB (1.0%, too tight). KV cost ~35 KiB/token measured across
      # 65536-98304 (linear). Do NOT raise without re-measuring via
      # rocm-smi --showmeminfo vram — VRAM behavior gets unpredictable
      # near the ceiling (a 131072 measurement showed LESS usage than
      # 98304, an anomaly, not a safe data point to extrapolate from).
      # Dense 27B; highest static quality (whichllm rank #1, 87.3).
      # Upgraded Q3_K_S → Q3_K_M per whichllm.
      "qwen3.6-27b":
        cmd: |
          ${llama-vulkan}
          --model /models/Qwen3.6-27B-Q3_K_M.gguf
          --ctx-size 65536
          -np 1
          --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
          --presence-penalty 1.0
        aliases:
          - "frontier"
          - "frontier-chat"
        ttl: 120

      # Qwen2.5-Coder-7B — superseded by agentic-coder for multi-step work.
      # Kept commented for dense single-turn fallback if agentic-coder slot
      # proves unstable. Re-add to chat group members list to re-enable.
      # "qwen-coder-7b":
      #   cmd: |
      #     ${llama-vulkan}
      #     --model /models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
      #     --ctx-size 16384
      #     --temp 0.2 --top-p 0.95
      #   aliases:
      #     - "code-7b"
      #   ttl: 600

    groups:
      # Chat models swap exclusively. Only one can hold 11–15 GiB at a time.
      "chat":
        swap: true
        exclusive: true
        members:
          - "agentic-coder"
          - "qwen3.6-27b"
