---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetesjsonschema.dev/master/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: llama-swap-config
data:
  config.yaml: |
    # llama-swap config for home-ops
    # Docs: https://github.com/mostlygeek/llama-swap
    #
    # Navi 48 dGPU on bigboi-jms-01 (Radeon RX 9070 XT, 16 GiB GDDR6, ~640 GB/s).
    # Since 2026-09-24 (issue #701, Hindsight) gpt-oss-20b is the ONLY chat
    # model on this card, always resident with 5x32k slots, so Hindsight's
    # retain/reflect never wait on a model swap. agentic-coder and
    # qwen3.5-35b-a3b are commented out below (each needs ~13-14 GiB, and
    # neither fits beside gpt-oss-20b's ~11.5 GiB); their aliases moved onto
    # gpt-oss-20b so no consumer config changed.
    # Embed/vlm stay on llama-swap-apu (bee-jms-03, moved 2026-08-17). Rerank moved
    # BACK here 2026-09-10 (jina-reranker-v2, ~305 MiB) as a concurrent
    # "always-on" model alongside whichever chat model is loaded — the APU
    # was a real memory-bandwidth-constrained node for VLM/embedding, and
    # rerank benefits from dGPU throughput too. See agentic-coder's ctx-size
    # comment below for the real VRAM math this required.
    # jina-reranker-v2 DISABLED 2026-09-25: its only consumer was
    # OpenViking's `retrieval.rerank` (retired -- operator decision,
    # Hindsight preferred after hands-on comparison). Hindsight reranks
    # in-process, no external reranker model needed. gpt-oss-20b is now the
    # only always-on model on this card.
    healthCheckTimeout: 180
    logLevel: info
    startPort: 5800

    macros:
      # Standard chat / agentic models. --jinja uses GGUF-embedded chat template.
      # --flash-attn on is mandatory for RDNA2 MoE prefill perf (build >=b6272).
      # KV q8_0 stretches VRAM headroom on all MoE models.
      "llama-vulkan": >-
        /usr/local/bin/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --flash-attn on
        --jinja
        --cache-type-k q8_0 --cache-type-v q8_0

      # Rerank-only. --reranking + --pooling rank restricts to /rerank
      # (+/v1/rerank, /v1/reranking) endpoints. No --jinja/--flash-attn/KV
      # quant here (deliberately) -- those are chat-generation-specific
      # optimizations, pooling-based reranking doesn't autoregress or grow
      # a KV cache across turns the same way, and this flag combo is
      # unverified for that workload. Mirrors llama-swap-apu's apu-rerank
      # macro exactly (same reasoning: llama.cpp issue #21256 -- combining
      # --reranking with --embedding on one process forces
      # pooling_type=RANK cluster-wide; not a concern here since this node
      # has no embedding model, but keeping the macro single-purpose
      # anyway for consistency with the APU tier).
      "llama-vulkan-rerank": >-
        /usr/local/bin/llama-server
        --host 0.0.0.0 --port ${PORT}
        -ngl 99
        --reranking --pooling rank

    models:
      # ==================== CHAT (gpt-oss-20b only, always-on; others disabled #701) ====================

      # DISABLED 2026-09-24 (#701): cannot co-reside with always-on gpt-oss-20b. Aliases moved to gpt-oss-20b.
      # Agentic coder flagship. Pure-attention qwen3_moe — no GatedDeltaNet/SSM
      # (standard full attention every layer, unlike qwen3.6-27b below —
      # KV cost grows faster with ctx-size as a result). Q3_K_S (not
      # Q3_K_M): on-node bench (b9803, 16k ctx, q8_0 KV, FA on) measured
      # Q3_K_S at 14.19 GB vs Q3_K_M 15.6 GB — gen speed a wash (152 vs
      # 148 tok/s). Originally chosen to coexist with the always-on group
      # under #465's de-thrash fix; that group has since moved to
      # llama-swap-apu (2026-08-17), but Q3_K_S is kept as the
      # still-better quant.
      #
      # openclaw's primary as of 2026-08-17 (replacing qwen3.6-27b, which
      # was primary for less than a day). whichllm re-run confirmed
      # qwen3.6-27b's real-world decode (17.83 tok/s at 20K prompt depth,
      # user-reported) against this MoE model's ~149.5 tok/s estimate —
      # ~7x faster for an 8-point quality-score gap (79.2 vs 87.3).
      # ctx-size 49152 -> 32768 2026-09-10: real rocm-smi measurement with
      # jina-reranker-v2 (~305 MiB) added as a concurrent "always-on" model
      # showed only 709.9 MiB free at 49152 -- tighter than the 1105 MiB
      # this comment originally documented (real margins drift; re-measure,
      # don't trust old comments blindly), and not enough to safely share
      # with the reranker's weights + pooling overhead without risking the
      # same near-ceiling instability pattern already rejected at 65536
      # (273 MiB free, see below). 32768 restores real margin: 1939 MiB
      # free measured with ONLY agentic-coder loaded (pre-rerank-addition
      # baseline) -- re-measure with the reranker concurrently loaded
      # before trusting this number long-term. Trade-off: primary coding
      # model's context window shrinks from 49152 to 32768 tokens in
      # exchange for concurrent rerank capacity with no swap latency.
      # 65536 -> only 273 MiB (1.7%, too tight, same near-ceiling
      # instability pattern as qwen3.6-27b) -- never a real option.
      # "agentic-coder":
      #   cmd: |
      #     ${llama-vulkan}
      #     --model /models/Qwen3-Coder-30B-A3B-Instruct-Q3_K_S.gguf
      #     --ctx-size 32768
      #     -ub 2048 -b 16384
      #     --temp 0.6 --top-p 0.95
      #   aliases:
      #     - "coder"
      #     - "code-large"
      #     - "coder-large"
      #   ttl: 120

      # DISABLED 2026-09-24 (#701): cannot co-reside with always-on gpt-oss-20b. Aliases moved to gpt-oss-20b.
      # MoE frontier chat — replaces qwen3.6-27b (dense, removed 2026-08-18).
      # Dense qwen3.6-27b was openclaw's primary for less than a day
      # (2026-08-17), reverted for ~17.83 tok/s decode at 20K prompt depth
      # (all 27B params active every token). This is the same MoE-over-dense
      # fix applied here: Qwen3.5-35B-A3B, only 3B active params, same
      # speed class as agentic-coder. fitmyllm comparison vs qwen3.6-27b:
      # mmlu_pro 85.3 vs 40.3, ifeval 91.9 vs 34.2, gpqa_diamond 81.9 vs
      # 82.9 (near tied) — beats it on real throughput AND most benchmarks.
      # UD-IQ3_S (Unsloth Dynamic, ~13.6 GiB weights) chosen over plain
      # Q3_K_S (15.3 GiB) to leave headroom for KV cache on this card's
      # ~15.9 GiB usable ceiling (rocm-smi reports 17095983104 B total,
      # not the nominal 16 GiB — same on this card for every model) —
      # same reasoning as agentic-coder's Q3_K_S pick.
      # ctx-size 49152 chosen from real on-node rocm-smi VRAM measurements
      # (matches agentic-coder's window for consistency): 8192 -> 3.19 GiB
      # free (20.0%); 32768 -> 2.92 GiB free (18.4%); 49152 -> 2.74 GiB
      # free (17.2%, chosen — solid margin, better than qwen3.6-27b ever
      # achieved even at its lowest ctx). Re-measure via rocm-smi before
      # raising further.
      # "qwen3.5-35b-a3b":
      #   cmd: |
      #     ${llama-vulkan}
      #     --model /models/Qwen3.5-35B-A3B-UD-IQ3_S.gguf
      #     --ctx-size 49152
      #     -ub 2048 -b 16384
      #     --temp 0.7 --top-p 0.8 --top-k 20 --min-p 0.0
      #     --presence-penalty 1.0
      #   aliases:
      #     - "frontier"
      #     - "frontier-chat"
      #   ttl: 120

      # Sole chat model since 2026-09-24 (#701). --parallel 5 splits
      # --ctx-size 163840 into 5 slots of 32768. Raised 4 -> 5 slots
      # 2026-09-24 (#701, task 8b): Hindsight's retain queue was
      # backlogged at retain=1 (one batch_retain took 13 min). With 5
      # slots, background caps are retain 2 + consolidation 1 +
      # mental-model refresh 1 = 4 slots max, nested inside the global
      # cap, so one slot is always free for reflect (the plugin's
      # first-prompt synthesis) -- same invariant as before, just with
      # more background throughput. This reservation only holds within
      # Hindsight's own traffic: atuin (coder-large/frontier) and argus
      # (coder-large) also address this same model and share these same
      # 5 physical slots, uncounted by Hindsight's caps. Re-measure VRAM
      # (mem_info_vram_used)
      # after any change here; >=2 GiB free is the bar (last measured
      # 2690 MiB free with jina-reranker-v2 still loaded; it was disabled
      # 2026-09-25, freeing ~305 MiB more) -- if a future raise breaks
      # that bar, revert to 4
      # slots / --ctx-size 131072.
      "gpt-oss-20b":
        cmd: |
          ${llama-vulkan}
          --model /models/gpt-oss-20b-Q4_K_M.gguf
          --ctx-size 163840
          --parallel 5
          -ub 2048 -b 16384
          --temp 1.0 --top-p 1.0 --top-k 0
        aliases:
          - "reasoner"
          - "reasoning"
          - "coder"
          - "code-large"
          - "coder-large"
          - "frontier"
          - "frontier-chat"
        ttl: 0

      # Qwen2.5-Coder-7B — superseded by agentic-coder for multi-step work.
      # Kept commented for dense single-turn fallback if agentic-coder slot
      # proves unstable. Re-enabling needs either a free VRAM budget
      # alongside the always-on gpt-oss-20b (~11.5 GiB), or a restored
      # exclusive swap group like the old "chat" group -- see #701.
      # "qwen-coder-7b":
      #   cmd: |
      #     ${llama-vulkan}
      #     --model /models/Qwen2.5-Coder-7B-Instruct-Q4_K_M.gguf
      #     --ctx-size 16384
      #     --temp 0.2 --top-p 0.95
      #   aliases:
      #     - "code-7b"
      #   ttl: 600

      # ==================== ALWAYS-ON (concurrent) ====================

      # DISABLED 2026-09-25 (#701): only consumer was OpenViking's retrieval.rerank;
      # OpenViking retired (operator decision), Hindsight reranks in-process.
      # Reranker for OpenViking's `rerank` config, moved here 2026-09-10
      # from llama-swap-apu (bee-jms-03) for better throughput -- the APU
      # tier is a real memory-bandwidth-constrained node (documented
      # elsewhere for VLM/embedding timeouts), rerank benefits from dGPU
      # speed too. Only jina-reranker-v2 is confirmed to produce sane
      # scores through llama-server's rerank pooling -- an open,
      # unresolved llama.cpp issue (#16407) reports bge-reranker-v2-m3 and
      # Qwen3-Reranker (all sizes) returning garbage (e.g. 1e-28) scores
      # via this same code path. Do not substitute either without
      # re-verifying score sanity first. ctx-size 8192 matches the proven
      # APU-tier config (real rerank query+document batches never
      # approached that ceiling there). Runs concurrently alongside the
      # always-on gpt-oss-20b -- no swapping happens on this card since
      # 2026-09-24 (#701), so rerank calls never wait on anything. See
      # agentic-coder's ctx-size comment above for the VRAM trade-off this
      # originally required.
      # "jina-reranker-v2":
      #   cmd: |
      #     ${llama-vulkan-rerank}
      #     --model /models/jina-reranker-v2-base-multilingual-Q8_0.gguf
      #     --ctx-size 8192
      #   aliases:
      #     - "rerank"
      #     - "reranker"
      #   ttl: 0

    groups:
      # No "chat" group since 2026-09-24 (#701): gpt-oss-20b is the only
      # chat model on this card and lives in "always-on" below instead --
      # there is nothing left to swap between.
      #
      # gpt-oss-20b (chat, 5x32k slots) is the only resident model:
      # jina-reranker-v2 was disabled 2026-09-25 with OpenViking. Kept as an
      # "always-on" group (persistent: true, and ttl: 0 on the model) to
      # match llama-swap-apu's convention.
      "always-on":
        swap: false
        exclusive: false
        persistent: true
        members:
          - "gpt-oss-20b"

    hooks:
      on_startup:
        preload:
          - "gpt-oss-20b"
