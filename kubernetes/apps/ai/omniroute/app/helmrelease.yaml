---
# yamllint disable rule:line-length
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app omniroute
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    global:
      annotations:
        reloader.stakater.com/auto: "true"

    controllers:
      omniroute:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            fsGroup: 1000

        containers:
          app:
            image:
              repository: docker.io/diegosouzapw/omniroute
              # renovate: datasource=docker depName=diegosouzapw/omniroute versioning=semver
              tag: 3.8.50
              pullPolicy: IfNotPresent
            env:
              DATA_DIR: /app/data
              PORT: &dashboardPort "20128"
              DASHBOARD_PORT: *dashboardPort
              API_PORT: &apiPort "20129"
              API_HOST: "0.0.0.0"
              LIVE_WS_PORT: &liveWsPort "20132"
              LIVE_WS_HOST: "0.0.0.0"
              LIVE_WS_ALLOWED_ORIGINS: "https://omniroute.68cc.io"
              NODE_ENV: production
              # --max-old-space-size raised 2048->2560 alongside the 2Gi->3Gi
              # container limit below, 2026-09-17 -- root-caused a real
              # "[resourcePressure] critical pressure guard tripped
              # (reason=cgroup_ratio); returning 503" burst via direct
              # inspection, not assumed: cgroup memory.current/memory.max
              # read straight from the running pod showed real usage
              # bumping against the ceiling under load, and the V8 old-space
              # heap ceiling was set EQUAL to the container's entire 2Gi
              # memory limit -- zero headroom for anything else the process
              # needs (request/response buffers for large vlm payloads,
              # native/external memory, libuv). This tier now proxies much
              # larger, longer-lived requests than when these values were
              # first set: the 2026-09-17 vlm timeout fix (see openviking's
              # helmrelease.yaml) raised how long a single large-payload
              # request can stay in flight from 15s to 120s, and Omniroute's
              # own per-connection maxWaitMs cap is separately maxed at
              # 120000ms -- more large payloads now overlap in memory at
              # once than before that fix, which plausibly triggered this.
              # 2560/3072 leaves ~512Mi (~17%) headroom below the new
              # container limit for non-heap overhead, matching the
              # node's real, checked headroom (bigboi-jms-01: 33% memory
              # used cluster-wide per `kubectl top node`, ~20 GiB free --
              # raising this tier's ceiling costs nothing else running here).
              #
              # Raised again same day, 3Gi->6Gi container limit / 2560->5120
              # heap ceiling -- explicit operator ask for headroom to grow
              # into, not a response to a new observed pressure event. Same
              # ~83%/17% heap-to-limit ratio preserved. Deliberately left
              # unpinned to any node: this pod does no GPU/model inference
              # (pure gateway + the cliproxyapi sidecar, which just proxies
              # HTTP to CLI OAuth sessions), so it has no technical reason
              # to be pinned anywhere -- whichever node the scheduler picks
              # has ample room regardless (checked cluster-wide via
              # `kubectl top node` the same day: every node sits at 20-43%
              # memory used). Re-measure real usage under load (grep for
              # "resourcePressure" in this pod's logs) before raising
              # further; if pressure trips persist even at 6Gi, the actual
              # fix is probably capping how much OpenViking buffers per
              # vlm call, not another bump here.
              NODE_OPTIONS: "--max-old-space-size=5120"
              CLIPROXYAPI_HOST: "127.0.0.1"
              CLIPROXYAPI_PORT: "8317"
            envFrom:
              - secretRef:
                  name: omniroute-secrets
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: "2"
                memory: 6Gi
            probes:
              # Upstream's own compose healthcheck is `node healthcheck.mjs`
              # (an exec script, not an HTTP path) — confirmed by reading
              # both docker-compose.yml and docker-compose.prod.yml.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "healthcheck.mjs"]
                  initialDelaySeconds: 30
                  periodSeconds: 15
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "healthcheck.mjs"]
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  successThreshold: 2
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["node", "healthcheck.mjs"]
                  failureThreshold: 30
                  periodSeconds: 10

          cliproxyapi:
            image:
              repository: docker.io/eceasy/cli-proxy-api
              # renovate: datasource=docker depName=eceasy/cli-proxy-api versioning=semver
              tag: v7.3.7
              pullPolicy: IfNotPresent
            # No command/args override — the image's own default
            # CMD ["./CLIProxyAPI"] (run from WORKDIR /CLIProxyAPI) already
            # finds config.yaml in its working directory with no flag
            # needed. An earlier version of this file hardcoded
            # command: ["/cli-proxy-api"], a fabricated path that doesn't
            # exist in the image (real binary: /CLIProxyAPI/CLIProxyAPI) —
            # confirmed by reading router-for-me/CLIProxyAPI's Dockerfile
            # and cmd/server/main.go's config-path fallback directly. Don't
            # reintroduce a command override here.
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: "1"
                memory: 1Gi
            probes:
              # GET / — NOT /v1/models. /v1 requires an API key once real
              # api-keys are configured (always, by design, since
              # cliproxyapi's Service is cluster-reachable, not just
              # pod-local). GET / is registered outside any auth group at
              # our pinned v6.9.7 (confirmed via source read of
              # internal/api/server.go — /healthz doesn't exist at this
              # version, only on newer releases; don't "fix" this by
              # switching to /healthz without also bumping the pin).
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8317
                  initialDelaySeconds: 20
                  periodSeconds: 15
                  failureThreshold: 4
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 8317
                  initialDelaySeconds: 10
                  periodSeconds: 10

          shim:
            # Chat-Completions -> Responses API translation shim for
            # CLIProxyAPI, added 2026-09-17 (see
            # docs/superpowers/specs/2026-09-17-cliproxyapi-responses-shim-design.md).
            # CLIProxyAPI (the cliproxyapi container above) never
            # implemented a Chat Completions endpoint -- confirmed via
            # direct request, GET /v1/chat/completions there returns 404;
            # only /v1/responses exists (confirmed via GET returning 401,
            # not 404 -- the route exists, it just needs CLIProxyAPI's own
            # API-key auth). Omniroute's own handleChat always builds
            # Chat-Completions-shaped requests regardless of which of its
            # own routes is hit -- confirmed by POSTing a real
            # Responses-API-shaped body straight to Omniroute's own
            # /v1/responses and getting the identical "missing input"
            # error, proving that route is not a real implementation, just
            # an alias to the same internal handler. This container
            # translates the shape so every cliproxyapi/gpt-* model works
            # again. Omniroute itself is repointed (via its own management
            # API, a DB-only change -- see Task 3) to treat this container
            # as if it WERE CLIProxyAPI, so no combo/key config changes
            # anywhere else are needed. Reaches CLIProxyAPI at
            # 127.0.0.1:8317 -- only possible because this runs in the
            # SAME pod (shared network namespace); that port has never
            # been exposed as its own Service, a deliberate boundary from
            # the original Omniroute revival design
            # (docs/superpowers/specs/2026-09-07-omniroute-revival-design.md)
            # that this change does not alter -- do not add a Service port
            # for 8318 either.
            image:
              repository: docker.io/library/node
              # renovate: datasource=docker depName=node versioning=node
              tag: 22-alpine
              pullPolicy: IfNotPresent
            command: ["node", "/shim/server.js"]
            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: "1"
                memory: 256Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8318
                  initialDelaySeconds: 5
                  periodSeconds: 15
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: 8318
                  initialDelaySeconds: 3
                  periodSeconds: 10

    service:
      app:
        forceRename: *app
        controller: *app
        ports:
          http:
            port: 20128
          api:
            port: 20129
          livews:
            port: 20132
      cliproxyapi:
        controller: *app
        ports:
          http:
            port: 8317

    persistence:
      data:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 10Gi
        retain: true
        advancedMounts:
          omniroute:
            app:
              - path: /app/data
      cliproxyapi-data:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 1Gi
        retain: true
        advancedMounts:
          omniroute:
            cliproxyapi:
              - path: /root/.cli-proxy-api
      cliproxy-config:
        type: secret
        name: omniroute-secrets
        advancedMounts:
          omniroute:
            cliproxyapi:
              - path: /CLIProxyAPI/config.yaml
                subPath: cliproxy-config.yaml
                readOnly: true
            shim:
              - path: /shim-config/cliproxy-config.yaml
                subPath: cliproxy-config.yaml
                readOnly: true
      shim-script:
        type: configMap
        name: omniroute-shim-script
        advancedMounts:
          omniroute:
            shim:
              - path: /shim/server.js
                subPath: server.js
                readOnly: true
