---
apiVersion: v1
kind: ConfigMap
metadata:
  name: omniroute-shim-script
data:
  server.js: |
    'use strict';
    const http = require('http');
    const fs = require('fs');
    const crypto = require('crypto');

    const PORT = 8318;
    const CLIPROXY_HOST = '127.0.0.1';
    const CLIPROXY_PORT = 8317;
    const CONFIG_PATH = '/shim-config/cliproxy-config.yaml';

    function requireEnv(name) {
      const v = process.env[name];
      if (!v) throw new Error('missing required env var ' + name);
      return v;
    }

    const SHIM_SHARED_SECRET = requireEnv('SHIM_SHARED_SECRET');
    const FALLBACK_BASE_URL = requireEnv('FALLBACK_BASE_URL');
    const FALLBACK_MODEL = requireEnv('FALLBACK_MODEL');
    // Two independently-tunable timeouts, not one shared constant -- see
    // helmrelease.yaml's shim env comments and CLAUDE.md's openviking bullet
    // for the capacity math behind these specific values.
    const PRIMARY_TIMEOUT_MS = parseInt(requireEnv('PRIMARY_TIMEOUT_MS'), 10);
    const FALLBACK_TIMEOUT_MS = parseInt(requireEnv('FALLBACK_TIMEOUT_MS'), 10);

    // Parses CLIProxyAPI's own api-keys list out of its mounted config file.
    // Shape confirmed live (2026-09-17 plan, Task 2 Step 1): a plain YAML
    // list of quoted strings under `api-keys:`, e.g.:
    //   api-keys:
    //     - "sk-..."
    function loadApiKey() {
      const raw = fs.readFileSync(CONFIG_PATH, 'utf8');
      const lines = raw.split('\n');
      let inApiKeys = false;
      for (const line of lines) {
        if (/^api-keys:/.test(line)) { inApiKeys = true; continue; }
        if (inApiKeys) {
          if (/^\S/.test(line)) break;
          const m = line.match(/-\s*"?([^"\s]+)"?\s*$/);
          if (m) return m[1];
        }
      }
      throw new Error('no api key found in ' + CONFIG_PATH);
    }

    const CLIPROXY_KEY = loadApiKey();

    class ShimError extends Error {
      constructor(status, message) {
        super(message);
        this.status = status;
      }
    }

    function readBody(req) {
      return new Promise((resolve, reject) => {
        let data = '';
        req.on('data', (c) => { data += c; });
        req.on('end', () => resolve(data));
        req.on('error', reject);
      });
    }

    // Constant-time comparison -- not a real practical risk here (64-hex-char
    // secret, no length oracle, and a much cheaper unauthenticated path
    // already exists elsewhere in this cluster, see CLAUDE.md's "Known
    // Omniroute limitations" /v1/messages bullet) but cheap to do right while
    // this function is already being touched.
    function checkAuth(req) {
      const header = req.headers['authorization'] || '';
      const expected = 'Bearer ' + SHIM_SHARED_SECRET;
      const headerBuf = Buffer.from(header);
      const expectedBuf = Buffer.from(expected);
      if (headerBuf.length !== expectedBuf.length) return false;
      return crypto.timingSafeEqual(headerBuf, expectedBuf);
    }

    // True if any message has a non-text content part (e.g. image_url). These
    // route straight to the local fallback (already vision-capable) instead of
    // being translated for CLIProxyAPI -- see
    // docs/superpowers/specs/2026-09-18-openviking-vlm-direct-shim-design.md.
    function hasNonTextContent(messages) {
      for (const m of messages) {
        if (Array.isArray(m.content)) {
          for (const part of m.content) {
            if (part.type !== 'text') return true;
          }
        }
      }
      return false;
    }

    // Text-only -- callers must route non-text content to the fallback via
    // hasNonTextContent() BEFORE calling this. The throw below is
    // defense-in-depth only (should be unreachable in normal operation); if it
    // ever fires, the caller's catch block routes to the fallback anyway.
    function chatToResponsesInput(messages) {
      const input = [];
      for (const m of messages) {
        if (typeof m.content === 'string') {
          input.push({ role: m.role, content: [{ type: 'input_text', text: m.content }] });
          continue;
        }
        if (Array.isArray(m.content)) {
          const parts = [];
          for (const part of m.content) {
            if (part.type === 'text') {
              parts.push({ type: 'input_text', text: part.text });
            } else {
              throw new ShimError(400, `Unsupported content type "${part.type}" reached chatToResponsesInput -- this should have been routed to the fallback by hasNonTextContent() first.`);
            }
          }
          input.push({ role: m.role, content: parts });
          continue;
        }
        throw new ShimError(400, `Unsupported message content shape for role "${m.role}"`);
      }
      return input;
    }

    function callCliProxy(path, body) {
      return new Promise((resolve, reject) => {
        const payload = JSON.stringify(body);
        const req = http.request(
          {
            host: CLIPROXY_HOST,
            port: CLIPROXY_PORT,
            path,
            method: 'POST',
            timeout: PRIMARY_TIMEOUT_MS,
            headers: {
              Authorization: 'Bearer ' + CLIPROXY_KEY,
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload),
            },
          },
          (res) => {
            let data = '';
            res.on('data', (c) => { data += c; });
            res.on('end', () => resolve({ status: res.statusCode, body: data }));
          }
        );
        req.on('timeout', () => req.destroy(new Error('CLIProxyAPI request timed out after ' + PRIMARY_TIMEOUT_MS + 'ms')));
        req.on('error', reject);
        req.end(payload);
      });
    }

    // Forwards the ORIGINAL (untranslated) Chat-Completions body to
    // llama-swap-apu's real vlm model, only overriding `model`. No translation
    // needed either direction -- llama-swap already speaks Chat-Completions
    // natively, images included.
    function callFallback(originalBody) {
      return new Promise((resolve, reject) => {
        const payload = JSON.stringify(Object.assign({}, originalBody, { model: FALLBACK_MODEL }));
        const url = new URL(FALLBACK_BASE_URL + '/chat/completions');
        const req = http.request(
          {
            host: url.hostname,
            port: url.port || 80,
            path: url.pathname,
            method: 'POST',
            timeout: FALLBACK_TIMEOUT_MS,
            headers: {
              'Content-Type': 'application/json',
              'Content-Length': Buffer.byteLength(payload),
            },
          },
          (res) => {
            let data = '';
            res.on('data', (c) => { data += c; });
            res.on('end', () => resolve({ status: res.statusCode, body: data }));
          }
        );
        req.on('timeout', () => req.destroy(new Error('fallback request timed out after ' + FALLBACK_TIMEOUT_MS + 'ms')));
        req.on('error', reject);
        req.end(payload);
      });
    }

    // Field extraction CONFIRMED against a real CLIProxyAPI /v1/responses
    // response (2026-09-17 plan, Task 2 Step 2). Real shape observed:
    //   output: [{ type: "message", role: "assistant", content: [
    //     { type: "output_text", text: "..." }
    //   ]}]
    //   usage: { input_tokens, output_tokens, total_tokens, ... }
    function responsesToChatCompletion(model, responsesBody) {
      const parsed = JSON.parse(responsesBody);
      let text = '';
      // foundShape tracks whether a recognized output field was present at all
      // (an output_text string, or an output[] item shaped like
      // {type:"message", content:[...]}) -- NOT whether any text ended up
      // extracted. A model legitimately replying with empty text is a normal
      // 200; a response with no recognizable output field at all is an
      // unexpected upstream shape and must fail loudly (caught by the caller,
      // which routes to the fallback) instead of silently returning empty
      // content.
      let foundShape = false;
      if (typeof parsed.output_text === 'string') {
        text = parsed.output_text;
        foundShape = true;
      } else if (Array.isArray(parsed.output)) {
        for (const item of parsed.output) {
          if (item.type === 'message' && Array.isArray(item.content)) {
            foundShape = true;
            for (const c of item.content) {
              if (typeof c.text === 'string') text += c.text;
            }
          }
        }
      }
      if (!foundShape) {
        throw new ShimError(
          502,
          'unexpected /v1/responses shape: no extractable output (no output_text string and no output[] item shaped {type:"message", content:[...]})'
        );
      }
      const usage = parsed.usage || {};
      return {
        id: parsed.id || 'shim-' + Date.now(),
        object: 'chat.completion',
        created: Math.floor(Date.now() / 1000),
        model,
        choices: [
          {
            index: 0,
            finish_reason: 'stop',
            message: { role: 'assistant', content: text },
          },
        ],
        usage: {
          prompt_tokens: usage.input_tokens || 0,
          completion_tokens: usage.output_tokens || 0,
          total_tokens: usage.total_tokens || (usage.input_tokens || 0) + (usage.output_tokens || 0),
        },
      };
    }

    function sendError(res, status, message, upstream) {
      const body = { error: { message, type: 'server_error', code: 'shim_error' } };
      if (upstream !== undefined) body.upstream_details = upstream;
      res.writeHead(status, { 'content-type': 'application/json' });
      res.end(JSON.stringify(body));
    }

    // Strips characters that would be invalid/dangerous in a raw HTTP header
    // value (CRLF header-injection, mainly) -- used only for the diagnostic
    // X-Shim-Primary-Error header below, never for the JSON response body.
    function headerSafe(s) {
      return String(s).replace(/[\r\n]+/g, ' ');
    }

    // Shared by both fallback-triggering paths (non-text content, and a
    // failed CLIProxyAPI leg) so logging/response-shaping only needs to live
    // in one place. Always resolves by sending exactly one response -- never
    // throws past itself.
    //   - reason: short human-readable string for why we're here (logged).
    //   - primaryErrMessage: null when triggered by non-text content; the
    //     primary leg's error message when triggered by a CLIProxyAPI
    //     failure. Never mixed into the fallback's own response body (the
    //     body is always a faithful passthrough of the fallback's real
    //     response) -- surfaced only via logs and, on a non-2xx fallback
    //     response, a response header.
    async function respondViaFallback(res, parsed, reason, primaryErrMessage) {
      console.warn(
        '[shim] routing to local fallback:',
        reason + (primaryErrMessage ? (' -- primary error: ' + primaryErrMessage) : '')
      );
      try {
        const fb = await callFallback(parsed);
        const headers = { 'content-type': 'application/json' };
        if ((fb.status < 200 || fb.status >= 300) && primaryErrMessage) {
          console.warn(
            '[shim] fallback also returned non-2xx status', fb.status,
            'after primary failure:', primaryErrMessage
          );
          headers['X-Shim-Primary-Error'] = headerSafe(primaryErrMessage);
        }
        res.writeHead(fb.status, headers);
        res.end(fb.body);
      } catch (fallbackErr) {
        if (primaryErrMessage) {
          sendError(res, 502, 'both CLIProxyAPI and local fallback failed: ' + primaryErrMessage + ' / ' + fallbackErr.message);
        } else {
          sendError(res, 502, 'local fallback request failed: ' + fallbackErr.message);
        }
      }
    }

    const server = http.createServer(async (req, res) => {
      if (req.method === 'GET' && req.url === '/healthz') {
        res.writeHead(200, { 'content-type': 'application/json' });
        res.end(JSON.stringify({ status: 'ok' }));
        return;
      }

      if (!checkAuth(req)) {
        sendError(res, 401, 'unauthorized');
        return;
      }

      if (req.method !== 'POST' || req.url !== '/v1/chat/completions') {
        sendError(res, 404, 'not found');
        return;
      }

      // Everything below can throw on malformed/unexpected input (null body,
      // non-array `messages`, a `messages` entry that isn't an object, etc).
      // A synchronous throw in an async function becomes a rejected promise;
      // since http.createServer's callback return value is discarded, an
      // uncaught rejection here would otherwise crash the whole process
      // (node:24-alpine defaults to --unhandled-rejections=throw). This
      // top-level try/catch is the backstop -- the two inner try/catch blocks
      // below (CLIProxyAPI leg, fallback leg) are fine to leave nested inside
      // it since they already send their own responses and return
      // immediately after.
      try {
        let parsed;
        try {
          const raw = await readBody(req);
          parsed = JSON.parse(raw);
        } catch (err) {
          sendError(res, 400, 'invalid request body: ' + err.message);
          return;
        }

        const messages = (parsed && parsed.messages) || [];

        if (hasNonTextContent(messages)) {
          await respondViaFallback(res, parsed, 'request contains non-text content (e.g. image_url)', null);
          return;
        }

        let primaryErrMessage = null;
        try {
          const input = chatToResponsesInput(messages);
          const responsesBody = { model: parsed.model, input };
          if (parsed.max_tokens) responsesBody.max_output_tokens = parsed.max_tokens;
          if (parsed.temperature !== undefined) responsesBody.temperature = parsed.temperature;

          const upstream = await callCliProxy('/v1/responses', responsesBody);
          if (upstream.status < 200 || upstream.status >= 300) {
            throw new ShimError(upstream.status, 'CLIProxyAPI request failed with status ' + upstream.status);
          }
          const chatBody = responsesToChatCompletion(parsed.model, upstream.body);
          console.log('[shim] served via primary (CLIProxyAPI) leg, model=' + parsed.model);
          res.writeHead(200, { 'content-type': 'application/json' });
          res.end(JSON.stringify(chatBody));
          return;
        } catch (err) {
          primaryErrMessage = err.message;
        }

        // CLIProxyAPI leg failed (non-2xx, network error, timeout, or
        // unexpected response shape) -- fall back to the local model,
        // mirroring the old openviking-vlm combo's two-leg behavior. See
        // docs/superpowers/specs/2026-09-18-openviking-vlm-direct-shim-design.md.
        await respondViaFallback(res, parsed, 'CLIProxyAPI (primary) leg failed', primaryErrMessage);
      } catch (err) {
        sendError(res, 500, 'shim internal error: ' + err.message);
      }
    });

    server.listen(PORT, '0.0.0.0', () => console.log('shim listening on', PORT));
