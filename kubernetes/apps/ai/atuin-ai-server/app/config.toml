port = 8080

# Omniroute gateway, cluster-internal (kubernetes/apps/ai/omniroute/).
# Mirrors llama-swap's coder-large model via Omniroute's llamaswap
# provider-node prefix -- see docs/superpowers/specs/
# 2026-09-08-omniroute-phase2-switchover-design.md. Switched from LiteLLM
# 2026-09-09 (Phase 2 switchover follow-up -- this consumer was missed in
# the original repoint pass and discovered live-broken while validating
# Task 5's teardown).
endpoint = "http://omniroute.ai.svc.cluster.local:20128/v1"

default_model = "coder-large"

[api_key]
env = "CHAT_API_KEY"

[[models]]
alias = "coder-large"
name = "Coder Large"
description = "Qwen3-Coder-30B-A3B (MoE) via llama-swap, mirrored through Omniroute"
model = "llamaswap/coder-large"
