---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/gitrepository-source-v1.json
# Points at j0sh3rs/argus (a fork of olivecasazza/argus), not upstream --
# the fork carries our own chart-dependency bumps (e.g. holmes 0.39.0)
# ahead of upstream, tagged and released independently.
#
# Deliberate exception to this repo's OCIRepository+chartRef convention,
# same reasoning as kubernetes/apps/ai/openviking/app/gitrepository.yaml:
# GitRepository + ref.tag lets Renovate's flux manager bump this the same
# way it already does for openviking, without inventing a separate
# commit-digest tracking mechanism. (The fork *does* also publish an OCI
# artifact at oci://ghcr.io/j0sh3rs/argus/charts/argus and a gh-pages
# index -- see .github/workflows/release.yml in the fork -- but this repo
# stays on the GitRepository pattern for consistency with openviking.)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: argus
spec:
  interval: 12h
  ref:
    tag: v0.1.1
  url: https://github.com/j0sh3rs/argus
