---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/gitrepository-source-v1.json
# Points at j0sh3rs/argus (a fork of olivecasazza/argus), not upstream --
# the fork carries our own chart-dependency bumps (e.g. holmes 0.39.0)
# ahead of upstream, tagged and released independently.
#
# Deliberate exception to this repo's OCIRepository+chartRef convention,
# same reasoning as archive/openviking/app/gitrepository.yaml used before
# OpenViking was retired 2026-09-25 (see kubernetes/apps/ai/CLAUDE.md):
# GitRepository + ref.tag lets Renovate's flux manager bump this without
# inventing a separate commit-digest tracking mechanism. (The fork *does*
# also publish an OCI artifact at oci://ghcr.io/j0sh3rs/argus/charts/argus
# and a gh-pages index -- see .github/workflows/release.yml in the fork --
# but this repo stays on the GitRepository pattern here for consistency
# with that precedent.)
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: argus
spec:
  interval: 12h
  ref:
    tag: v0.1.5
  url: https://github.com/j0sh3rs/argus
