---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Hindsight memory server (#701): the sole memory layer since 2026-09-25,
# when OpenViking was retired by operator decision after hands-on comparison
# (manifests in archive/openviking/; the #704 recall eval is still open).
# Design:
# docs/superpowers/specs/2026-09-24-hindsight-deployment-design.md
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hindsight
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: hindsight
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # True stop-then-start rollout for hindsight-api (chart has no strategy
  # value): type: Recreate -- the old pod is fully deleted before the new
  # one is created. Pairs with the stable HINDSIGHT_API_WORKER_ID below:
  # startup recovery only reclaims 'processing' rows owned by this worker's
  # own id, so a stable id lets a replacement pod reclaim its predecessor's
  # claims -- and Recreate guarantees the predecessor is gone (not merely
  # Terminating) before the replacement starts, so it can never reset rows
  # a still-running old pod is mid-way through.
  #
  # 2026-09-25 history: hostname-based worker ids left 6 retains wedged in
  # 'processing' under a dead pod for 16h (task 8b incident), fixed with
  # the stable worker id above. The first fix for the rollout itself was
  # RollingUpdate maxSurge 0 / maxUnavailable 1, on the theory that for a
  # single replica it serializes old-then-new -- WRONG: Kubernetes creates
  # the new pod as soon as the old pod gets a deletionTimestamp, not after
  # it actually exits, so the two pods can run concurrently for up to the
  # full 30s terminationGracePeriodSeconds (upstream shutdown_graceful
  # timeout) while the old pod's release_own_tasks() and the new pod's
  # recover_own_tasks() race over the same worker id -- double extraction.
  # type: Recreate was tried next and initially rejected: under
  # server-side apply the *live* Deployment's defaulted
  # spec.strategy.rollingUpdate fields, owned by another field manager,
  # survived the patch and the API refused rollingUpdate + Recreate
  # together. Fixed with a one-time, out-of-band live patch that clears
  # the stale rollingUpdate block so SSA stops fighting (does not itself
  # restart the pod; run again only if a future Deployment recreate
  # reintroduces a defaulted rollingUpdate):
  #   kubectl patch deploy -n ai hindsight-api --type=json \
  #     -p '[{"op":"replace","path":"/spec/strategy","value":{"type":"Recreate"}}]'
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: hindsight-api
            patch: |
              - op: add
                path: /spec/strategy
                value:
                  type: Recreate
  values:
    # Image tag for api + control plane. Keep equal to the chart tag.
    # Bump together with ocirepository.yaml's tag and regenerate
    # configmap-extension.yaml (Renovate automerge disabled for
    # vectorize-io -- see .renovate/autoMerge.json5).
    version: "0.10.1"
    # envFrom on both pods: postgres-password,
    # HINDSIGHT_API_TENANT_USERS, HINDSIGHT_CP_DATAPLANE_API_KEY.
    existingSecret: hindsight-secret
    podAnnotations:
      reloader.stakater.com/auto: "true"

    api:
      replicaCount: 1
      # Default image bakes in bge-small-en-v1.5 + ms-marco-MiniLM-L-6-v2, so
      # recall has no inference dependency and no model PVC. The in-process
      # torch models put this pod above the repo's <2Gi guideline (accepted
      # in the spec); right-size after the retain trial.
      resources:
        requests:
          cpu: 250m
          memory: 1Gi
        limits:
          cpu: "2"
          memory: 4Gi
      env:
        # Stable worker id (default is the pod hostname) so claims survive
        # pod replacement -- see the postRenderers comment above.
        HINDSIGHT_API_WORKER_ID: hindsight-api
        HINDSIGHT_API_LLM_PROVIDER: openai
        # Direct to llama-swap (gpt-oss-20b via its `reasoner` alias), NOT
        # through Omniroute -- changed 2026-09-25. Long consolidation/retain
        # calls under 5-slot contention exceed 120s; Omniroute's per-
        # connection execution cap (maxWaitMs) tops out at 120000 by schema,
        # so no Omniroute setting can allow longer calls. With the old 120s
        # client timeout too, 43 consolidation batches timed out in 12h and
        # were retried from scratch (one operation spun for 9.5h). llama-swap
        # serves only local models, so the Anthropic-lane isolation the old
        # scoped `hindsight-retain` Omniroute key provided is now structural
        # (that key was revoked). llama-swap ignores the API key.
        HINDSIGHT_API_LLM_BASE_URL: http://llama-swap.ai.svc.cluster.local:8080/v1
        HINDSIGHT_API_LLM_MODEL: reasoner
        HINDSIGHT_API_LLM_API_KEY: not-needed
        # Per-attempt LLM timeout (default 120s). Covers retain and
        # consolidation (they inherit it); reflect keeps its own 30s default.
        HINDSIGHT_API_LLM_TIMEOUT: "600"
        # llama-swap runs gpt-oss-20b with 5 slots (raised 4 -> 5
        # 2026-09-24, #701 task 8b: retain queue was backlogged at
        # retain=1, one batch_retain took 13 min). Background operations
        # are capped at retain 2 + consolidation 1 + mental-model refresh
        # 1 = 4 slots max (the per-op caps nest inside the global cap), so
        # one slot always stays free for reflect -- but only within
        # Hindsight's own traffic: atuin (coder-large/frontier) and argus
        # (coder-large) share the same 5 physical slots on this model,
        # unaccounted for by this reservation.
        HINDSIGHT_API_LLM_MAX_CONCURRENT: "5"
        HINDSIGHT_API_RETAIN_LLM_MAX_CONCURRENT: "2"
        HINDSIGHT_API_CONSOLIDATION_LLM_MAX_CONCURRENT: "1"
        HINDSIGHT_API_MENTAL_MODEL_REFRESH_LLM_MAX_CONCURRENT: "1"
        # Upstream default 64000 cannot fit a 32k slot; reasoning tokens
        # count against this budget, hence low effort.
        HINDSIGHT_API_RETAIN_MAX_COMPLETION_TOKENS: "16000"
        HINDSIGHT_API_RETAIN_LLM_REASONING_EFFORT: low
        # Strict json_schema response_format for fact extraction
        # (2026-09-25): the default soft mode (json_object + schema pasted
        # into the prompt) only guarantees valid JSON, and gpt-oss-20b
        # regularly dropped required fields ("missing 'what' field",
        # "all N facts ... unusable after 4 attempts" -- ~40% of retains in
        # a 10-min sample). Strict mode lets llama-server compile the schema
        # into a decoding grammar; verified 3/3 schema-complete responses
        # through Omniroute -> llama-swap before enabling.
        HINDSIGHT_API_LLM_STRICT_SCHEMA_RETAIN: "true"
        # Per-client keys, all mapped to user josh -> one shared schema
        # (user_josh). Extension source: configmap-extension.yaml.
        HINDSIGHT_API_TENANT_EXTENSION: hindsight_ext_static_keys_tenant:StaticKeysTenantExtension
        PYTHONPATH: /app/extensions
        # Applied to every new bank: Memory Defense (#702) redacts secrets
        # and PII before storage; concise extraction (upstream #4560).
        HINDSIGHT_API_DEFAULT_BANK_TEMPLATE: '{"version":"1","bank":{"memory_defense":{"enabled":true,"rules":[{"on":"sensitive_data","action":"redact"}]},"retain_extraction_mode":"concise"}}'
      extraVolumes:
        - name: tenant-ext
          configMap:
            name: hindsight-static-keys-ext
      extraVolumeMounts:
        - name: tenant-ext
          mountPath: /app/extensions/hindsight_ext_static_keys_tenant
          readOnly: true

    worker:
      # The API runs the queue worker in-process (single replica rule).
      enabled: false

    controlPlane:
      replicaCount: 1

    postgresql:
      enabled: false
      external:
        host: postgres17-rw.databases.svc.cluster.local
        port: 5432
        database: hindsight
        username: hindsight

    metrics:
      serviceMonitor:
        enabled: true
