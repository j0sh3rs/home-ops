---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# AI workloads namespace: fully self-hosted, no third-party providers.
# llama-swap serves local GGUFs directly (OpenAI-compatible API); openclaw
# (code agent, no memory plugin active) and holmesgpt (observability) and
# other consumers talk to it directly — no gateway layer. litellm/omniroute
# (cloud-routing gateways), n8n, opencode, agent-canvas, cognee, and
# kelos-system were removed 2026-08-14; memini (memory plugin -- its own
# extension threw a command-registration error on every openclaw boot) was
# removed 2026-08-16; see CLAUDE.md and archive/{cognee,memini}/.
#
# ollama (2026-08-16): comparison spike, NOT a replacement for llama-swap.
# Shares the same single-GPU node (bigboi-jms-01, amd.com/gpu: 1
# allocatable) -- the two cannot run concurrently. Suspend llama-swap's
# HelmRelease before scaling ollama up. See ollama/app/helmrelease.yaml.
#
# Components:
#   - common                 — namespace + cluster-secrets + sops-age
#   - repos/app-template     — bjw-s app-template OCIRepository in this ns
#                              (llama-swap uses it)
#   - authentik-forwardauth  — authentik-forwardauth Middleware materialized
#                              in-namespace; HTTPRoutes ExtensionRef it
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
components:
  - ../../components/common
  - ../../components/repos/app-template
  - ../../components/authentik-forwardauth
resources:
  - ./faster-whisper/ks.yaml
  - ./holmesgpt/ks.yaml
  - ./llama-swap/ks.yaml
  - ./ollama/ks.yaml
  - ./openclaw/ks.yaml
  - ./openviking/ks.yaml
  - ./piper/ks.yaml
  # - ./mcpjungle/ks.yaml
  # - ./omega-mcp/ks.yaml
