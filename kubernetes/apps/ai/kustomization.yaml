---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# AI workloads namespace: fully self-hosted, no third-party providers,
# with one documented scoped exception: holyclaude (see CLAUDE.md).
# llama-swap serves local GGUFs directly (OpenAI-compatible API); Omniroute
# fronts both llama-swap instances as the AI-namespace gateway (Phase 2
# switchover, 2026-09-08 -- see
# docs/superpowers/specs/2026-09-08-omniroute-phase2-switchover-design.md).
# LiteLLM and litellm-operator were fully removed the same change (not kept
# as cold standby). n8n, opencode, agent-canvas, cognee, and kelos-system
# remain removed 2026-08-14 (opencode returns only inside holyclaude, a
# scoped exception -- see CLAUDE.md); memini (memory plugin -- its own
# extension threw a command-registration error on every openclaw boot) was
# removed 2026-08-16; see CLAUDE.md and archive/{cognee,memini}/. The
# standalone holmesgpt app was retired 2026-08-19 -- argus's bundled Holmes
# subchart (argus-holmes) is now the only HolmesGPT instance, fronted by
# argus's Discord-bridging forwarder for triage summaries. openclaw and
# argus remain commented out below (not currently deployed) but their
# config already points at Omniroute for whenever either is re-enabled.
#
# Components:
#   - common                 — namespace + cluster-secrets + sops-age
#   - repos/app-template     — bjw-s app-template OCIRepository in this ns
#                              (llama-swap uses it)
#   - authentik-forwardauth  — authentik-forwardauth Middleware materialized
#                              in-namespace; HTTPRoutes ExtensionRef it
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
components:
  - ../../components/common
  - ../../components/repos/app-template
  - ../../components/authentik-forwardauth
resources:
  # - ./argus/ks.yaml
  - ./atuin-ai-server/ks.yaml
  - ./faster-whisper/ks.yaml
  - ./holyclaude/ks.yaml
  - ./llama-swap/ks.yaml
  - ./llama-swap-apu/ks.yaml
  - ./omniroute/ks.yaml
  # - ./openclaw/ks.yaml
  - ./openviking/ks.yaml
  - ./piper/ks.yaml

# holyclaude needs SYS_ADMIN/SYS_PTRACE capabilities and
# seccompProfile.type=Unconfined for its sandboxed Chromium/Playwright
# stack. PodSecurity "baseline" (this cluster's effective default for any
# unlabeled namespace) rejects both. No other workload in this namespace
# currently needs elevated privileges -- this is a holyclaude-driven
# exception, documented in CLAUDE.md. Same pattern as services/monitoring.
patches:
  - target:
      kind: Namespace
      # Original name from components/common/namespace.yaml; kustomize rewrites
      # this to "ai" via the `namespace:` field above.
      name: not-used
    patch: |-
      apiVersion: v1
      kind: Namespace
      metadata:
        name: not-used
        labels:
          pod-security.kubernetes.io/enforce: privileged
          pod-security.kubernetes.io/audit: privileged
          pod-security.kubernetes.io/warn: privileged
