---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# AI workloads namespace: fully self-hosted, no third-party providers,
# with one documented scoped exception: holyclaude (see CLAUDE.md).
# llama-swap serves local GGUFs directly (OpenAI-compatible API); openclaw
# (code agent, no memory plugin active) talks to it directly, routed via
# litellm. litellm (via litellm-operator) was reintroduced as a
# cluster-internal-only mirror in front of llama-swap/llama-swap-apu — no
# cloud provider routing, unlike the 2026-08-14-removed instance. omniroute,
# n8n, opencode, agent-canvas, cognee, and kelos-system remain removed
# 2026-08-14 (opencode returns only inside holyclaude, a scoped exception --
# see CLAUDE.md); memini (memory plugin -- its own extension threw a
# command-registration error on every openclaw boot) was removed
# 2026-08-16; see CLAUDE.md and archive/{cognee,memini}/. The standalone
# holmesgpt app was retired 2026-08-19 -- argus's bundled Holmes subchart
# (argus-holmes) is now the only HolmesGPT instance, fronted by argus's
# Discord-bridging forwarder for triage summaries.
#
# Components:
#   - common                 — namespace + cluster-secrets + sops-age
#   - repos/app-template     — bjw-s app-template OCIRepository in this ns
#                              (llama-swap uses it)
#   - authentik-forwardauth  — authentik-forwardauth Middleware materialized
#                              in-namespace; HTTPRoutes ExtensionRef it
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
components:
  - ../../components/common
  - ../../components/repos/app-template
  - ../../components/authentik-forwardauth
resources:
  - ./argus/ks.yaml
  - ./atuin-ai-server/ks.yaml
  - ./faster-whisper/ks.yaml
  - ./holyclaude/ks.yaml
  - ./litellm/ks.yaml
  - ./litellm-operator/ks.yaml
  - ./llama-swap/ks.yaml
  - ./llama-swap-apu/ks.yaml
  # - ./openclaw/ks.yaml
  - ./openviking/ks.yaml
  - ./piper/ks.yaml
