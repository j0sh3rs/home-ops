---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./middleware.yaml
  - ./secret.sops.yaml
configMapGenerator:
  # Pinned npm install (package.json + lockfile with integrity hashes).
  # Fixed name so the HelmRelease can reference it; reloader rolls the pod
  # when Renovate bumps the lockfile.
  - name: vikunja-mcp-npm
    files:
      - package.json=./npm/package.json
      - package-lock.json=./npm/package-lock.json
generatorOptions:
  disableNameSuffixHash: true
