---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# Vikunja MCP server (#722): task/project CRUD for agents. Upstream
# (aimbitgmbh/vikunja-mcp, Vikunja 2.6+ API v2) is a stdio-only npm package
# with no image. An init container runs `npm ci` against the pinned lockfile
# in the vikunja-mcp-npm ConfigMap (app/npm/), and supergateway serves it as
# streamable HTTP at :8000/mcp. Same image for both, so the install and the
# runtime use the same node.
# Permanent deletes stay off (ENABLE_*_DELETE unset: the delete tools return
# an error). The LAN route requires basic auth (middleware.yaml) because this
# server can write. In-cluster callers (HolyClaude) use the Service directly.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app vikunja-mcp
spec:
  interval: 1h
  timeout: 10m
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      vikunja-mcp:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          npm-ci:
            image: &image
              repository: ghcr.io/supercorp-ai/supergateway
              tag: 4.1.0@sha256:1938c43538a5308bce07d58028e9de00b7acfecb40b39b059b2f3931800ad910
            command:
              - sh
              - -c
              - >-
                cp /npm/package.json /npm/package-lock.json /mcp/ &&
                cd /mcp &&
                npm ci --omit=dev --ignore-scripts --no-audit --no-fund
            env:
              HOME: /tmp
              npm_config_cache: /tmp/.npm
              npm_config_update_notifier: "false"
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            args:
              - --stdio
              - node /mcp/node_modules/@aimbitgmbh/vikunja-mcp/dist/index.js
              - --outputTransport
              - streamableHttp
              - --port
              - "8000"
              - --streamableHttpPath
              - /mcp
            env:
              # In-cluster Service, not tasks.68cc.io (skips Cloudflare and
              # Traefik). The child stdio process inherits this env.
              VIKUNJA_URL: http://vikunja.services.svc.cluster.local:3456
              HOME: /tmp
            envFrom:
              - secretRef:
                  name: vikunja-mcp-secret
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 384Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 10
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: 8000
                  initialDelaySeconds: 5
                  periodSeconds: 10
        pod:
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            fsGroup: 1000
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: 8000
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.17
        hostnames: ["vikunja-mcp.68cc.io"]
        parentRefs:
          - name: traefik-internal-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: vikunja-mcp-basic-auth
            backendRefs:
              - name: *app
                port: 8000
    persistence:
      npm:
        type: configMap
        name: vikunja-mcp-npm
        advancedMounts:
          vikunja-mcp:
            npm-ci:
              - path: /npm
                readOnly: true
      mcp:
        type: emptyDir
        globalMounts:
          - path: /mcp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
