---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ollama
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ollama:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/ollama/ollama
              # renovate: datasource=docker depName=ollama/ollama
              tag: "0.23.0"
            env:
              OLLAMA_HOST: "0.0.0.0"
              OLLAMA_MODELS: /models
              # 2026-08-16: confirmed live -- Vulkan is NOT on by default in
              # 0.23.0 despite docs.ollama.com/gpu implying it is ("server
              # config" log line shows OLLAMA_VULKAN:false, "experimental
              # Vulkan support disabled" until this is set). Without it,
              # ollama silently falls back to CPU.
              OLLAMA_VULKAN: "1"
              GGML_VK_VISIBLE_DEVICES: "0"
              OLLAMA_NUM_PARALLEL: "1"
              OLLAMA_MAX_LOADED_MODELS: "1"
            resources:
              requests:
                cpu: 500m
                memory: 4Gi
              limits:
                memory: 16Gi
                amd.com/gpu: "1"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11434
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: 11434
                  initialDelaySeconds: 10
                  periodSeconds: 10
              startup:
                enabled: false
            securityContext:
              # Image runs as root; /dev/kfd + /dev/dri access is mediated
              # by the AMD device plugin (amd.com/gpu resource), not
              # privileged mode -- same pattern as llama-swap.
              runAsNonRoot: false
              runAsUser: 0
    service:
      app:
        controller: *app
        ports:
          http:
            port: &port 11434
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.17
        hostnames: ["ollama.68cc.io"]
        parentRefs:
          - name: traefik-internal-gateway
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      models:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath-fast
        accessMode: ReadWriteOnce
        size: 50Gi
        retain: true
        globalMounts:
          - path: /models
    defaultPodOptions:
      # Same GPU node as llama-swap -- deliberate: this is a spike to
      # compare the two engines on identical hardware, not a permanent
      # second inference node. The amd-gpu device plugin advertises
      # exactly amd.com/gpu: 1 on this node, so llama-swap and ollama
      # CANNOT run concurrently here -- suspend the llama-swap
      # HelmRelease (flux suspend hr llama-swap -n ai) before scaling
      # this one up, and resume llama-swap when done comparing.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: amd.com/gpu.vram
                    operator: In
                    values: ["16G"]
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.kubernetes.io/gpu-tier
                    operator: In
                    values: ["dgpu"]
