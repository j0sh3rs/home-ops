---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openviking
spec:
  interval: 1h
  chart:
    spec:
      # Chart lives only as git source (deploy/helm/openviking/), no OCI
      # artifact or HelmRepository index published -- see gitrepository.yaml
      # for why this uses chart.spec.sourceRef: GitRepository instead of
      # this repo's usual OCIRepository+chartRef pattern. `version:` is
      # deliberately omitted: Flux resolves the chart from the
      # GitRepository's pinned ref directly, not via semver matching.
      chart: ./deploy/helm/openviking
      sourceRef:
        kind: GitRepository
        name: openviking
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    replicaCount: 1
    image:
      # Chart default tag is "latest" (moving); pin instead. This lags the
      # GitRepository ref (see gitrepository.yaml) -- volcengine publishes
      # chart-source git tags more often than container images, so
      # v0.4.5 can be (and has been) the newest published image for a
      # while even as the chart tag climbs well past it. The two are
      # tracked independently: gitrepository.yaml's ref.tag is handled by
      # Renovate's native flux manager (no annotation needed, confirmed via
      # git history: v0.4.5 -> v0.4.14 -> v0.4.15, all automatic), but this
      # image.tag is a plain Helm value with no native Renovate manager --
      # it needs the explicit annotation below or it silently never bumps.
      # renovate: datasource=docker depName=ghcr.io/volcengine/openviking
      tag: v0.4.17
      pullPolicy: IfNotPresent
    podAnnotations:
      # The chart's own deployment template already hashes the ConfigMap
      # (ov.conf) into a checksum/config pod annotation, so ConfigMap
      # edits already trigger a restart natively. Reloader is still needed
      # for the Secret side (extraEnv secretKeyRefs below) -- the chart
      # has no equivalent checksum for those.
      reloader.stakater.com/auto: "true"
    persistence:
      enabled: true
      # RocksDB local state (the chart itself enforces replicaCount: 1 --
      # "does not support concurrent access from multiple pods sharing the
      # same PVC"); openebs-hostpath matches this repo's storage-class
      # convention for single-pod, latency-sensitive local state (see
      # CLAUDE.md's storage class selection table).
      storageClass: openebs-hostpath
      accessMode: ReadWriteOnce
      size: 20Gi
    service:
      type: ClusterIP
      port: 1933
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        memory: 4Gi
    bot:
      # Enables VikingBot (the multi-channel Agent bundled in this image).
      # The chart wires this straight to the `--with-bot` server flag
      # (OPENVIKING_WITH_BOT env var in deployment.yaml) -- Scenario A from
      # the upstream vikingbot guide ("start OpenViking and the Bot
      # together"): the API server starts a bundled VikingBot Gateway on
      # localhost:18790 (server.bot_api_url default) in the same
      # container/process, no extra sidecar or service needed. VikingBot
      # inherits the root-level `vlm` block below as its Agent model by
      # default (no separate bot.agents config required) -- see
      # config.server.with_bot's proxy behavior: /bot/v1/* routes 503
      # until this is true.
      enabled: true
    config:
      server:
        host: "0.0.0.0"
        port: 1933
        # ${VAR} is a literal placeholder OpenViking itself resolves from
        # its own process env at config-load time (see extraEnv below and
        # secret.sops.yaml) -- not Flux postBuild substitution, and safe
        # to commit as-is (it's a template reference, not a secret value).
        root_api_key: "${OPENVIKING_ROOT_API_KEY}"
        # Chart default is ["*"] -- narrowed to deny-all. Every planned
        # consumer (openclaw, Claude Code CLI) is a non-browser API
        # client; CORS only governs browser cross-origin fetches, so this
        # has no functional effect on them, and there's no browser UI
        # consumer to justify any origin here. Revisit only if a browser-
        # based client is ever added.
        cors_origins: []
      # Embedding/VLM provider: routed through litellm (ai/litellm), not
      # straight at llama-swap-apu -- litellm sits in front of both
      # llama-swap instances for every other in-cluster consumer (argus)
      # as of the 2026-08-14 reintroduction; openviking was the last
      # direct-to-llama-swap holdout. api_base/model use litellm's model
      # aliases (ai/litellm/app/models/llama-swap-apu.yaml), not
      # llama-swap's own aliases directly.
      # provider: "openai" -- NOT "ollama". litellm (like llama-swap) is
      # an OpenAI-compatible proxy, not a real Ollama server; OpenViking's
      # "ollama" provider triggers a readiness probe against Ollama's
      # *native* /api/tags endpoint (openviking_cli/utils/ollama.py),
      # which litellm doesn't implement, permanently failing /ready with
      # "ollama: unreachable" even once embedding calls succeed. The
      # "openai" provider talks OpenAI-compatible /v1 only (what litellm
      # actually serves).
      # api_key: litellm requires a virtual key on every request (unlike
      # llama-swap, which has no auth) -- ${OPENVIKING_EMBEDDING_API_KEY}
      # and ${OPENVIKING_VLM_API_KEY} now hold a litellm virtual key
      # scoped to the `embedding`/`vlm` models (see secret.sops.yaml),
      # not a llama-swap placeholder.
      # dense.model is litellm's `embedding` alias (mirrors llama-swap-apu's
      # real `qwen3-embed` model) -- required for the embedding readiness
      # check, which depends on a live embedding call succeeding.
      # vlm.model is litellm's `vlm` alias -- llama-swap-apu's real
      # Qwen2-VL-2B-Instruct model, added 2026-08-19. Previously this
      # pointed at the text-only qwen3-embed as a placeholder just to
      # clear /ready; now it's a genuine vision-capable VLM.
      embedding:
        # allow_metadata_override: OpenViking stamps the embedding
        # provider/model identity into stored vector collection metadata
        # and refuses to boot on a mismatch (EmbeddingRebuildRequiredError)
        # -- tripped here because the route changed (llama-swap-apu direct
        # -> litellm), even though it's the same underlying qwen3-embed
        # weights at the same 1024 dimension. Safe to override since the
        # dimension is unchanged; only set this when you've verified that.
        allow_metadata_override: true
        dense:
          api_base: "http://litellm.ai.svc.cluster.local:4000/v1"
          api_key: "${OPENVIKING_EMBEDDING_API_KEY}"
          provider: "openai"
          dimension: 1024
          model: "embedding"
          input: "text"
        max_concurrent: 10
      # timeout/max_retries/max_concurrent tuned 2026-08-19 after repeated
      # openai.APITimeoutError failures during Phase 2 long_term memory
      # extraction (bee-jms-03/qwen2-vl-2b). Root cause confirmed via the
      # pinned v0.4.15 image's actual source (openviking_cli/utils/config's
      # VLMConfig + session.py): the chart default `timeout` is 600s per
      # HTTP attempt, and session.py wraps every vlm call in its OWN retry
      # loop (hardcoded _MEMORY_EXTRACTION_MAX_RETRIES=3 -> 4 attempts) on
      # top of the vlm-client layer's own max_retries (2 -> 3 attempts) --
      # worst case was 4*3=12 raw attempts * 600s = up to 2 hours with no
      # real ceiling. timeout: 90 + max_retries: 1 (2 attempts at this
      # layer) bounds the compounded worst case to 4*2*90s = 720s (~12
      # min), matching the operator's 10-15 min ceiling for "slow is fine,
      # hung is not". max_concurrent dropped 100 -> 20: 100 let requests
      # pile up against one small model process on a 5-model, VRAM-tight
      # node (llama-swap-apu, 1.88 GiB free), stretching real per-request
      # latency and making the retries above pile onto an already-congested
      # backend instead of a merely slow one. Revert toward the prior
      # values (600/2/100) if legitimate slow-but-healthy VLM calls start
      # getting killed early -- watch for a rise in ERROR-level "Phase 2
      # step long_term failed" logs with APITimeoutError specifically at
      # ~90s elapsed (vs. genuine backend unavailability, which fails fast).
      vlm:
        api_base: "http://litellm.ai.svc.cluster.local:4000/v1"
        api_key: "${OPENVIKING_VLM_API_KEY}"
        provider: "openai"
        model: "vlm"
        temperature: 0.0
        timeout: 90
        max_retries: 1
        thinking: false
        max_concurrent: 20
      # Rerank: routed through litellm, added 2026-08-19. `rerank` is a
      # top-level config key (sibling of `embedding`/`vlm`, NOT nested
      # under `retrieval`). model MUST be "litellm_proxy/rerank" -- OpenViking's
      # litellm rerank client calls the litellm Python SDK directly
      # (litellm.rerank(model=...)), so it needs the litellm_proxy/ prefix
      # to know "rerank" is a model_name on ANOTHER litellm proxy rather
      # than a raw provider name -- same chaining case as argus's
      # litellm_proxy/coder-large (see ai/argus's HelmRelease comment).
      # Plain "litellm/rerank" or "rerank" would misroute. api_base is the
      # bare litellm proxy root (NO /v1) -- the SDK's Cohere-shaped
      # transform appends /v1/rerank itself.
      rerank:
        provider: "litellm"
        model: "litellm_proxy/rerank"
        api_base: "http://litellm.ai.svc.cluster.local:4000"
        api_key: "${OPENVIKING_RERANK_API_KEY}"
      retrieval:
        # hotness_alpha: 0 (chart default) disables recency entirely --
        # pure relevance ranking. 0.2 gives a modest recency nudge (relevance
        # still dominates; a newer memory edges out an older one of similar
        # relevance) -- a taste call for a personal/dynamic knowledge base,
        # not a correctness fix. Confirmed present in the pinned v0.4.5
        # image's config schema (openviking_cli/utils/config/
        # retrieval_config.py at the v0.4.5 tag) before setting.
        hotness_alpha: 0.2
      memory:
        # session_skill_extraction_enabled: extract reusable skills from
        # sessions in addition to long-term memories (extraction_enabled,
        # already true by default). Added 2026-08-19 -- the skill registry
        # was sitting empty despite being wired into this session's
        # openviking-context hook. Confirmed present in the pinned v0.4.5
        # image's config schema before enabling (openviking_cli/utils/
        # config/memory_config.py at the v0.4.5 tag) -- docs.openviking.ai
        # tracks a newer git tag than the published image and has drifted
        # ahead before (see the `ingest` CLI subcommand, which is
        # documented but not present in v0.4.5).
        session_skill_extraction_enabled: true
    extraEnv:
      - name: OPENVIKING_ROOT_API_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secret
            key: OPENVIKING_ROOT_API_KEY
      - name: OPENVIKING_EMBEDDING_API_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secret
            key: OPENVIKING_EMBEDDING_API_KEY
      - name: OPENVIKING_VLM_API_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secret
            key: OPENVIKING_VLM_API_KEY
      - name: OPENVIKING_RERANK_API_KEY
        valueFrom:
          secretKeyRef:
            name: openviking-secret
            key: OPENVIKING_RERANK_API_KEY
