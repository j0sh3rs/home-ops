---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app holmesgpt
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: holmes
      version: "0.39.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    podAnnotations:
      reloader.stakater.com/auto: "true"

    # Bundled Operator (HealthCheck / ScheduledHealthCheck / TriggeredHealthCheck
    # CRDs + controller). No HealthCheck resources are created in this pass —
    # just the controller, to prove the deployment path.
    operator:
      enabled: true

    # Disable the Robusta SaaS-backed toolset — this cluster has no Robusta
    # account, and leaving it enabled just produces noisy "not configured"
    # log lines at startup.
    #
    # bash (extended allowlist) and internet toolsets are left at chart
    # defaults (enabled) for this POC. Combined with the cluster-wide
    # read-only ClusterRole and an unauthenticated in-cluster Service,
    # this means anything in-cluster that can reach holmesgpt-holmes:80
    # can drive shell/internet-capable investigation. Acceptable for a
    # cluster-internal POC; revisit with a NetworkPolicy or auth layer
    # if this graduates past POC (see home-ops-4rm). Same caveat now also
    # covers Grafana/Prometheus/VictoriaLogs/Postgres read access below —
    # tracked as a follow-up hardening bead, not fixed in this pass.
    #
    # Every key in holmesgpt-secrets is mounted as an env var so toolset
    # config below can reference it via Holmes's own {{ env.VAR }}
    # templating (a runtime Jinja2 render, distinct from Helm's own
    # templating — this string is inert to Helm, Holmes reads it at boot).
    extraEnvVarsSecrets:
      - holmesgpt-secrets
      - litellm-secret

    toolsets:
      robusta:
        enabled: false
      prometheus/metrics:
        enabled: true
        subtype: victoriametrics
        config:
          prometheus_url: https://metrics.68cc.io
      # grafana.68cc.io sits behind the authentik-forwardauth Middleware on
      # PathPrefix "/" (kubernetes/apps/monitoring/grafana/instance/httproute.yaml)
      # — a Grafana service-account token is not an Authentik credential, so
      # the outpost 302s before Grafana ever sees the request. Point at the
      # in-cluster Service instead, same pattern as llama-swap below.
      grafana/dashboards:
        enabled: true
        config:
          api_key: "{{ env.GRAFANA_API_KEY }}"
          api_url: http://grafana-service.monitoring.svc.cluster.local:3000
      victorialogs:
        enabled: true
        config:
          api_url: https://logs.68cc.io
          headers:
            AccountID: "0"
            ProjectID: "0"
        # Vector (kubernetes/apps/monitoring/vector/app/helmrelease.yaml) sets
        # VL-Stream-Fields to these exact field names -- without this hint the
        # model guesses a generic "namespace" field and silently gets zero
        # hits (confirmed live: home-ops-c14 post-merge verification).
        llm_instructions: "Log stream fields are: stream, kubernetes.pod_name, kubernetes.container_name, kubernetes.pod_namespace (NOT 'namespace'), app_name, hostname. Message content is in the 'log' field."
      # Cluster-level Postgres stats only (pg_monitor role) — deliberately
      # NOT granted access to any individual app database's table data.
      # See kubernetes/apps/databases/cloudnative-pg/cluster/cluster.yaml
      # for the holmesgpt_ro role definition.
      postgres17-stats:
        type: database
        enabled: true
        llm_instructions: "Cluster-level PostgreSQL statistics only (pg_monitor). No table data access -- use pg_stat_activity, pg_locks, pg_stat_replication."
        config:
          connection_url: "{{ env.POSTGRES_CONNECTION_URL }}"
      # cilium/core and hubble/observability were evaluated 2026-08-18 and
      # NOT enabled: the holmes container image (robusta/holmes chart
      # 0.39.0) does not bundle the cilium or hubble CLI binaries --
      # `kubectl exec ... -- cilium version` / `hubble version` both fail
      # with "executable file not found in $PATH". Enabling either toolset
      # here would register a tool that fails its own preflight check.
      # helm is present (v3.21.0), so helm/core is enabled below. Tracked
      # as a follow-up bead for the missing CLI binaries.
      helm/core:
        enabled: true

    # LLM backend: LiteLLM proxy in front of both llama-swap instances
    # (reintroduced 2026-08-18, see kubernetes/apps/ai/litellm/). coder-large
    # (Qwen3-Coder-30B-A3B, MoE, 49152 ctx) is the only fleet model confirmed
    # tool-calling-safe under a heavy toolset registry -- same model openclaw
    # already uses successfully for its own agentic harness. Auth reuses
    # litellm-secret (litellm/app/secret.sops.yaml) directly via
    # extraEnvVarsSecrets below -- not duplicated into holmesgpt-secrets.
    modelList:
      litellm:
        # litellm_proxy/ (not litellm/) is the LiteLLM SDK's required prefix
        # for calling another LiteLLM proxy server as the backend -- see
        # https://docs.litellm.ai/docs/providers/litellm_proxy. Confirmed
        # live 2026-08-18: "litellm/coder-large" 500s with
        # "LLM Provider NOT provided".
        model: litellm_proxy/coder-large
        api_base: http://litellm.ai.svc.cluster.local:4000/v1
        api_key: "{{ env.LITELLM_MASTER_KEY }}"

    resources:
      requests:
        cpu: 100m
        memory: 2048Mi
      limits:
        memory: 2048Mi
