---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app openclaw
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      # openclaw is granted cluster-admin (see rbac.yaml); mount its SA token.
      automountServiceAccountToken: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    serviceAccount:
      openclaw: {}
    controllers:
      openclaw:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # memini (memory plugin) removed 2026-08-16 -- this used to
          # install it from ClawHub onto the PVC on first boot. The
          # already-installed extension files remain harmlessly at
          # /home/node/.openclaw/extensions/memini on the retained PVC
          # (plugins.allow no longer trusts it, so it won't auto-load);
          # delete that directory manually if reclaiming the disk space
          # matters.
          #
          # openviking claims the memory plugin slot (plugins.slots.memory)
          # but is not a bundled extension -- it must be installed from
          # ClawHub onto the PVC once, same mechanism memini used. Guarded
          # on the extension dir so this is a no-op after the first boot.
          # Must run BEFORE init-config (name sorts first -- bjw-s renders
          # initContainers in key order): `openclaw plugins install`
          # validates openclaw.json first and refuses to run while it
          # already claims the not-yet-installed openviking slot, so any
          # config left on the PVC from a prior boot is cleared here too.
          # init-config always overwrites it afterward regardless, so this
          # is safe on every boot, not just the first.
          00-install-openviking-plugin:
            image:
              repository: ghcr.io/openclaw/openclaw
              tag: 2026.7.1
            env:
              HOME: /home/node
            command:
              - sh
              - -c
              - |
                set -eu
                if [ ! -d /home/node/.openclaw/extensions/openviking ]; then
                  rm -f /home/node/.openclaw/openclaw.json
                  openclaw plugins install clawhub:@openviking/openclaw-plugin
                fi
          init-config:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /home/node/.openclaw
                cp /tmp/openclaw.json /home/node/.openclaw/openclaw.json
                chmod 600 /home/node/.openclaw/openclaw.json
                mkdir -p /home/node/.openclaw/workspace-automation
                cp /tmp/automation-AGENTS.md /home/node/.openclaw/workspace-automation/AGENTS.md
          # GitHub CLI on the PVC at ~/.local/bin (on PATH for the agent's exec
          # tool). Auth comes from the GITHUB_TOKEN env, so no `gh auth login`.
          install-gh:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - |
                set -eu
                # renovate: datasource=github-releases depName=cli/cli
                GH_VERSION=2.97.0
                BIN=/home/node/.local/bin
                mkdir -p "$BIN"
                if [ "$(cat "$BIN/.ghver" 2>/dev/null)" != "$GH_VERSION" ]; then
                  wget -qO /tmp/gh.tar.gz "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
                  tar -xzf /tmp/gh.tar.gz -C /tmp
                  cp "/tmp/gh_${GH_VERSION}_linux_amd64/bin/gh" "$BIN/gh"
                  chmod +x "$BIN/gh"
                  printf '%s' "$GH_VERSION" > "$BIN/.ghver"
                  rm -rf /tmp/gh.tar.gz "/tmp/gh_${GH_VERSION}_linux_amd64"
                fi
        containers:
          app:
            image:
              repository: ghcr.io/openclaw/openclaw
              # renovate: datasource=docker depName=ghcr.io/openclaw/openclaw
              tag: 2026.7.1
            command:
              - /bin/sh
              - -c
              - |
                set -eu
                # Persist gh credentials to the on-disk config. openclaw's exec
                # tool strips secret env vars (GITHUB_TOKEN included), so the
                # agent can't auth gh from the env — but it does read
                # ~/.config/gh on the PVC. Re-runs each boot so token rotation
                # is picked up.
                if [ -n "$GITHUB_TOKEN" ] && [ "$GITHUB_TOKEN" != "CHANGEME" ]; then
                  printf '%s' "$GITHUB_TOKEN" | env -u GITHUB_TOKEN -u GH_TOKEN gh auth login --with-token >/dev/null 2>&1 \
                    && echo "gh: credentials persisted to ~/.config/gh" || echo "WARN: gh credential persist failed"
                fi
                # OpenClaw's config-integrity guard persists a self-saved
                # "last-good" snapshot on the PVC and restores it whenever the
                # config it reads lacks the runtime-injected "meta" block
                # (missing-meta-vs-last-good). Our GitOps ConfigMap copy never
                # has that meta block, so on every boot the guard would revert
                # to a stale snapshot and silently drop config changes. Drop
                # the persisted last-good/backup/health state so the gateway
                # adopts the current ConfigMap-derived config as the new
                # baseline. git is the source of truth for this deployment.
                rm -f "${CFG}.last-good" "${CFG}".bak* /home/node/.openclaw/logs/config-health.json
                # Automations live in the Gateway's own SQLite state, not in
                # this ConfigMap -- they must be created via the CLI/API
                # against the *running* gateway. Background a watcher that
                # waits for health, then idempotently (guarded by a marker
                # file on the PVC) creates the two scheduled jobs, so this is
                # safe to re-run on every pod restart.
                (
                  # Both jobs --announce to a Discord channel. Until the bot
                  # is real (Task 5's manual follow-up) that channel ID is a
                  # placeholder, so provisioning them now would schedule
                  # unattended agent runs nobody can see. Same CHANGEME idiom
                  # as the gh auth gate above: once a real token lands and the
                  # pod restarts, provisioning activates on its own with no
                  # further code change.
                  if [ -n "$DISCORD_BOT_TOKEN" ] && [ "$DISCORD_BOT_TOKEN" != "CHANGEME" ]; then
                    # Bounded health poll. wget (not curl) because wget is the
                    # only fetcher this image is confirmed to ship -- see the
                    # install-gh initContainer. 60 x 5s = 5 minutes, then give
                    # up loudly instead of spinning silently for the pod's
                    # whole life.
                    ready=1
                    i=0
                    until wget -q -O /dev/null http://127.0.0.1:18789/healthz 2>/dev/null; do
                      i=$((i+1))
                      if [ "$i" -ge 60 ]; then
                        echo "WARN: gateway /healthz never became ready after 5m, skipping automations provisioning"
                        ready=0
                        break
                      fi
                      sleep 5
                    done
                    MARKER=/home/node/.openclaw/.automations-provisioned-v1
                    if [ "$ready" = "1" ] && [ ! -f "$MARKER" ]; then
                      # Only mark provisioning done if BOTH creates succeeded --
                      # otherwise the marker would permanently suppress retries
                      # on every future restart.
                      ok=1
                      openclaw automations create --name hygiene-audit \
                        --cron "0 6 * * *" --tz America/New_York \
                        --agent automation --session isolated \
                        --message "Run the repo's own hygiene checks: bd stale, bd orphans, task sops:verify. Summarize findings; file bd issues for anything actionable. Do not modify any files." \
                        --announce --channel discord --to "channel:<Discord channel ID from Task 5>" \
                        || { echo "WARN: hygiene-audit automation create failed"; ok=0; }
                      openclaw automations create --name gh-issues-sweep \
                        --every 30m \
                        --agent automation --session isolated \
                        --message "Run gh-issues j0sh3rs/home-ops --cron --label openclaw-sweep. Follow your AGENTS.md guardrail on risk/critical paths." \
                        --announce --channel discord --to "channel:<Discord channel ID from Task 5>" \
                        || { echo "WARN: gh-issues-sweep automation create failed"; ok=0; }
                      if [ "$ok" = "1" ]; then
                        touch "$MARKER"
                      fi
                    fi
                  else
                    echo "Discord not configured yet, skipping automations provisioning"
                  fi
                ) &
                exec node dist/index.js gateway --bind lan
            env:
              HOME: &homepath /home/node
              CFG: /home/node/.openclaw/openclaw.json
              TZ: America/New_York
              # Prepend ~/.local/bin so the agent's exec tool finds gh (and any
              # other PVC-installed binaries). /usr/local/bin keeps node on PATH.
              PATH: /home/node/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              OPENCLAW_GATEWAY_PORT: &port 18789
              OPENCLAW_LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: openclaw-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 4Gi
          # Kubernetes MCP server sidecar. Auto-detects in-cluster config and
          # so uses the pod's ServiceAccount token (cluster-admin). Listens on
          # localhost:8081; openclaw reaches it in-pod.
          kube-mcp:
            image:
              repository: ghcr.io/containers/kubernetes-mcp-server
              tag: v0.0.66
            args: ["--port", "8081"]
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
          # code-server sidecar to browse openclaw's config/state on the PVC.
          # Password-protected with the gateway token — this pod holds a
          # cluster-admin token, so never expose it unauthed.
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.132.0
            env:
              HOME: *homepath
              TZ: America/New_York
              PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: openclaw-secret
                    key: OPENCLAW_GATEWAY_TOKEN
            args:
              - --auth
              - password
              - --user-data-dir
              - /home/node/.vscode
              - --extensions-dir
              - /home/node/.vscode
              - --port
              - "12321"
              - /home/node/.openclaw
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 20Gi
        retain: true
        globalMounts:
          - path: *homepath
      configmap:
        type: configMap
        name: openclaw-config
        defaultMode: 0644
        globalMounts:
          - path: /tmp/openclaw.json
            subPath: openclaw.json
      automation-agents-md:
        type: configMap
        name: openclaw-automation-agents-md
        defaultMode: 0644
        globalMounts:
          - path: /tmp/automation-AGENTS.md
            subPath: AGENTS.md
      # GitOps-managed skills bundle. Each ConfigMap key is mounted to its own
      # /skills/<name>/SKILL.md (OpenClaw discovers skills by the SKILL.md
      # filename); skills.load.extraDirs in openclaw.json points at /skills.
      skills:
        type: configMap
        name: openclaw-skills
        defaultMode: 0644
        globalMounts:
          - path: /skills/prometheus/SKILL.md
            subPath: prometheus.md
          - path: /skills/victorialogs/SKILL.md
            subPath: victorialogs.md
          - path: /skills/kubernetes-events/SKILL.md
            subPath: kubernetes-events.md
          - path: /skills/flux/SKILL.md
            subPath: flux.md
      tmp:
        type: emptyDir
    service:
      app:
        controller: *app
        ports:
          http:
            primary: true
            port: *port
          codeserver:
            port: &codeserverPort 12321
    route:
      # Moved to traefik-external-gateway 2026-08-16 for off-network browser
      # access. Still behind Authentik forwardAuth (unlike the remote route
      # below) -- browsers can complete the interactive SSO redirect fine,
      # unlike the CLI/mobile clients remote exists for. Same protection
      # model as before (Authentik), just reachable via the Cloudflare
      # tunnel now instead of LAN-only.
      app:
        hostnames: ["openclaw.68cc.io"]
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.15
        parentRefs:
          - name: traefik-external-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authentik-forwardauth
            backendRefs:
              - name: *app
                port: *port
      codeserver:
        hostnames: ["openclaw-code.68cc.io"]
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.17
        parentRefs:
          - name: traefik-internal-gateway
            namespace: network
        rules:
          - filters:
              - type: ExtensionRef
                extensionRef:
                  group: traefik.io
                  kind: Middleware
                  name: authentik-forwardauth
            backendRefs:
              - name: *app
                port: *codeserverPort
      # Second, internet-facing surface for mobile/CLI device pairing and
      # off-network access. Deliberately NOT behind Authentik forwardAuth:
      # OpenClaw's own docs warn that interactive SSO blocks non-browser
      # clients (mobile apps, CLI) that can't complete an OAuth redirect,
      # and recommend the gateway's own token auth instead -- already the
      # real access boundary here (gateway.auth.mode: "token"), hardened
      # by Traefik TLS + CrowdSec + the Cloudflare tunnel, same as every
      # other public route in this repo. openclaw.68cc.io (browser) also
      # moved to traefik-external-gateway 2026-08-16, but keeps Authentik
      # forwardAuth -- different protection model, same external gateway.
      remote:
        hostnames: ["openclaw-remote.68cc.io"]
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.15
        parentRefs:
          - name: traefik-external-gateway
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: *port
