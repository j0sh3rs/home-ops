---
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm versioning=regex:^v(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-stable$
  image: ghcr.io/berriai/litellm:v1.83.14-stable@sha256:d6401c001f90f3bab4bb23c5fd6d9302a7df58999ec6fa9e3f175e1f5f26544b
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    redis_password: os.environ/REDIS_PASSWORD
    num_retries: 3
    timeout: 600
  litellmSettings:
    drop_params: true
    cache: true
    cache_params:
      type: redis
      host: os.environ/REDIS_HOST
      port: os.environ/REDIS_PORT
      password: os.environ/REDIS_PASSWORD
      db: os.environ/REDIS_DB
      # No ttl previously = cached forever. Agentic callers (openclaw,
      # holmesgpt) retrying an identical prompt after a transient backend
      # hiccup would get served the same stale/failed completion
      # indefinitely instead of a fresh attempt. 1h caps that blast radius
      # while still absorbing legitimate repeat-prompt traffic.
      ttl: 3600
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    # Shared dragonflydb instance (databases ns) — see
    # docs/runbooks/dragonflydb-db-allocation.md. DB 4 was freed 2026-08-14
    # (old LiteLLM removal); reused here for the reintroduced proxy.
    - name: REDIS_HOST
      value: dragonflydb.databases.svc.cluster.local
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_DB
      value: "4"
    # dragonflydb-auth is reflected into the ai namespace by Reflector from
    # databases/dragonflydb/instance/secret.sops.yaml — not owned here.
    - name: REDIS_PASSWORD
      valueFrom:
        secretKeyRef:
          name: dragonflydb-auth
          key: password
    - name: LITELLM_MASTER_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
    # Encrypts virtual key material + stored model credentials in Postgres
    # (DB mode). Must be set before any virtual key is generated — see
    # secret.sops.yaml comment. Zero virtual keys existed when this was
    # added, so no rotation-invalidation risk.
    - name: LITELLM_SALT_KEY
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: LITELLM_SALT_KEY
    # DB mode: admin UI model/key/team management + usage tracking. Backed
    # by the `litellm` database on the shared postgres17 CNPG cluster —
    # see kubernetes/apps/databases/cloudnative-pg/cluster/litellm-database.yaml
    # and litellm-role-secret.sops.yaml. Image runs prisma migrations
    # automatically on startup when this is set.
    - name: DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: litellm-secret
          key: DATABASE_URL
  podAnnotations:
    reloader.stakater.com/auto: "true"
  # Default probes (10s delay, period 10s, failure 3 -> dead by ~40s) fire
  # before the prisma migrate-on-boot + first DB/Redis connect finishes,
  # so kubelet was sending SIGTERM right as "Application startup complete"
  # printed — a race, not a hang. No startupProbe field on this CRD, so
  # loosen both probes directly instead.
  livenessProbe:
    httpGet:
      path: /health/liveliness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 10
  readinessProbe:
    httpGet:
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 30
    periodSeconds: 15
    timeoutSeconds: 5
    failureThreshold: 10
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      # DB mode (prisma client + migration burst on cold start) OOMKilled at
      # 1Gi within ~13s of boot, before any log line. Generous headroom here
      # deliberately — resize down later once steady-state usage is known.
      memory: 4Gi
  service:
    type: ClusterIP
    port: 4000
  # No spec.route block here — the LAN-only HTTPRoute is hand-written in
  # httproute.yaml instead, since the operator's route field can't carry
  # the external-dns target annotation. See httproute.yaml for why.
