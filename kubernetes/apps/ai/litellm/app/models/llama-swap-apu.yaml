---
# Mirrors llama-swap-apu's model catalog (bee-jms-03, iGPU) — source of
# truth is kubernetes/apps/ai/llama-swap-apu/app/configmap.yaml. Always-on,
# non-exclusive. coder-fim/fim (Continue.dev FIM autocomplete) was removed
# 2026-08-17 — Continue.dev is explicitly rejected, do not reintroduce.
# Aliases: fast, small, router.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: router
spec:
  modelName: router
  params:
    model: openai/router
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: embed, embedding. Moved from llama-swap.yaml 2026-08-17 — small,
# latency-tolerant, doesn't need dGPU horsepower. openviking is the real
# consumer (see kubernetes/apps/ai/openviking/app/helmrelease.yaml).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embedding
spec:
  modelName: embedding
  params:
    model: openai/embedding
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: chat, small-chat. Added 2026-08-18 — fills the "Chat" category
# on this tier with a DDR4-bandwidth-appropriate small model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chat
spec:
  modelName: chat
  params:
    model: openai/chat
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: vlm, vision. Added 2026-08-19 — openviking's real vision model
# (Qwen2-VL-2B-Instruct), routed through litellm instead of hitting
# llama-swap-apu directly. See llama-swap-apu configmap.yaml's
# qwen2-vl-2b comment for sizing/placement rationale.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: vlm
spec:
  modelName: vlm
  params:
    model: openai/vlm
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: rerank, reranker. Added 2026-08-19 — openviking's real rerank
# model (jina-reranker-v2), routed through litellm. Uses the `infinity/`
# provider, NOT `openai/` like every other entry in this file -- llama-
# server's rerank endpoints (/rerank, /v1/rerank, /v1/reranking) aren't
# the OpenAI chat/completions surface the other models use. apiBase is
# deliberately bare (NO /v1) -- litellm's infinity transform appends
# plain `/rerank` itself; giving it a `/v1` suffix here would double up
# to a path llama-server doesn't serve. This is the opposite convention
# from every other model in this file -- don't "fix" it to match them.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: rerank
spec:
  modelName: rerank
  params:
    model: infinity/rerank
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080
    apiKey: "not-needed"
