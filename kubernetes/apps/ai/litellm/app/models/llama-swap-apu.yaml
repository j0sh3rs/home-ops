---
# Mirrors llama-swap-apu's model catalog (bee-jms-03, iGPU) — source of
# truth is kubernetes/apps/ai/llama-swap-apu/app/configmap.yaml. Always-on,
# non-exclusive. coder-fim/fim (Continue.dev FIM autocomplete) was removed
# 2026-08-17 — Continue.dev is explicitly rejected, do not reintroduce.
# Aliases: fast, small, router.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: router
spec:
  modelName: router
  params:
    model: openai/router
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: embed, embedding. Moved from llama-swap.yaml 2026-08-17 — small,
# latency-tolerant, doesn't need dGPU horsepower. openviking is the real
# consumer (see kubernetes/apps/ai/openviking/app/helmrelease.yaml).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embedding
spec:
  modelName: embedding
  params:
    model: openai/embedding
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: chat, small-chat. Added 2026-08-18 — fills the "Chat" category
# on this tier with a DDR4-bandwidth-appropriate small model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chat
spec:
  modelName: chat
  params:
    model: openai/chat
    apiBase: http://llama-swap-apu.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
