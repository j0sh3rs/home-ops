---
# Aliases: frontier, frontier-chat. Decode-broken on gfx1201/RADV
# (llama.cpp #26795, ~4 tok/s) — mirrored because llama-swap still serves
# it, but do not route interactive/agentic traffic here until re-benched.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-chat
spec:
  modelName: frontier-chat
  params:
    model: openai/frontier-chat
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: embed, embedding. Always-on group.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embedding
spec:
  modelName: embedding
  params:
    model: openai/embedding
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: rerank, reranker. Always-on group.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reranker
spec:
  modelName: reranker
  params:
    model: openai/reranker
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
