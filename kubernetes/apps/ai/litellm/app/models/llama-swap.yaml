---
# Mirrors llama-swap's model catalog (bigboi-jms-01, dGPU) — source of truth
# for aliases is kubernetes/apps/ai/llama-swap/app/configmap.yaml.
# No auth required for cluster-internal llama-swap traffic — apiKey is a
# placeholder, not a secret. embedding moved to llama-swap-apu.yaml (embed
# model relocated to bee-jms-03 2026-08-17). dense-floor (qwen3-14b)
# retired same day, once qwen3.6-27b's ctx-size/VRAM check confirmed it as
# a safe openclaw primary replacement — qwen3.6-27b itself was then
# retired 2026-08-18 in favor of the MoE qwen3.5-35b-a3b below (dense
# decode too slow). gpt-oss-20b (reasoning) mirror added same day —
# fills the gap left when the original `reasoner` was dropped 2026-08-17.
# Aliases: coder, code-large, coder-large — openclaw's primary model
# (reverted from qwen3.6-27b 2026-08-17, ~7x faster MoE decode) and
# holmesgpt's model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coder-large
spec:
  modelName: coder-large
  params:
    model: openai/coder-large
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: frontier, frontier-chat. Underlying model swapped 2026-08-18:
# dense qwen3.6-27b (was openclaw's primary for <1 day on 2026-08-17,
# reverted for ~17.83 tok/s decode at 20K prompt depth) -> MoE
# qwen3.5-35b-a3b (3B active params, same speed class as coder-large,
# beats qwen3.6-27b on most benchmarks — see llama-swap configmap.yaml).
# Alias name unchanged, no consumer config changes needed.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-chat
spec:
  modelName: frontier-chat
  params:
    model: openai/frontier-chat
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: reasoner, reasoning. New 2026-08-18 — fills the gap left when
# the original `reasoner` (Qwen3-30B-Thinking) was dropped 2026-08-17 for
# zero consumers. gpt-oss-20b: MoE, 3.6B active, dominant reasoning/math
# benchmarks (aime 98.7, mmlu_pro 85.3). See llama-swap configmap.yaml.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoner
spec:
  modelName: reasoner
  params:
    model: openai/reasoner
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
