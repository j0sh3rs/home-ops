---
# Mirrors llama-swap's model catalog (bigboi-jms-01, dGPU) — source of truth
# for aliases is kubernetes/apps/ai/llama-swap/app/configmap.yaml.
# No auth required for cluster-internal llama-swap traffic — apiKey is a
# placeholder, not a secret. chat/reasoning/gpt-oss/reranker mirrors removed
# 2026-08-17: those models had zero confirmed consumers and were dropped
# from llama-swap itself. embedding moved to llama-swap-apu.yaml (embed
# model relocated to bee-jms-03 the same day). dense-floor (qwen3-14b)
# retired same day too, once qwen3.6-27b's ctx-size/VRAM check confirmed
# it as a safe openclaw primary replacement.
# Aliases: coder, code-large, coder-large — openclaw's primary model
# (reverted from qwen3.6-27b 2026-08-17, ~7x faster MoE decode) and
# holmesgpt's model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coder-large
spec:
  modelName: coder-large
  params:
    model: openai/coder-large
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: frontier, frontier-chat. Was openclaw's primary for less than
# a day (2026-08-17) — reverted to coder-large once real-world use showed
# the dense-model decode cost (~17.83 tok/s at 20K prompt depth) vs
# coder-large's MoE speed. Highest static quality in the fleet (whichllm
# 87.3 vs 79.2); available via /model when quality matters more than
# speed. The earlier "decode-broken on gfx1201/RADV" warning (llama.cpp
# #26795, ~4 tok/s) did NOT reproduce on retest (~30.8 tok/s sustained
# decode on a near-empty context).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-chat
spec:
  modelName: frontier-chat
  params:
    model: openai/frontier-chat
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
