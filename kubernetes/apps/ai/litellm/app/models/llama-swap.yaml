---
# Mirrors llama-swap's model catalog (bigboi-jms-01, dGPU) — source of truth
# for aliases is kubernetes/apps/ai/llama-swap/app/configmap.yaml.
# No auth required for cluster-internal llama-swap traffic — apiKey is a
# placeholder, not a secret. chat/reasoning/gpt-oss/reranker mirrors removed
# 2026-08-17: those models had zero confirmed consumers and were dropped
# from llama-swap itself. embedding moved to llama-swap-apu.yaml (embed
# model relocated to bee-jms-03 the same day).
# Aliases: coder, code-large, coder-large — openclaw's primary model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coder-large
spec:
  modelName: coder-large
  params:
    model: openai/coder-large
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: large, dense-floor.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: dense-floor
spec:
  modelName: dense-floor
  params:
    model: openai/dense-floor
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: frontier, frontier-chat. Decode-broken on gfx1201/RADV
# (llama.cpp #26795, ~4 tok/s) — mirrored because llama-swap still serves
# it, but do not route interactive/agentic traffic here until re-benched.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: frontier-chat
spec:
  modelName: frontier-chat
  params:
    model: openai/frontier-chat
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
