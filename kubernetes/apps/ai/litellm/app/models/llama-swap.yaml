---
# Mirrors llama-swap's model catalog (bigboi-jms-01, dGPU) — source of truth
# for aliases is kubernetes/apps/ai/llama-swap/app/configmap.yaml.
# No auth required for cluster-internal llama-swap traffic — apiKey is a
# placeholder, not a secret.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chat
spec:
  modelName: chat
  params:
    model: openai/chat
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: coder, code-large, coder-large — openclaw's primary model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: coder-large
spec:
  modelName: coder-large
  params:
    model: openai/coder-large
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: think, reasoning.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: reasoning
spec:
  modelName: reasoning
  params:
    model: openai/reasoning
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: tool-agent, gpt-oss.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-oss
spec:
  modelName: gpt-oss
  params:
    model: openai/gpt-oss
    apiBase: http://llama-swap.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed"
---
# Aliases: large, dense-floor.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
