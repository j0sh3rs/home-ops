---
fullnameOverride: coredns
image:
  repository: mirror.gcr.io/coredns/coredns
replicaCount: 2
k8sAppLabelOverride: kube-dns
serviceAccount:
  create: true
service:
  name: kube-dns
  clusterIP: 10.43.0.10
prometheus:
  service:
    enabled: true
  monitor:
    enabled: true
servers:
  - zones:
      - zone: .
        scheme: dns://
        use_tcp: true
    port: 53
    plugins:
      - name: errors
      - name: health
        configBlock: |-
          lameduck 5s
      - name: ready
      - name: kubernetes
        parameters: cluster.local in-addr.arpa ip6.arpa
        configBlock: |-
          pods verified
          fallthrough in-addr.arpa ip6.arpa
      - name: autopath
        parameters: "@kubernetes"
      - name: template
        parameters: IN AAAA .
        configBlock: |-
          rcode NXDOMAIN
        # Cilium has enable-ipv6: false cluster-wide and always will on this
        # homelab (kube-system/cilium/app/helm/values.yaml has no ipv6.enabled
        # override -- chart default false, confirmed live in cilium-config).
        # Pods have no usable IPv6 route, but Go's pure-Go resolver (used by
        # statically-built Go binaries -- e.g. flate in CI) doesn't reliably
        # filter AAAA candidates the way glibc/musl's AI_ADDRCONFIG does, so
        # it still dials AAAA-resolved addresses and gets a hard
        # "network is unreachable". NXDOMAIN-ing AAAA here means no client
        # ever sees a IPv6 candidate to begin with, regardless of how well
        # (or poorly) it implements IPv4 fallback. Must come before `forward`
        # so external AAAA queries never reach the upstream resolver either.
      - name: forward
        parameters: . /etc/resolv.conf
      - name: cache
        configBlock: |-
          prefetch 20
          serve_stale
      - name: loop
      - name: reload
      - name: loadbalance
      - name: prometheus
        parameters: 0.0.0.0:9153
      - name: log
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
# Spread the 2 replicas across nodes. ScheduleAnyway so a single-node
# failure doesn't block the surviving replica from rescheduling somewhere
# (which would be DNS-fatal). All 3 nodes are control-plane so the
# nodeAffinity above doesn't restrict the spread.
topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        k8s-app: kube-dns
        app.kubernetes.io/name: coredns
