---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes.github.io/autoscaler
      chart: vertical-pod-autoscaler
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: kube-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Goldilocks creates VPAs in Off mode. Keep recommendations advisory
    # until at least two weeks of representative usage have been reviewed.
    recommender:
      enabled: true
      # Avoid the default 250Mi recommendation floor masking small workloads.
      # These are recommendation floors, not resource limits.
      extraArgs:
        - --pod-recommendation-min-cpu-millicores=25
        - --pod-recommendation-min-memory-mb=32
        - --recommender-interval=1m

    # The updater does not resize or evict workloads whose VPA is Off.
    # Pilot InPlaceOrRecreate per workload after review; it can fall back
    # to eviction. Retain disruption checks during that pilot.
    updater:
      enabled: true
      extraArgs:
        - --in-place-skip-disruption-budget=false

    # Admission mutation is also controlled by each VPA's updatePolicy.
    admissionController:
      enabled: true
      replicas: 2
