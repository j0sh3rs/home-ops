---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 30m
  chart:
    spec:
      # renovate: registryUrl=https://kubernetes.github.io/autoscaler
      chart: vpa
      version: 4.11.0
      sourceRef:
        kind: HelmRepository
        name: vpa
        namespace: kube-system
  install:
    createNamespace: true
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Recommender analyzes usage and writes resource recommendations to VPA
    # CRs. In "Off" mode it only recommends requests and limits without
    # applying them. Switch to "Update" (with InPlace strategy) after
    # reviewing recommendations for 2+ weeks to confirm limits are safe.
    recommender:
      enabled: true
      args:
        - --cert-dir=/tls
        - --policy-file=/etc/vpa/policies.yaml
        - --refresh=1m
        - --min-recommended-cpu=25m
        - --min-recommended-memory=32Mi
        - --resource-policy-file=/etc/vpa/resource-policies.yaml
      env: []
      # No securityContext overrides needed. Chart defaults are enough.

    # Updater rewrites deployed resources to apply VPA recommendations.
    # In "Off" mode (updateMode: "Off") it does nothing. Recommendations
    # are purely advisory. Change to "Update" with InPlace strategy after
    # validation.
    updater:
      enabled: true

    # Admission Controller injects VPA pod-replacements-strategy annotations
    # and handles pod replacement when recommendations change in "Update"
    # mode. We enable it alongside recommender and updater for full
    # functionality.
    admissionController:
      enabled: true
      replicas: 2
      args: []

    # VerticalPodAutoscaler CRD. The chart installs it as part of the
    # admission controller deployment. We set updateMode: "Off" as the
    # cluster default so recommendations are advisory until reviewed.
    # To override per-workload, label the deployment with:
    #   verticalpodautoscaler.autoscaling/vpaUpdates: "Update"
    #
    # Or label it:
    #   autoscaling.kubernetes.io/pod-replacements-strategy: "none"
    # to lock limits and keep the workload out of VPA entirely.
    api:
      enabled: true
