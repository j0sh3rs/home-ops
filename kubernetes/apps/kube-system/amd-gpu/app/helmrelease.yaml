---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: amd-gpu
  namespace: kube-system
spec:
  chart:
    spec:
      chart: gpu-operator-charts
      # renovate: datasource=helm depName=gpu-operator-charts registryUrl=https://rocm.github.io/gpu-operator
      version: v1.5.1
      sourceRef:
        kind: HelmRepository
        name: amd-gpu
        namespace: flux-system
  interval: 10m0s
  values:
    # KMM + NFD ship at chart defaults (both enabled). KMM stays idle here:
    # DeviceConfig (deviceconfig.yaml) sets driver.enable=false, scoped to
    # bigboi-jms-01 only, so KMM is never asked to build/DKMS-install a
    # driver — Talos's siderolabs/amdgpu extension already owns that. This
    # is what makes the operator safe on immutable Talos rootfs; see
    # CLAUDE.md "Decisions explicitly rejected" for the scoped-exception note.
    node-feature-discovery:
      enabled: true
    kmm:
      enabled: true
    # Chart auto-creates a second, broader DeviceConfig (selector
    # feature.node.kubernetes.io/amd-gpu=true, matches ANY AMD-GPU-PCI
    # node incl. bee-* once NFD labels it) via templates/default-deviceconfig.yaml
    # on fresh install. Our own scoped deviceconfig.yaml (dgpu, selector
    # node.kubernetes.io/gpu-tier=dgpu) already covers bigboi — disable the
    # chart's default to avoid duplicate device-plugin/labeller/metrics
    # daemonsets targeting the same node.
    crds:
      defaultCR:
        install: false
