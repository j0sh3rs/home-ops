---
# os:operator is the narrowest Talos role that may call EtcdDefragment
# (os:etcd:backup can only snapshot/status). It must be listed in
# talos/patches/controller/machine-features.yaml allowedRoles, or Talos
# refuses to mint the talos-etcd-defrag-secrets Secret.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talos-etcd-defrag-secrets
spec:
  roles:
    - os:operator
