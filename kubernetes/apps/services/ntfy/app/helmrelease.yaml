---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
# ntfy, cluster-internal only (no route). Message cache, users and web push
# live in the shared CNPG cluster's `ntfy` database (NTFY_DATABASE_URL in
# ntfy-secret); the PVC only holds attachments.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app ntfy
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      ntfy:
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/binwiederhier/ntfy
              # renovate: datasource=docker depName=docker.io/binwiederhier/ntfy
              tag: v2.38.3
            args: ["serve"]
            env:
              NTFY_LISTEN_HTTP: :8080
              NTFY_BASE_URL: https://ntfy.68cc.io
              NTFY_BEHIND_PROXY: "true"
              # Public via Cloudflare: nothing is readable/writable without a
              # user or token. Admin user comes from NTFY_AUTH_USERS (secret).
              NTFY_AUTH_DEFAULT_ACCESS: deny-all
              NTFY_ATTACHMENT_CACHE_DIR: /var/cache/ntfy/attachments
            envFrom:
              - secretRef:
                  name: ntfy-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /v1/health
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            runAsNonRoot: true
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
            targetPort: *port
    # No authentik-forwardAuth on purpose: the Android/iOS apps and API clients
    # use arbitrary /{topic}[/json|sse|ws|raw], /v1/* and /file/* paths and
    # can't follow a browser redirect, so no path allowlist can cover them.
    # ntfy enforces its own auth (deny-all default, basic auth / bearer tokens).
    route:
      app:
        annotations:
          external-dns.alpha.kubernetes.io/target: 192.168.35.15
        hostnames: ["ntfy.68cc.io"]
        parentRefs:
          - name: traefik-external-gateway
            namespace: network
        rules:
          - backendRefs:
              - name: *app
                port: 80
    persistence:
      attachments:
        type: persistentVolumeClaim
        storageClass: openebs-hostpath
        accessMode: ReadWriteOnce
        size: 2Gi
        retain: true
        globalMounts:
          - path: /var/cache/ntfy
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
