# Not wired into kustomization.yaml — no in-cluster consumer. Encrypted-at-rest
# store for the Omniroute inference key used to complete Home Assistant's
# "extended_openai_conversation" custom integration config flow (done live
# via the HA REST API, not a Helm value — no YAML setup path for HA config
# entries). Same rationale as mcp-secret.sops.yaml.
#
# Deliberately NOT a real OpenAI API key — HA's official "OpenAI Conversation"
# integration is hardcoded to api.openai.com and refuses custom base URLs, so
# this routes through Omniroute's OpenAI-compatible gateway instead, which
# fronts the CLIProxyAPI sidecar reusing the existing Codex/ChatGPT Plus
# subscription OAuth session (see ai-omniroute-revival-plan memory for the
# full ToS-risk context this was knowingly accepted under). Key name:
# "home-assistant-conversation" (Omniroute key id a03fd884-62f5-4e73-a910-
# b59fadfbd45a), compressionEnabled explicitly patched to false — Omniroute's
# default-on compression injects unmarked ponytail/i-have-adhd output-style
# content into requests, which is not something to hand a home-control LLM.
