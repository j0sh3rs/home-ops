---
# Consumers of atuin. :80 (API, sh.68cc.io) is reached by LAN atuin
# clients through traefik-external-gateway (network ns,
# app.kubernetes.io/name=traefik). :8080 (metrics) is scraped by
# monitoring/vmagent via the app ServiceMonitor (vmagent
# selectAllByDefault). No other consumers.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atuin-allow
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: atuin
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 80
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: vmagent
      ports:
        - port: 8080
          protocol: TCP
