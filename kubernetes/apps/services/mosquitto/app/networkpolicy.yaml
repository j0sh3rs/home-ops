---
# Baseline ingress deny-all. No in-cluster consumer of :1883 as of
# 2026-11-24 (Step 0 survey: no gatus check, no repo config referencing
# the mosquitto service). Add a from/ports rule when a real client appears.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mosquitto-allow
  namespace: services
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mosquitto
  policyTypes:
    - Ingress
  ingress: []
