---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gatus
spec:
  interval: 1h
  timeout: 10m
  chart:
    spec:
      chart: gatus
      version: "1.5.0"
      sourceRef:
        kind: HelmRepository
        name: twin
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # No ingress, no alerting config here - this instance is the
    # everyday-visibility layer feeding Homepage's status widget, not the
    # safety net (that's the NAS-hosted instance, which alerts on its own).
    # Checked in-cluster via Service DNS instead of public hostnames -
    # faster, no dependency on external DNS/Traefik for internal targets.
    config:
      endpoints:
        - name: homepage
          group: services
          url: "http://homepage.services.svc.cluster.local:3000/api/healthcheck"
          interval: 1m
          conditions:
            - "[STATUS] == 200"
        - name: vmsingle
          group: monitoring
          url: "https://metrics.68cc.io/health"
          interval: 1m
          conditions:
            - "[STATUS] == 200"
        - name: vlogs
          group: monitoring
          url: "https://logs.68cc.io/health"
          interval: 1m
          conditions:
            - "[STATUS] == 200"
    persistence:
      enabled: true
      storageClassName: openebs-hostpath
      size: 200Mi
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 128Mi
