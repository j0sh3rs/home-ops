apiVersion: v1
kind: Secret
metadata:
  name: openclaw-hooks-secret
  annotations:
    # Minimal, dedicated secret: the ONLY thing Alertmanager (monitoring) and
    # the Flux notification Provider (flux-system) need is the one bearer
    # token for openclaw's /hooks endpoint. Reflecting openclaw-secret itself
    # would mirror GITHUB_TOKEN, DISCORD_BOT_TOKEN, MEMINI_API_KEY and the
    # gateway/code-server password into both namespaces for no reason, so the
    # Reflector annotations live here instead of on openclaw-secret.
    reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
    reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: monitoring,flux-system
    reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
    reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: monitoring,flux-system
